/* =================== the comparison layer ================================
   Everything below exists to answer the one question a room always asks about
   a number on a dashboard: "is that true for everyone?"

   The trick is withData. Every renderer above reads the free variable DATA.
   During a comparison draw we point DATA at one filtered series, call the
   renderer that already exists, and point DATA straight back. That is why a
   comparison adds columns to ten reports without adding a second copy of any
   of them -- and why, with no comparison active, not one line below runs.

   Two rules are load-bearing, and both are the engine's:
     1. No comparison active => nothing changes. cmpOn() is false, every view
        takes its original branch, and the 50,000-row table is never built.
     2. A comparison that cannot be honoured must SAY SO. A stock, a
        pre-aggregate over a different window, or hand-authored copy has no
        per-user grain to filter, so it renders an em-dash with the reason
        attached -- never the unsegmented number, which would be
        indistinguishable from a null result and is the single most damaging
        thing this tool could teach.                                        */
function withData(d, fn){ const prev=DATA; DATA=d; try{ return fn(); } finally { DATA=prev; } }
function cmpOn(){ return CMP.length>0; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cno(what, why){ return `<div class="cno"><b>${what} is not split by your comparison.</b> ${why}</div>`; }
function DCOL(d){ return Math.abs(d)<1 ? 'var(--muted)' : d>0 ? 'var(--goodink)' : 'var(--critical)'; }
function ppTxt(d){ return `${d>0?'+':''}${d.toFixed(1)}pp`; }
function serHead(first){
  return `<tr><th>${first}</th>`+series().map(s=>

function emTd(why){ return `<td class="em" data-tip="<span class='tk'>Not split</span><br>${why}">&mdash;</td>`; }
/* Counts deliberately carry no delta. A comparison is a subset, so "-84% of the

   rates are compared, and only against column 0. */
function ctab(rows, first){
  const body=rows.map(r=>{
    const S=series();
    const vals=S.map(s=>{ try{ return r.get(s.data); }catch(e){ return null; } });
    const b=vals[0];
    const tds=vals.map((v,i)=>{
      if(v==null||!isFinite(v)) return emTd(r.why||'This report has no per-user grain to filter on.');
      /* A row that is a rate can supply nb() -- the numerator and denominator
         behind it -- and then the delta is tested rather than merely printed.
         get() alone hands back a rate with no bases, which is exactly enough
         to draw a confident-looking difference and not nearly enough to know
         whether it is one. Rows without nb keep the old bare delta. */
      let g=null;
      if(r.pp && i>0 && r.nb){
        try{ const A=r.nb(S[i].data), Z=r.nb(S[0].data);
             if(A&&Z&&A.base>0&&Z.base>0) g=ppGap(A.n,A.base,Z.n,Z.base); }catch(e){}
      }
      const dd = g ? gapSpan(g,' vs all')
               : (r.pp && i>0 && b!=null) ? `<span class="dd" style="color:${DCOL((v-b)*100)}">${ppTxt((v-b)*100)} vs all</span>` : '';
      return `<td class="big"${g?` data-tip="<span class='tk'>${esc(S[i].name)} &middot; ${esc(r.k)}</span><br><b>${r.fmt(v)}</b>${gapTip(g)}"`:''}>${r.fmt(v)}${dd}</td>`;
    }).join('');
    return `<tr><td class="${r.sub?'sub':''}">${r.k}</td>${tds}</tr>`;
  }).join('');

}
/* Rate table. get() returns {n, base} rather than a rate, because the base is
   the thing a room forgets: a 62% that rests on 240 users is a different object
   from a 62% that rests on 24,000, and baseTag prints the interval inline the
   moment the cell gets thin enough to matter. */
function rtab(rows, first){
  const body=rows.map(r=>{
    const S=series();
    const vals=S.map(s=>{ try{ return r.get(s.data); }catch(e){ return null; } });
    const b=vals[0];
    const bv=(b&&b.base)?b.n/b.base:null;
    const tds=vals.map((v,i)=>{
      if(v==null) return emTd(r.why||'This report has no per-user grain to filter on.');
      if(!v.base) return `<td class="em" data-tip="<span class='tk'>Nobody left in this cell</span><br>Your comparison excluded everyone who could have entered here. An empty cell is the segment working, not the data missing.">&mdash;</td>`;
      const p=v.n/v.base;
      const g=(i>0&&b&&b.base)?ppGap(v.n,v.base,b.n,b.base):null;
      const dd=g?gapSpan(g,' vs all'):(i>0&&bv!=null?`<span class="dd" style="color:${DCOL((p-bv)*100)}">${ppTxt((p-bv)*100)} vs all</span>`:'');

function funnelTab(){
  const S=series();
  /* The step-conversion delta needs the row ABOVE as well as this one -- conv

     previous row is why the cells are indexed rather than closed over. */
  const at=(s,i)=> (s.data.funnel && i>=0) ? s.data.funnel[i] : null;
  const body=BASE_DATA.funnel.map((f,i)=>{
    const cells=S.map(s=>at(s,i));
    const prev=S.map(s=>at(s,i-1));
    const b=cells[0];
    const tds=cells.map((c,j)=>{
      if(!c) return emTd('This series carries no funnel.');
      const g=(i>0&&j>0&&b&&prev[j]&&prev[0]&&prev[j].users>0&&prev[0].users>0)
                ? ppGap(c.users, prev[j].users, b.users, prev[0].users) : null;
      const sub = i===0 ? `<span class="dd" style="color:var(--muted);font-weight:600">entry</span>`
        : g ? `<span class="dd" style="color:${gapCol(g)}">${PCT(c.conv)} &middot; ${gapTxt(g)}${g.thin?' noise':''}</span>`
        : `<span class="dd" style="color:var(--muted)">${PCT(c.conv)}${j>0?'':' step conv.'}</span>`;
      return `<td class="big" data-tip="<span class='tk'>${esc(S[j].name)} &middot; ${f.stage}</span><br>${N(c.users)} users<br>${PCT(c.pctTop,1)} of that series' installs${i>0?`<br>step conversion <b>${PCT(c.conv,1)}</b>`:''}${gapTip(g)}">${N(c.users)}${sub}</td>`;
    }).join('');
    return `<tr><td>${f.stage}</td>${tds}</tr>`;
  }).join('');
  return `<div class="sfwrap"><table class="ctab">${serHead('Step')}${body}</table></div>
  <p class="csub" style="margin:8px 0 0">Big number = users reaching that step &middot; small number = conversion from the step above, with its distance from the all-users column and the 95% interval on that distance. A gap printed <b>grey</b> with the word <b>noise</b> is smaller than its own interval &mdash; the honest read is &ldquo;this step looks the same&rdquo;, and quoting it as a difference is the single easiest way to lose an audience that checks. <b>Read the small numbers.</b> A segment can be a twentieth the size of the whole and have exactly the same shape &mdash; that is a smaller audience. A segment whose shape breaks at one step is a different thing entirely, and only the second one is a bug.</p>`;
}
/* Grouped bars, scaled per series. A segment a twentieth the size of the whole
   would render as five hairlines against a shared axis, and the shape of a mix
   is the only reason to draw a mix at all. Numbers stay absolute. */
/* nb(data, key) -> {n, base} is optional and turns a bar chart of rates into a
   bar chart of rates that knows what it is standing on. Without it a 34% bar
   built on eleven users is drawn exactly as long, and in exactly the same
   colour, as a 34% bar built on eleven thousand -- and a bar is even easier to
   over-read than a table cell, because the length is doing the arguing. Count
   charts (sign-ups, event volumes, steps after verification) pass no nb: a
   count has no denominator and a "margin" on one would be a fabrication. */
function gbars(keys, {get, fmt=(v)=>PCT(v), note=true, nb=null}={}){
  const S=series();
  const mx=S.map(s=>{ let m=0; keys.forEach(k=>{ const v=get(s.data,k); if(v!=null&&isFinite(v)&&v>m) m=v; }); return m||1; });
  let anyThin=false;
  const groups=keys.map(k=>`<div class="gbgrp"><div class="gbk">${k}</div>`+S.map((s,i)=>{
    const v=get(s.data,k);
    if(v==null||!isFinite(v)) return `<div class="gbr"><span class="gnm" style="color:var(--muted)">${esc(s.name)}</span><span></span><span class="gem">&mdash;</span></div>`;
    let g=null;
    if(i>0 && nb){
      try{ const A=nb(s.data,k), Z=nb(S[0].data,k);
           if(A&&Z&&A.base>0&&Z.base>0) g=ppGap(A.n,A.base,Z.n,Z.base); }catch(e){}
    }
    if(g&&g.thin) anyThin=true;
    return `<div class="gbr" data-tip="<span class='tk'>${esc(s.name)} &middot; ${k}</span><br>${fmt(v)}${g?gapTip(g):''}">
      <span class="gnm" style="color:${s.color}">${esc(s.name)}</span>
      <span class="gtr"><span class="gfl" style="width:${Math.max(0,Math.min(100,v/mx[i]*100)).toFixed(1)}%;background:${s.color}"></span></span>
      <span class="gvl">${fmt(v)}${g?`<span class="gd" style="color:${gapCol(g)}">${gapTxt(g)}</span>`:''}</span></div>`;
  }).join('')+`</div>`).join('');
  const thinNote = anyThin ? ` At least one bar here differs from the all-users bar by <b>less than its own 95% interval</b> &mdash; those deltas are printed grey, and grey means the two bars are the same height as far as this data can tell.` : '';
  return `<div>${groups}</div>${note?`<p class="csub" style="margin:2px 0 0">Each series is scaled to <b>its own</b> largest bar, so a small segment still has a readable shape. Compare the printed numbers across series, not the bar lengths.${thinNote}</p>`:(thinNote?`<p class="csub" style="margin:2px 0 0">${thinNote.trim()}</p>`:'')}`;
}
/* One card per series, each drawn by the renderer that already existed. */
function smallMult(fn){
  return series().map(s=>`<div class="smcard"><div class="smhd"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}<span class="cn">${N(s.n)} users</span></div>${withData(s.data, fn)}</div>`).join('');
}

/* ---------- the metric rows each view compares on ----------------------- */
const fUsers=(d,i)=> d.funnel? d.funnel[i].users : null;
const OV_ROWS=[
  {k:'Active users', fmt:N, get:d=>d.kpis?d.kpis.activeUsers.v:null,
   why:'Active users is a <b>stock</b> &mdash; everyone who opened the app in the last 30 days, including people who installed long before this month. The event table behind a comparison only holds this month\'s cohort, so there is nothing to filter it with.'},
  {k:'New users (installs)', fmt:N, get:d=>fUsers(d,0)},
  {k:'Sign-ups', fmt:N, get:d=>fUsers(d,1)},
  {k:'KYC completion', fmt:v=>PCT(v,1), pp:true, get:d=>{const a=fUsers(d,1),b=fUsers(d,2); return a?b/a:null;},
   nb:d=>{const a=fUsers(d,1),b=fUsers(d,2); return a?{n:b, base:a}:null;}},
  {k:'Install → 1st txn', fmt:v=>PCT(v,1), pp:true, get:d=>{const a=fUsers(d,0),b=fUsers(d,4); return a?b/a:null;},
   nb:d=>{const a=fUsers(d,0),b=fUsers(d,4); return a?{n:b, base:a}:null;}},
  {k:'Revenue (mo.)', fmt:v=>'$'+N(v), get:d=>d.kpis?d.kpis.revenue.v:null,
   why:'Revenue is booked against the <b>18,400 activated users</b> who already existed, not against this month\'s 6,720 activations. It is a stock number and the two do not share a grain, so splitting it by a segment of this month\'s installs would be a fabrication.'},
  {k:'Nimbus+ subs', fmt:N, get:d=>d.kpis?d.kpis.subs.v:null,
   why:'Subscriptions are a stock on the same activated base as revenue &mdash; same grain mismatch.'},
  {k:'Avg. rating', fmt:v=>v+'★', get:d=>d.reviews?d.reviews.avg:null,
   why:'App-store reviews are <b>anonymous</b>. They carry a platform and a date and nothing else &mdash; there is no user id to join them to, so no segment can reach them. That is a property of the data, not a limitation of this tool, and it is the reason Voice of Customer can corroborate a finding but never prove one.'},
];
const RET_ROWS=[1,3,5].map(i=>({
  k:'Day '+BASE_DATA.retentionCurve[i].d.slice(1)+' retention',
  /* c[i].n is the count itself. It used to be Math.round(c[i].v*base), which
     recovers a numerator by multiplying a rate back up by the base it came
     from — fine to two decimals for a chart, half a point of invented error
     once that numerator feeds a margin. */
  get:d=>{ const c=(retType==='nday'?d.retentionNday:d.retentionCurve); if(!c||c[i].n==null) return null;
           const base=(d.retBase!=null?d.retBase:fUsers(d,4)); return {n:c[i].n, base}; }
}));

/* ---------- every transition in the verification path, as a rate ---------
   topLeak() answers "which screen is worst" for one population. Under a
   comparison the interesting question changes: is it the same screen for
   everybody, and is it worse there? So every transition is printed as a rate
   with the base it rests on, which is also the only honest way to compare a
   14,000-user path with a 900-user one. */
function flowSegOf(d){
  const f=d.flow; if(!f) return null;
  return flowSeg==='android'?f.android : flowSeg==='ios'?f.ios : f;
}
function flowDropCmp(){
  const B=flowSegOf(BASE_DATA);
  const rows=B.drops.map((dr,i)=>({
    k:`${B.nodes[dr.after].k} &rarr; ${B.nodes[dr.after+1].k}`,
    get:d=>{const f=flowSegOf(d); if(!f) return null;
            const x=f.drops.find(y=>y.after===dr.after);
            return x?{n:x.n, base:f.nodes[dr.after].n}:null;}
  }));
  rows.push({k:'Whole path (entered &rarr; verified)', tot:true,
    get:d=>{const f=flowSegOf(d); if(!f) return null;
            const ent=f.nodes[0].n, ver=f.nodes[f.nodes.length-1].n;
            return {n:ent-ver, base:ent};}});
  return rtab(rows,'Transition')
    + `<p class="csub" style="margin:8px 0 0"><b>Read as “share of those who reached it who then left”</b> &mdash; so higher is worse, and the bottom row is the whole path. Rates, not counts, because a segment a twentieth the size will always have a smaller leak in absolute terms and that tells you nothing. The question this table settles is whether your segment fails on the <i>same</i> screen as everyone else, only harder, or on a different one &mdash; and those have different owners.</p>`;
}

/* ---------- where inside KYC each segment quits --------------------------
   This one is a mix, not a level, and the difference is the lesson. Every
   column sums to 100% by construction, so two segments can have identical
   bars while one of them loses twice as many people. The counts underneath
   are what stop the room reading a composition as a magnitude. */
function kycMixCmp(){
  const keys=BASE_DATA.kycDrop.map(d=>d.k);
  const leavers=(d)=>{const a=fUsers(d,1), b=fUsers(d,2); return (a!=null&&b!=null)?a-b:null;};
  const counts=series().map(s=>{const L=leavers(s.data);
    return `<span class="lg"><span class="sw" style="background:${s.color}"></span>${esc(s.name)} <b style="color:var(--ink);margin-left:4px">${L==null?'&mdash;':N(L)+' leavers'}</b></span>`;}).join('');
  /* The share is of a segment's OWN leavers, so the denominator for the
     interval is that leaver count -- sign-ups minus verified -- and the
     numerator is the share times it. A mix on 300 leavers is four bars that
     can each move several points on nothing, which is the failure mode this
     card invites: it is the one screen where a segment's shape is compared
     with the whole population's shape by eye. */
  return gbars(keys,{fmt:v=>PCT(v,1), note:false,
      get:(d,k)=>{const x=(d.kycDrop||[]).find(y=>y.k===k); return x?x.v:null;},
      nb:(d,k)=>{const x=(d.kycDrop||[]).find(y=>y.k===k), L=leavers(d);
                 return (x&&L>0)?{n:x.v*L, base:L}:null;}})
    + `<div class="legend" style="margin-top:10px">${counts}</div>`
    + `<p class="csub" style="margin:8px 0 0"><b>Every column here adds to 100%.</b> These are shares of a segment's own leavers, so the bars answer <i>where</i> people quit and say nothing at all about <i>how many</i> &mdash; that is the row of counts above. Two segments with the same mix and different counts have the same problem at different volumes; the same count with a different mix is a different problem. Reading a mix as if it were a level is one of the quickest ways to size the wrong fix.</p>`;
}

/* ---------- Exercise 4: size the prize on the segment you built ---------- */
function MO_REV(){ return BASE_DATA.kpis.revenue.v / BASE_DATA.kpis.activatedBase.v; }
function LIFE_MO(){ return BASE_DATA.kpis.activatedBase.v / fUsers(BASE_DATA,4); }
/* This is the one table on the page that converts a segment into a dollar
   figure, which makes it the one place a thin segment does real damage. The
   builder will reach nineteen users; nineteen users will show a double-digit
   KYC gap on noise alone; and until now this card would multiply that gap by
   a downstream rate and a revenue-per-user and print "$1,240 / mo." in the
   same weight of type as the $884 the whole client deck is built on. A number
   like that goes onto a slide and does not come back off it.
   So no gap gets priced until it can be told apart from zero. What replaces
   the price is deliberately NOT a blank: it is the prize at the TOP of the
   gap's own interval, which is the number that decides whether the segment is
   worth measuring properly. "You cannot tell this from zero yet, and if it is
   real it is worth at most $X" is a decision. A blank cell is not. */
function impactCmp(){
  const S=series(), base=S[0];
  const bSg=fUsers(base.data,1), bVer=fUsers(base.data,2);
  const target=bVer/bSg;                                   // the published 40%
  const mo=MO_REV(), life=LIFE_MO();
  let anyThin=false;
  const rows=S.slice(1).map(s=>{
    const sg=fUsers(s.data,1), ver=fUsers(s.data,2), txn=fUsers(s.data,4);
    if(!sg||!ver) return `<tr><td>${esc(s.name)}</td><td class="em" colspan="5">no sign-ups in this segment</td></tr>`;
    const rate=ver/sg, down=txn/ver;                       // verified → first txn, this segment's own
    const gap=target-rate;
    const g=ppGap(ver,sg,bVer,bSg);                        // tested against the complement
    const m=(g&&g.m!=null)?g.m/100:null;                   // half-width of the gap's interval
    const act=(gp)=>Math.max(0, sg*gp*down);
    const extraAct=act(gap), hiAct=(m!=null)?act(gap+m):null;
    const thin=!!(g&&g.thin);
    if(thin) anyThin=true;
    const tip=(txt)=>` data-tip="<span class='tk'>${esc(s.name)}</span><br>${txt}"`;
    /* down rests on `ver`; a segment can clear the KYC-gap test and still have
       almost nobody through to first transaction, and that is the multiplier
       every dollar in the row passes through. */
    const downThin = ver>0 && moePP(down,ver)>=MOE_LEAD;
    const cells = (gap<=0)
      ? `<td class="big">&mdash;</td><td class="big" data-gate="parity">&mdash;</td><td class="big" data-gate="parity">&mdash;<span class="dd" style="color:var(--muted);font-weight:600">already at or above parity</span></td>`
      : thin
      ? `<td class="big" style="color:var(--muted)">${PCT(target,1)}</td>
         <td class="em" data-gate="notyet"${tip(`The gap is <b>${(-g.d).toFixed(1)}pp</b> with a 95% interval of <b>&plusmn;${g.m.toFixed(1)}pp</b> &mdash; it contains zero, so this segment cannot yet be told apart from the rest of the population. Pricing it would be pricing the sampling error.<br><br>At the <b>top</b> of that interval the gap would be ${((-g.d)+g.m).toFixed(1)}pp, worth <b>+${N(hiAct)}</b> activations. That is the ceiling, not the estimate.`)}>not yet<span class="dd" style="color:var(--muted);font-weight:600">up to +${N(hiAct)} if real</span></td>
         <td class="em" data-gate="notyet"${tip(`Ceiling only: <b>$${N(hiAct*mo)}</b> / mo. if the gap sits at the very top of its interval. The estimate itself is indistinguishable from <b>$0</b>. Widen the segment until the interval clears zero, then price it.`)}>not yet<span class="dd" style="color:var(--muted);font-weight:600">ceiling $${N(hiAct*mo)}/mo</span></td>`
      : `<td class="big">${PCT(target,1)}</td>
         <td class="big" data-gate="priced"${tip(`Gap <b>${(-g.d).toFixed(1)}pp</b> &plusmn;${g.m.toFixed(1)}pp &rarr; between <b>+${N(act(gap-m))}</b> and <b>+${N(hiAct)}</b> activations a month.`)}>+${N(extraAct)}<span class="dd" style="color:var(--muted);font-weight:600">${N(act(gap-m))}&ndash;${N(hiAct)}</span></td>
         <td class="big" data-gate="priced"${tip(`Month one <b>$${N(extraAct*mo)}</b>, range <b>$${N(act(gap-m)*mo)}&ndash;$${N(hiAct*mo)}</b> from the gap's interval alone.${downThin?`<br><br><b style='color:#ffd48a'>And that is the optimistic error bar.</b> It moves only the gap. The verified&nbsp;&rarr;&nbsp;first-transaction rate this row multiplies by is <b>${PCT(down,1)}</b> on just ${N(ver)} verified users (&plusmn;${moePP(down,ver).toFixed(1)}pp), so the true spread is wider than the one printed.`:''}`)}>$${N(extraAct*mo)}<span class="dd" style="color:var(--muted);font-weight:600">$${N(extraAct*mo*life)} steady</span></td>`;
    return `<tr><td><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${s.color};margin-right:6px"></span>${esc(s.name)}</td>
      <td class="big">${N(sg)}</td>
      <td class="big"${g&&g.m!=null?tip(`KYC <b>${PCT(rate,1)}</b> on ${N(sg)} sign-ups${gapTip(g)}`):''}>${PCT(rate,1)}${gapSpan(g,' vs all')}</td>
      ${cells}</tr>`;
  }).join('');
  return `<div class="cno" style="border-style:solid;margin-top:16px"><b>Size it on the segment you built.</b> The table above is the published, whole-population case. This one takes each comparison you added, holds everything else constant, and asks what closing its gap to the <b>${PCT(target,1)}</b> all-users rate would be worth. The downstream conversion used is <i>that segment's own</i> verified&nbsp;&rarr;&nbsp;first-transaction rate, not the blended one.</div>
  <div class="sfwrap"><table class="ctab"><tr><th>Segment</th><th>Sign-ups</th><th>KYC now</th><th>If it hit parity</th><th>Extra activations / mo.</th><th>Worth</th></tr>${rows}</table></div>
  <p class="csub" style="margin:8px 0 0"><b>The trap is still here.</b> Month one is extra activations &times; <b>$${mo.toFixed(2)}</b>. The steady-state number underneath is that figure &times; <b>${life.toFixed(2)} months</b> of average activated life &mdash; it arrives only after the cohorts have stacked, and quoting it as month one is how this business case gets oversold. And a segment prize is <b>not</b> additive with the whole-population prize above: you cannot bank both.</p>
  <p class="csub" style="margin:8px 0 0"><b>Nothing gets a price until its gap clears zero.</b> Every prize here is a gap multiplied by a base, so the error on the gap goes straight through to the dollars &mdash; the small figures under each are the <b>95% range</b>, not decoration. ${anyThin?`One of your segments came back <b>not yet</b>: its gap is smaller than its own interval, so the only defensible statement is the ceiling printed beside it. That is not a dead end &mdash; a ceiling is exactly what tells you whether the segment is worth the cost of measuring properly. If the ceiling is small, the answer is no and you have just saved a sprint.`:`Slice one more level &mdash; add a device or an app version &mdash; and watch a prize turn into <b>not yet</b>. The gap will barely move; the interval around it will double.`}</p>`;
}

/* ---------- the bar ------------------------------------------------------ */
/* Presets are the two platforms and the biggest channel: enough to show the
   mechanic in one click, deliberately not the answer. A preset for
   "Samsung A-series on 4.3.0" would hand the room Exercise 3. */
const CMP_PRESETS=[['plat','iOS'],['plat','Android'],['chan','Paid social']];
let DRAFT=null;
function cmpChanged(){ invalidateSeries(); paintCmpBar(); paintBuild(); nav(cur); }
function cmpRemove(i){ CMP.splice(i,1); cmpChanged(); }
function cmpClear(){ CMP=[]; DRAFT=null; cmpChanged(); }
function cmpPreset(dim,lab){
  if(CMP.length>=CMP_MAX) return;
  const vals=dimVals(dim), i=vals.indexOf(lab); if(i<0) return;
  const c={conds:[{dim,vals:[i]}]};
  CMP.push(c); noteLook(c); DRAFT=null; cmpChanged();
}
/* ---- thin cells --------------------------------------------------------
   The builder will happily produce a segment of nineteen people — sign-up week
   AND device AND app version is enough, and that exact cell exists — and a 26%
   verification rate off nineteen users renders identically to a 26% rate off
   nineteen thousand. Nothing on the page distinguished them, which meant the
   tool taught segmentation without teaching sample size, and the one thing a
   room reliably does with a new slice is slice again.

   The fix is not to forbid the cut. The number is real; its PRECISION is not,
   and that difference is the lesson, so the tool says the margin out loud and
   lets the pair decide. Agresti-Coull (the "+2 successes, +4 trials" interval)
   rather than the textbook Wald one, because Wald collapses to +/-0 at p=0 and
   p=1 — and a thin segment where nobody converted is exactly the cell someone
   will try to report.

   THIN_N is 400 because that is where the margin stops being able to carry the
   findings this dataset is built around: at n=400 and p≈0.4 the 95% interval is
   about +/-4.8 points, still comfortably inside the 8-point country gap that
   Exercise 3 asks a pair to explain away and nowhere near the 22-point platform
   and regression gaps. Below it, the arithmetic starts outrunning the data. */
const THIN_N = 400;
function moePts(x, n){                       // 95% margin, in percentage points
  const p=(x+2)/(n+4);
  return 1.96*Math.sqrt(p*(1-p)/(n+4))*100;
}
function cmpBase(s){ const F=s.data&&s.data.funnel; return F&&F[1]?F[1].users:null; }
function cmpMoe(s){
  const b=cmpBase(s); if(b===null||!b) return null;
  return moePts(s.data.funnel[2].users, b);
}
function cmpThinWarn(s){
  const b=cmpBase(s); if(b===null) return null;
  if(!b) return `No one in this segment ever reached sign-up, so every rate on every report below it is dividing by zero. Drop a condition — most likely two of them contradict each other.`;
  if(b>=THIN_N) return null;
  return `Only <b>${N(b)}</b> of these users reached sign-up, so its verification rate carries a margin of about <b>&plusmn;${cmpMoe(s).toFixed(1)} points</b> at 95% confidence. A gap narrower than that is not a finding yet — widen the segment or drop a condition.`;
}

/* ---- how many times you have looked -------------------------------------
   Every margin on this page is honest about ONE comparison. None of them knows
   about the nine you made before it, and that is the failure mode this tool was
   otherwise built to encourage: the builder makes a new slice cost two clicks,
   the reports all repaint instantly, and a pair with twenty minutes will run
   fifteen segments and keep the one with the biggest gap. That is a search
   procedure, and a 95% interval carries no guarantee whatsoever about the
   winner of a search — it was computed as though the question had been asked
   once, in advance.

   The counter is per-tab and per-session, keyed on a canonical signature so
   re-adding a segment you already tried is not a new look and removing one does
   not buy a look back. It is deliberately NOT reset by Clear all: clearing the
   bar does not unsee anything.

   NULL_RATE is measured, not assumed. measure-looks.js holds platform fixed and
   slices retention — which users.js paints on per platform and independently of
   every other dimension, so within a platform it is two draws from one urn —
   and finds 5.3% of single-dimension cuts and 6.0% of one- and two-dimension
   cuts come back "significant" anyway. That is the 1-in-20 the interval on
   screen is promising, arriving on schedule, on a metric where every hit is
   false. The contrast matters as much as the number: the same scan on KYC
   completion, which this dataset allocates against published margins and where
   the differences are real, lights up 92% of single-dimension cuts. The lesson
   is not "nothing is real". It is "the flat metric will still hand you
   findings, and it hands them out at exactly the rate the interval predicts."

   LOOK_MIN is 4. Three segments is looking; the fourth is the first one you
   would not have built if the first three had answered the question. */
const LOOK_MIN = 4, NULL_RATE = 5.3;
let LOOKS = (()=>{ try{ return new Set(JSON.parse(sessionStorage.getItem('nimbusLooks')||'[]')); }catch(e){ return new Set(); } })();
function lookSig(c){
  return ((c&&c.conds)||[]).map(x=>x.dim+':'+x.vals.slice().sort((a,b)=>a-b).join(',')).sort().join('|');
}
function noteLook(c){
  const s=lookSig(c); if(!s || LOOKS.has(s)) return;
  LOOKS.add(s);
  try{ sessionStorage.setItem('nimbusLooks', JSON.stringify([...LOOKS])); }catch(e){}
}
function lookCount(){ return LOOKS.size; }
/* Šidák rather than Bonferroni: to hold 95% across k looks each one runs at
   alpha_k = 1-(0.95)^(1/k), which is the exact answer for independent tests
   instead of Bonferroni's slightly conservative 0.05/k. Inverse normal by
   bisection on Abramowitz & Stegun 7.1.26 — three significant figures is far
   more than a banner needs, and it avoids shipping a lookup table that would
   silently stop at whatever k somebody thought was the maximum. */
function zCrit(k){
  if(!(k>1)) return 1.96;
  const p=1-(1-Math.pow(0.95,1/k))/2;
  const erf=x=>{const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
    return s*(1-(((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t)*Math.exp(-x*x));};
  const cdf=z=>0.5*(1+erf(z/Math.SQRT2));
  let lo=0,hi=8; for(let i=0;i<80;i++){const m=(lo+hi)/2; if(cdf(m)<p) lo=m; else hi=m;}
  return (lo+hi)/2;
}
function lookWarn(){
  const k=lookCount(); if(k<LOOK_MIN) return '';
  const any=(1-Math.pow(0.95,k))*100, z=zCrit(k), wide=z/1.96;
  return `<div class="cwarn" data-look="${k}"><b>That is ${N(k)} different segments this session.</b> `
   + `Every interval on this page is a <b>95%</b> one, which is the same sentence as <b>one call in twenty goes the wrong way on noise alone</b> — and none of them knows about the ${N(k-1)} slices you made before it. `
   + `If none of your ${N(k)} segments carried a real difference, there is still a <b>${any.toFixed(0)}% chance</b> at least one of them looked like it did; that counts one verdict per segment, and each of yours has a screenful of rows under it. `
   + `This dataset will show you the same thing: slice <b>retention</b>, which carries no structure below platform, and <b>${NULL_RATE}%</b> of the cuts come back “significant” anyway. Slice <b>KYC completion</b>, where the differences are real, and <b>92%</b> do. `
   + `To hold 95% across all ${N(k)} looks an interval has to be <b>${wide.toFixed(2)}&times; wider</b> than the one printed (z&nbsp;=&nbsp;${z.toFixed(2)}, not 1.96). `
   + `Keep slicing — but a gap under <b>${wide.toFixed(2)}&times;</b> its own margin is a hypothesis, and the way you turn a hypothesis into a finding is to name it <i>before</i> you go looking, then check it on data you have not already searched.</div>`;
}

function paintCmpBar(){
  const el=document.getElementById('cmpbar'); if(!el) return;
  let h=`<span class="cl">Compare</span>`;
  if(!cmpOn()){
    /* Rule 1: series() is not called here. With no comparison the 50,000-row
       table is never built and the page is exactly what it always was. */
    h+=`<span class="cchip"><span class="dot" style="background:${BASE_COLOR}"></span><span class="nm">All users</span><span class="cn">50,000</span></span>`
     + `<button class="cadd" onclick="cmpOpen()" data-tip="<span class='tk'>Build a segment</span><br>Pick a property and the values you care about. Add up to ${CMP_MAX}, and every report on every screen splits by them until you clear them.">＋ Add comparison</button>`
     + `<span class="cvhint" style="margin-left:4px">or start from</span>`
     + CMP_PRESETS.map(([d,l])=>`<button class="clink" onclick="cmpPreset('${d}','${l.replace(/'/g,"\\'")}')">${l}</button>`).join('');
    /* Still shown with the bar empty. Clearing the comparisons does not unsee
       the fourteen segments already in somebody's notebook, and the moment just
       before the next slice is the one where the warning is worth anything. */
    el.innerHTML=h+lookWarn(); return;
  }
  const S=series();
  h+=S.map((s,i)=> i===0
    ? `<span class="cchip"><span class="dot" style="background:${s.color}"></span><span class="nm">All users</span><span class="cn">${N(s.n)}</span></span>`
    : `<span class="cchip" data-tip="<span class='tk'>${esc(s.name)}</span><br>${N(s.n)} of 50,000 users (${PCT(s.n/50000,1)})${cmpMoe(s)?`<br>Verification rate for this segment is precise to about &plusmn;${cmpMoe(s).toFixed(1)} points (95%).`:''}"><span class="dot" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span><span class="cn">${N(s.n)}</span><span class="x" onclick="cmpRemove(${i-1})">✕</span></span>`
  ).join('');
  h+=`<button class="cadd" onclick="cmpOpen()"${CMP.length>=CMP_MAX?' disabled':''}>＋ Add comparison</button>`
   + `<button class="clink" onclick="cmpClear()">Clear all</button>`;
  /* Two different warnings, deliberately not merged. The grain one says a
     dimension is only recorded downstream, so the segment is measuring a
     different population than it looks like. The thin one says the segment is
     the right population and there is simply not enough of it. A pair can hit
     either, or both at once, and collapsing them into one "careful" banner
     would hide which mistake they are actually about to make.

     The look counter is a third, and it is not about any of these segments: it
     is about how many came before them. It goes last because it is the only one
     that is still true after you fix everything the other two are complaining
     about. */
  const warns=S.map(s=>{
    const parts=[s.warn, s.all?null:cmpThinWarn(s)].filter(Boolean);
    if(!parts.length) return '';
    return `<div class="cwarn"><b>Careful with “${esc(s.name)}”.</b> ${parts.join(' ')}</div>`;
  }).join('');
  el.innerHTML=h+warns+lookWarn();
}

/* ---------- the builder -------------------------------------------------- */
function cmpOpen(){ if(CMP.length>=CMP_MAX) return; DRAFT={conds:[{dim:'plat',vals:[]}]}; paintBuild(); }
function cmpCancel(){ DRAFT=null; paintBuild(); }
function cmpAdd(){
  if(!draftComplete() || !draftCount()) return;
  const c={conds:DRAFT.conds.map(c=>({dim:c.dim,vals:c.vals.slice()}))};
  CMP.push(c); noteLook(c);
  DRAFT=null; cmpChanged();
}
function draftComplete(){ return !!DRAFT && DRAFT.conds.length>0 && DRAFT.conds.every(c=>c.vals.length>0); }
function draftDim(i,k){ DRAFT.conds[i]={dim:k,vals:[]}; paintBuild(); }
function draftToggle(i,v){ const c=DRAFT.conds[i], j=c.vals.indexOf(v); if(j<0) c.vals.push(v); else c.vals.splice(j,1); c.vals.sort((a,b)=>a-b); paintBuild(); }
function draftAddCond(){ const used=DRAFT.conds.map(c=>c.dim); const next=DIMS.find(d=>used.indexOf(d.k)<0); if(!next) return; DRAFT.conds.push({dim:next.k,vals:[]}); paintBuild(); }
function draftDropCond(i){ DRAFT.conds.splice(i,1); paintBuild(); }
function draftCount(){
  if(!DRAFT) return null;
  const cs=DRAFT.conds.filter(c=>c.vals.length); if(!cs.length) return null;
  const m=cmpMask({conds:cs}); let t=0; for(let i=0;i<m.length;i++) t+=m[i]; return t;
}
function paintBuild(){
  const mount=document.getElementById('cmpBuildMount'); if(!mount) return;
  if(!DRAFT){ mount.innerHTML=''; return; }
  const used=DRAFT.conds.map(c=>c.dim);
  const rows=DRAFT.conds.map((c,i)=>{
    const opts=DIMS.filter(d=>d.k===c.dim || used.indexOf(d.k)<0)
      .map(d=>`<option value="${d.k}"${d.k===c.dim?' selected':''}>${d.lab}</option>`).join('');
    const vals=dimVals(c.dim).map((lab,v)=>`<span class="cval${c.vals.indexOf(v)<0?'':' on'}" onclick="draftToggle(${i},${v})">${esc(lab)}</span>`).join('');
    const after=DIMBY[c.dim].after;
    return `<div class="cbrow">
      <span class="cvhint" style="min-width:38px">${i===0?'where':'and'}</span>
      <select class="cbsel" onchange="draftDim(${i},this.value)">${opts}</select>
      <span class="cvals">${vals}</span>
      ${DRAFT.conds.length>1?`<button class="clink" onclick="draftDropCond(${i})">remove</button>`:''}
      ${after?`<div class="cwarn"><b>Grain warning.</b> <b>${DIMBY[c.dim].lab}</b> is only recorded once a user has ${after}. Filter on it and everyone upstream disappears &mdash; the funnel will start at that step and its first conversion will read 100%. That is the filter working, not the product improving.</div>`:''}
    </div>`;
  }).join('');
  const n=draftCount(), ok=draftComplete()&&!!n;
  const hint = n==null ? `pick at least one value`
    : n===0 ? `<b style="color:var(--critical)">matches nobody</b> — no user satisfies all of those conditions at once`
    : `matches <b>${N(n)}</b> of 50,000 users (${PCT(n/50000,1)})`;
  mount.innerHTML=`<div class="cbuild">
    <div class="smallcap" style="margin-bottom:4px">New comparison</div>
    ${rows}
    <div class="cbfoot">
      <button class="clink" onclick="draftAddCond()"${used.length>=DIMS.length?' disabled':''}>＋ and…</button>
      <span class="cvhint">${hint}</span>
      <span style="flex:1"></span>
      <button class="cbtn" onclick="cmpCancel()">Cancel</button>
      <button class="cbtn pri" onclick="cmpAdd()"${ok?'':' disabled'}>Add comparison</button>
    </div>
    <p class="csub" style="margin:10px 0 0">Values inside one row are <b>or</b>; rows are joined with <b>and</b>. Every report re-renders split by this until you remove it &mdash; including the ones that cannot be split, which will say so rather than quietly showing you the whole-population number.</p>
  </div>`;
}

/* =================== interactivity state =================== */
// funnel segment toggle
let curSeg='platform';
// Whole-funnel breakdown. Separate from curSeg on purpose: curSeg segments ONE
// step in depth (including two-dimensional cross-tabs), funBd segments EVERY
// step at once. They answer different questions and a group needs both --
// "how bad is it here" and "is it only here".
let funBd='none';
function setFunBd(k,btn){funBd=k;nav('funnel');}

/* ---------- statistics shared by every segment view ----------------------
   Two numbers, both of which a product manager is expected to have an opinion
   about and almost never gets handed by a dashboard.

   moePP  95% interval on a single rate: 1.96 x sqrt(p(1-p)/n), in points.
   zGap   two-proportion z between the best and worst segment in a row, using
          the pooled rate. This is the honest test of "is that gap real", and
          it is deliberately reported ALONGSIDE the size of the gap, because
          the two come apart in this very dataset: Bank->1st txn is 2.6pp at
          z=2.7 (real, and worth nothing) while Sign-up->Verified is 21.9pp at
          z=39.9 (real, and the whole business). Teaching people to ask both
          questions is worth more than either number. */
function moePP(p,n){ return n>0 ? 1.96*Math.sqrt(Math.max(p*(1-p),0)/n)*100 : 0; }
/* How wide an interval has to get before a cell stops being a finding.
   Two cells each carrying +/-2.5pp can sit 5pp apart on noise alone, and 5pp
   is wider than three of the eight step-level spreads these tables ask the
   room to read (0.8, 1.5 and 2.6pp on the platform breakdown). Under that
   width the interval is worth showing and not worth worrying about; at or
   over it the number is a lead, not a result.
   This was 4pp, which nothing in this dataset ever reached -- the widest cell
   in the whole tool is Paid search at the last step, +/-3.5pp on 650 users.
   So the one habit this section exists to teach was taught in prose and
   demonstrated nowhere. A warning that cannot fire is not a safe default, it
   is dead code, and no render test catches it: the suite now asserts it fires
   at least once. */
const MOE_LEAD=2.5;
function moeThin(p,n){ return moePP(p,n)>=MOE_LEAD; }
function moeTip(p,n){
  const m=moePP(p,n);
  return `<br><span style='opacity:.72'>95% interval <b>&plusmn;${m.toFixed(1)}pp</b> on ${N(n)}${m>=MOE_LEAD?` &mdash; <b style='color:#ffd48a'>thin base, call it a lead</b>`:''}</span>`;
}
/* The small line under each cell is its base. When the cell is too thin to
   read, the interval joins it there rather than staying in the tooltip: a
   room reading a projected table does not hover, so hover-only caution is
   caution nobody exercises. Solid cells are left alone -- flagging all 58
   would teach the opposite lesson. */
function baseTag(p,n){ return moeThin(p,n) ? `${N(n)} &plusmn;${moePP(p,n).toFixed(1)}` : N(n); }
function zGap(n1,b1,n2,b2){
  const p=(n1+n2)/(b1+b2);
  const den=Math.sqrt(p*(1-p)*(1/b1+1/b2));
  return den>0 ? Math.abs(n1/b1-n2/b2)/den : 0;
}
function zWord(z){
  return z<2 ? 'inside the noise' : z<4 ? 'real, but only just' : z<10 ? 'clearly real' : 'overwhelming';
}

/* ---------- is that "vs all" delta bigger than its own noise? -------------
   Every comparison view on this page prints a delta against the All-users
   column, and until now every one of them printed it bare. A pair that built
   a nineteen-user segment got "+18.4pp vs all" in confident green, in exactly
   the same type as the 21.9pp platform gap that the whole day is built on.
   The tool taught people to slice and then handed them no way at all to tell
   a finding from a coin flip -- which is worse than not slicing, because the
   number now has a chart under it.

   Two things had to be right.

   FIRST, what to test against. The All-users column CONTAINS the segment, so
   segment-vs-all is a number compared with itself plus something else, and
   its standard error is wrong in the reassuring direction. The independent
   contrast is the segment against its COMPLEMENT -- everyone not in it. The
   two framings do not disagree, they are the same statement rescaled: with
   w = n/N,

        p_seg - p_all  =  (1 - w) * (p_seg - p_rest)

   exactly. So the margin scales by the same (1-w), the ratio of gap to margin
   is identical, and the verdict is invariant to which one you print. That is
   what lets these cards keep showing the familiar "vs all" figure the room is
   already reading off the screen while testing the thing that is actually
   testable. It also means the margin shrinks as a segment approaches the
   whole population -- correctly, because at w=1 there is nothing left to
   differ from and the gap is zero by construction.

   SECOND, which interval. Agresti-Caffo -- one extra success and one extra
   failure in each arm -- for the same reason moePP is Agresti-Coull: Wald's
   standard error is exactly zero when p is 0 or 1, and a margin of zero makes
   every difference on earth significant. The builder reaches segments where
   nobody converted; that is precisely the cell somebody screenshots.

   `thin` uses >= and not >, because a gap exactly equal to its own margin is
   not a finding. */
function ppGap(x, n, X, Nn){
  if(!(n>0)||!(Nn>0)) return null;
  const on=Nn-n, ox=X-x;                            // the complement arm
  const d=(x/n - X/Nn)*100;
  /* Segment == whole population: there is no complement to test against, and
     d is 0 by construction. Say nothing rather than invent a margin. */
  if(!(on>0)) return {d, m:null, thin:false, w:1};
  const a=n+2, b=on+2, p=(x+1)/a, q=(ox+1)/b;
  const mRest=1.96*Math.sqrt(p*(1-p)/a + q*(1-q)/b)*100;
  const w=n/Nn;
  return {d, m:(1-w)*mRest, thin:Math.abs(d)<=(1-w)*mRest, w};
}
/* Colour is the only thing most of the room actually reads. A gap inside its
   own interval goes grey -- not green, not red -- because "nothing here" is
   the correct reading and the old colouring said the opposite in the loudest
   available channel. */
function gapCol(g){ return (!g||g.m==null||g.thin) ? 'var(--muted)' : DCOL(g.d); }
function gapTxt(g){
  if(!g) return '';
  if(g.m==null) return ppTxt(g.d);
  /* toFixed(1) on -0.004 prints "-0.0", and a signed zero on a projector reads
     as a direction. Anything that rounds to nothing loses its sign. */
  const d=Math.abs(g.d)<0.05 ? 0 : g.d;
  return `${d>0?'+':''}${d.toFixed(1)}&thinsp;&plusmn;${g.m.toFixed(1)}pp`;
}
/* m==null means the complement is empty: this cell's segment IS the whole
   all-users population for this row. It happens legitimately and often --
   break down by platform while comparing by platform and the Android row of
   the Android column is, to the user, the Android row of the All-users
   column. The delta there is zero by construction, never by measurement, and
   printing a confident "0.0pp vs all" invites exactly the wrong reading: that
   the tool looked and found no difference. It did not look. Say so. */
function gapSpan(g, tail){
  if(!g) return '';
  if(g.m==null) return `<span class="dd" style="color:var(--muted)">same users as &ldquo;all&rdquo;</span>`;
  return `<span class="dd" style="color:${gapCol(g)}">${gapTxt(g)}${g.thin?' &middot; noise':(tail||'')}</span>`;
}
/* Goes on the PARENT cell's tooltip, never on the delta span itself: the td
   in rtab and funnelTab already carries a data-tip, and a nested one silently
   shadows it. */
function gapTip(g){
  if(!g) return '';
  if(g.m==null) return `<br><span style='opacity:.72'>This row and the all-users column are the <b>same people</b> here &mdash; your breakdown and your comparison have landed on the same cut. The 0pp is arithmetic, not a null result, and there is nothing left over to test it against.</span>`;
  return `<br><span style='opacity:.72'>vs all: <b>${g.d>0?'+':''}${g.d.toFixed(1)}pp</b>, 95% interval <b>&plusmn;${g.m.toFixed(1)}pp</b>${g.thin?` &mdash; <b style='color:#ffd48a'>the gap is inside its own noise</b>`:''}<br>measured against the ${PCT(1-g.w,0)} of all users <i>not</i> in this segment, because the all-users column contains it.</span>`;
}

/* ---------- whole-funnel breakdown --------------------------------------
   Rows marked sub:1 decompose the KYC step and are excluded from the "which
   step carries the spread" arithmetic, so a sub-row can never be mistaken for
   a funnel step. The decomposition is exact:
       0.919 x 0.566 = 0.520 (iOS)      0.903 x 0.333 = 0.301 (Android)   */
const FUNSEG=[
  {from:'App Install',        to:'Sign-Up Completed',     label:'Installs \u2192 Sign-up'},
  {from:'Sign-Up Completed',  to:'KYC Approved',          label:'Sign-up \u2192 Verified'},
  {from:'Sign-Up Completed',  to:'ID Photo Submitted',    label:'\u2026 reached ID photo', sub:1},
  {from:'ID Photo Submitted', to:'KYC Approved',          label:'\u2026 photo \u2192 approved', sub:1},
  {from:'KYC Approved',       to:'Bank Linked',           label:'Verified \u2192 Bank linked'},
  {from:'Bank Linked',        to:'Transaction Completed', label:'Bank linked \u2192 1st txn'},
];
function evByName(n){ return DATA.events.find(e=>e.name===n); }
function segKeys(dim){ return dim==='chan' ? Object.keys(DATA.events[0].chan) : ['iOS','Android']; }
function funRows(dim){
  const keys=segKeys(dim);
  return FUNSEG.map(L=>{
    const A=evByName(L.from), B=evByName(L.to);
    const pick=(e,k)=>dim==='chan'?e.chan[k]:e.plat[k];
    /* A comparison can empty a column outright — compare "Android" and then
       break the funnel down by platform and the iOS column has nobody in it.
       n/0 is NaN, and a single NaN poisons every min/max below it, so an empty
       cell is flagged and then kept out of the arithmetic instead of being
       divided through. Rendering it as an em-dash is the point: an empty
       column is the comparison working, not the data missing. */
    const cells=keys.map(k=>{const base=pick(A,k), n=pick(B,k);
      return {k, base, n, v: base? n/base : null, empty: !base};});
    const live=cells.filter(c=>!c.empty);
    const hi=live.length? live.reduce((a,b)=>b.v>a.v?b:a) : null;
    const lo=live.length? live.reduce((a,b)=>b.v<a.v?b:a) : null;
    return {label:L.label, sub:!!L.sub, cells, live, hi, lo,
            all: A.total? B.total/A.total : null, allBase:A.total, allN:B.total,
            spread: (hi&&lo)? (hi.v-lo.v)*100 : 0,
            z: (hi&&lo)? zGap(hi.n,hi.base,lo.n,lo.base) : 0};
  });
}
function segFunnel(dim){
  const keys=segKeys(dim), rows=funRows(dim);
  const steps=rows.filter(r=>!r.sub);
  const worst=steps.reduce((a,b)=>b.spread>a.spread?b:a);
  const rest=steps.filter(r=>r!==worst);
  const nextSpread=Math.max(...rest.map(r=>r.spread));
  const material=steps.filter(r=>r.spread>=8);
  const dimName=dim==='chan'?'channel':'platform';
  const head=`<tr><th class="rh" style="width:auto">Step</th>${keys.map(k=>`<th>${k.replace(' ','<br>')}</th>`).join('')}<th style="width:54px">All</th><th style="width:60px">Spread</th></tr>`;
  const body=rows.map(r=>{
    const tds=r.cells.map(c=>{
      if(c.empty) return `<td class="c"><div class="cell" style="background:var(--line2);color:var(--muted)" data-tip="<span class='tk'>${c.k} &middot; ${r.label}</span><br>Your comparison excluded everyone who could have entered this step.<br><span style='opacity:.72'>An empty column is the comparison doing its job, not the data going missing.</span>">&mdash;<i>0</i></div></td>`;
      const d=(r.all!=null)?(c.v-r.all)*100:0;
      const bg = d<=-10?'var(--critical)' : d<=-4?'var(--serious)' : d<4?'var(--line2)' : d<10?'var(--seq400)':'var(--seq600)';
      const fg = (d>-4&&d<4)?'var(--ink2)':'#fff';
      const dTxt = r.all==null ? `<span style='opacity:.72'>no overall rate to compare against here</span>`
                 : Math.abs(d)<0.05 ? `exactly the ${PCT(r.all,1)} overall`
                 : `<b>${d>0?'+':''}${d.toFixed(1)}pp</b> vs the ${PCT(r.all,1)} overall`;
      return `<td class="c"><div class="cell" style="background:${bg};color:${fg}" data-tip="<span class='tk'>${c.k} &middot; ${r.label}</span><br>${N(c.n)} of ${N(c.base)} went on<br>= <b>${PCT(c.v,1)}</b><br>${dTxt}${moeTip(c.v,c.base)}"><b>${PCT(c.v,0)}</b><i>${baseTag(c.v,c.base)}</i></div></td>`;
    }).join('');
    const hot=!r.sub && r===worst && worst.spread>=8 && r.hi && r.lo;
    const spTip = (r.hi&&r.lo)
      ? `<span class='tk'>${r.hi.k} vs ${r.lo.k}</span><br>${PCT(r.hi.v,1)} against ${PCT(r.lo.v,1)}<br>= <b>${r.spread.toFixed(1)}pp</b> apart<br><br>Two-proportion z = <b>${r.z.toFixed(1)}</b> &mdash; ${zWord(r.z)}.<br><span style='opacity:.72'>Size and significance are different questions. A gap can be real and still be too small to be worth anything.</span>`
      : `<span class='tk'>No spread to measure</span><br>Only one ${dimName} still has users in it under your comparison, so there is nothing to compare it against.<br><span style='opacity:.72'>Breaking a comparison down by the same dimension you compared on always does this.</span>`;
    const spCell = (r.hi&&r.lo) ? `<b>${r.spread.toFixed(1)}</b><i>z ${r.z.toFixed(1)}</i>` : `<b>&mdash;</b><i>n/a</i>`;
    const allCell = (r.all!=null)
      ? `<div class="cell" style="background:var(--line2);color:var(--ink2)" data-tip="<span class='tk'>${r.label}</span><br>${N(r.allN)} of ${N(r.allBase)}<br>= <b>${PCT(r.all,1)}</b> overall"><b>${PCT(r.all,0)}</b><i>${N(r.allBase)}</i></div>`
      : `<div class="cell" style="background:var(--line2);color:var(--muted)" data-tip="<span class='tk'>${r.label}</span><br>Nobody in this comparison entered this step.">&mdash;<i>0</i></div>`;
    return `<tr class="${r.sub?'sub':''}"><td class="rl">${r.label}</td>${tds}`
      + `<td class="c">${allCell}</td>`
      + `<td class="c"><div class="cell sp" style="background:${hot?'var(--critical)':'transparent'};color:${hot?'#fff':'var(--muted)'}" data-tip="${spTip}">${spCell}</div></td></tr>`;
  }).join('');
  const legend=`<p class="csub" style="margin:8px 0 0">Big number = conversion at that step &middot; small number = users entering it, with its <b>&plusmn;95% interval</b> shown inline whenever the cell is too thin to read straight. Colour is <b>distance from that row's own overall rate</b>, so a grey row means the step treats every ${dimName} alike. Indented rows split the verification step using the Flows journey. <b>Hover</b> any cell for its counts, its 95% interval and, on the Spread column, whether the gap survives a significance test.</p>`;
  const missing=`<p class="csub" style="margin:6px 0 0"><b>One step is missing:</b> first transaction &rarr; repeat in 30 days carries no ${dimName} property in the event data, so it cannot be broken down here. That is worth noticing rather than skipping &mdash; the questions you can ask are set by what somebody chose to instrument, and you only find the gap when you try.</p>`;
  // The two sub-rows multiply exactly to the parent step, so the gap between
  // any two segments splits between them without residue once you take logs.
  // That makes "how much of this step's gap comes from the second half" a
  // measured quantity rather than an impression.
  const subs=rows.filter(r=>r.sub);
  const rate=(r,k)=>{const c=r.cells.find(x=>x.k===k); return c?c.v:null;};
  const an=k=>(/^[aeiou]/i.test(k)?'an ':'a ')+k;
  let subNote='';
  const subOK = subs.length===2 && worst.hi && worst.lo
    && [worst.hi.k,worst.lo.k].every(k=>subs.every(s=>{const v=rate(s,k); return v!=null && v>0;}));
  if(subOK){
    const hiK=worst.hi.k, loK=worst.lo.k;
    const a0=rate(subs[0],hiK), b0=rate(subs[0],loK);
    const a1=rate(subs[1],hiK), b1=rate(subs[1],loK);
    const g0=(a0-b0)*100, g1=(a1-b1)*100;
    const l0=Math.log(a0)-Math.log(b0), l1=Math.log(a1)-Math.log(b1);
    const share=(l0+l1)>0 ? l1/(l0+l1) : 0;
    const cause = dim==='chan'
      ? `They are not giving up before they try &mdash; they try and are turned down. For an acquisition channel that points at <b>who it is sending</b> and what they are sending it with, which is a spend decision, not a screen to rebuild.`
      : `They are not giving up before they try &mdash; they try and are turned down. That points at <b>what the camera produces</b>, not at what the user wants, and it is the difference between rebuilding a screen and fixing a capture pipeline.`;
    subNote = ` <br><br><b>Now split verification in two.</b> ${loK} reaches the ID-photo screen at <b>${PCT(b0,1)}</b> against ${hiK}'s ${PCT(a0,1)} (${g0.toFixed(1)}pp apart), then clears approval at <b>${PCT(b1,1)}</b> against ${PCT(a1,1)} (${g1.toFixed(1)}pp apart). The two multiply back to the step itself &mdash; ${PCT(b0,1)} &times; ${PCT(b1,1)} = ${PCT(b0*b1,1)} &mdash; so the gap divides between them exactly, and <b>${Math.round(share*100)}% of it opens after the photo is sent</b>. ${cause}`;

  // for an audience problem rather than a product problem, and it is checked

     the comparison has already answered it. */
  const onlyOne = !worst.hi || !worst.lo;
  const verdict = onlyOne
    ? `<div class="note" style="margin-top:10px"><b>Only one ${dimName} still has users in it.</b> Your comparison has already filtered down to a single ${dimName}, so breaking the funnel down by ${dimName} on top of that has nothing left to compare — every other column is empty by construction. Either drop the ${dimName} condition from your comparison and use this breakdown instead, or keep the comparison and break down by something else. Two ways of asking the same question do not stack.</div>`
    : HARD
    ? `<div class="note" style="margin-top:10px"><b>Read down the Spread column before you read anything else.</b> If one row is far larger than the rest, the ${dimName} difference is a property of that <i>step</i> &mdash; something in the product. If every row is similar, the ${dimName} is simply a worse audience all the way through, and no single fix will move it. Check the z beside each spread before you believe any of them, and remember that a gap can be real and still be too small to be worth anything.</div>`
    : `<div class="note" style="margin-top:10px">${
        material.length<=1
        ? `<b>The ${dimName} gap is entirely at one step.</b> ${worst.label} runs <b>${worst.spread.toFixed(1)}pp</b> apart (${worst.hi.k} ${PCT(worst.hi.v,0)} against ${worst.lo.k} ${PCT(worst.lo.v,0)}, z ${worst.z.toFixed(0)}); no other step exceeds <b>${nextSpread.toFixed(1)}pp</b>. If ${worst.lo.k} were simply a weaker audience they would trail everywhere &mdash; they do not, so this is the <i>step</i>, not the people. It also disposes of the tracking objection: ${an(worst.lo.k)} event that under-fired at verification would <b>inflate</b> every rate measured after it, and the later steps sit within ${nextSpread.toFixed(1)}pp of ${worst.hi.k}.`
        : `<b>${dimName==='channel'?'Channel':'Platform'} matters at ${material.length} steps, not one</b> &mdash; ${material.map(r=>`${r.label} <b>${r.spread.toFixed(1)}pp</b>`).join(', ')}. ${flip?`And one of them turns over: <b>${flip.k}</b> is the strongest ${dimName} at ${flip.up.label} (${PCT(flip.up.hi.v,0)}) and the weakest at ${flip.dn.label} (${PCT(flip.dn.lo.v,0)}). A ${dimName} that converts well at the top and badly one step down is not meeting a broken screen &mdash; it is bringing the wrong people, and that is a spend decision rather than a product fix.`:`No segment leads at one step and trails at another, so this is a general quality difference rather than a specific breakage &mdash; expect a smaller, broader fix.`}`

function segMatrix(X,colLabel,marginLabel){
  X=X||DATA.segCross; colLabel=colLabel||'All<br>channels'; marginLabel=marginLabel||'Platform and Channel';
  const dimLabel=marginLabel.toLowerCase().replace(' and ',' and ');
  /* Under a comparison the grid is rebuilt, and it can come back empty or with
     holes in it. Math.min over a NaN returns NaN and quietly repaints the whole
     table the same colour, which would look like a finding. Zero-base cells are
     excluded from the scale and drawn as em-dashes instead. */
  if(!X.rows.length || !X.cols.length)
    return `<div class="cno"><b>This cross-tab is empty under your comparison.</b> Nobody in the segment you built reached the sign-up step, so there are no cells to cross. That is an answer &mdash; it just is not this chart's answer.</div>`;
  const cells=[];
  X.rows.forEach(r=>X.cols.forEach((c,j)=>{ const b=X.base[r][j]; if(b) cells.push(X.n[r][j]/b); }));
  if(!cells.length)
    return `<div class="cno"><b>This cross-tab is empty under your comparison.</b> Every cell in the grid has a base of zero.</div>`;
  const lo=Math.min(...cells), hi=Math.max(...cells);
  const worst=lo;
  // Expected rate for a cell if platform and channel did NOT interact:
  //   rowRate x colRate / grandRate.
  // The gap between expected and observed (the residual) is the only thing in
  // this table that counts as a discovery. A cell can be the worst in the grid
  // and still be perfectly ordinary once you account for its two margins.
  const gBase=X.rows.reduce((a,r)=>a+X.base[r].reduce((x,y)=>x+y,0),0);
  const gN   =X.rows.reduce((a,r)=>a+X.n[r].reduce((x,y)=>x+y,0),0);
  const gRate=gBase?gN/gBase:0;
  const colRate=X.cols.map((c,j)=>{const cb=X.rows.reduce((a,r)=>a+X.base[r][j],0); return cb?X.rows.reduce((a,r)=>a+X.n[r][j],0)/cb:0;});
  const rowRate={}; X.rows.forEach(r=>{const rb=X.base[r].reduce((a,b)=>a+b,0); rowRate[r]=rb?X.n[r].reduce((a,b)=>a+b,0)/rb:0;});
  const expected=(r,j)=>gRate?rowRate[r]*colRate[j]/gRate:null;
  const head=`<tr><th class="rh"></th>${X.cols.map(c=>`<th>${c.replace(' ','<br>')}</th>`).join('')}<th style="width:62px">${colLabel}</th></tr>`;
  const body=X.rows.map(r=>{
    const bt=X.base[r].reduce((a,b)=>a+b,0), nt=X.n[r].reduce((a,b)=>a+b,0);
    const tds=X.cols.map((c,j)=>{
      const b=X.base[r][j], n=X.n[r][j];
      if(!b) return `<td class="c"><div class="cell" style="background:var(--line2);color:var(--muted)" data-tip="<span class='tk'>${r} &middot; ${c}</span><br>No sign-ups in this cell under your comparison.<br><span style='opacity:.72'>An empty cell is the segment working, not the data missing.</span>">&mdash;<i>0</i></div></td>`;
      const v=n/b;
      const t=(v-lo)/((hi-lo)||1);
      // low conversion = hot/red, high = cool/blue
      const bg = v<0.30?'var(--critical)': v<0.40?'var(--serious)': v<0.50?'var(--warning)':'var(--s1)';
      const fg = '#fff';
      const ex=expected(r,j), res=(ex!=null)?(v-ex)*100:null;
      const exTxt = (ex==null) ? `<span style='opacity:.75'>no interaction baseline &mdash; nobody in this comparison was approved</span>`
        : `Expected if ${dimLabel} did not interact: <b>${PCT(ex,1)}</b><br>` + (Math.abs(res)<2
          ? `<span style='opacity:.75'>as expected — the two margins simply stack</span>`
          : `<b style='color:${res>0?'#8ef0d8':'#ffb3c8'}'>${res>0?'+':''}${res.toFixed(1)}pp vs expected</b>`);
      return `<td class="c"><div class="cell ${v===worst?'worst':''}" style="background:${bg};color:${fg}" data-tip="<span class='tk'>${r} &middot; ${c}</span><br>${N(n)} approved of ${N(b)} sign-ups<br>= ${PCT(v,1)}<br><br>${exTxt}${moeTip(v,b)}"><b>${PCT(v,0)}</b><i>${baseTag(v,b)}</i></div></td>`;
    }).join('');
    return `<tr><td class="rl">${r}</td>${tds}<td class="c"><div class="cell" style="background:var(--line2);color:var(--ink2)"><b>${bt?PCT(nt/bt,0):'&mdash;'}</b><i>${N(bt)}</i></div></td></tr>`;
  }).join('');
  const ct=X.cols.map((c,j)=>{
    const b=X.rows.reduce((a,r)=>a+X.base[r][j],0), n=X.rows.reduce((a,r)=>a+X.n[r][j],0);
    return `<td class="c"><div class="cell" style="background:var(--line2);color:var(--ink2)"><b>${b?PCT(n/b,0):'&mdash;'}</b><i>${N(b)}</i></div></td>`;
  }).join('');
  const gb=X.rows.reduce((a,r)=>a+X.base[r].reduce((x,y)=>x+y,0),0), gn=X.rows.reduce((a,r)=>a+X.n[r].reduce((x,y)=>x+y,0),0);
  return `<table class="smat">${head}${body}<tr><td class="rl" style="color:var(--muted)">All</td>${ct}<td class="c"><div class="cell" style="background:var(--ink2);color:#fff"><b>${gb?PCT(gn/gb,0):'&mdash;'}</b><i>${N(gb)}</i></div></td></tr></table>
  <p class="csub" style="margin:8px 0 0">Big number = KYC completion &middot; small number = sign-ups in that cell, carrying its <b>&plusmn;95% interval</b> inline where the cell is thin. Margins match the ${marginLabel} views exactly. <b>Hover any cell</b> for its counts, its 95% interval, and what it would be if the two dimensions did not interact — the gap between those two is the only thing here that counts as a discovery, and it only counts if it is bigger than the interval underneath it.</p>`;
}
function paintSeg(){
  const el=document.getElementById('segChart'); if(!el)return;
  /* Under a comparison the breakdown and the comparison are the same operation
     on two different dimensions, so the cross-tabs are drawn once per series
     and the one-dimensional breakdowns become a rate table with the bases
     printed. Row order is taken from the baseline in both cases -- a segment
     that re-sorted itself would put different things in the same row. */
  if(cmpOn()){
    if(curSeg==='cross'||curSeg==='crossdoc'){
      const fn = curSeg==='cross' ? (()=>segMatrix())
                                  : (()=>segMatrix(DATA.segCrossDoc,'All<br>ID types','Platform and ID type'));
      el.innerHTML=`<div class="cno" style="margin-top:0"><b>A cross-tab per series.</b> Each card is the same two-dimensional grid rebuilt inside one of your comparisons &mdash; three dimensions at once, which is about as far as a human can read a table. Cells that empty out say so; a grid that thins to a handful of users per cell is telling you the segment is too narrow for this question, not that the interaction disappeared.</div>`+smallMult(fn);
    } else {
      const keys=BASE_DATA.seg[curSeg].map(i=>i.k);
      const rows=keys.map(k=>({k, get:d=>{const it=(d.seg&&d.seg[curSeg]||[]).find(x=>x.k===k); return it?{n:it.n, base:it.base}:null;}}));
      rows.push({k:'All '+(curSeg==='platform'?'platforms':curSeg==='channel'?'channels':'ID types'), tot:true,
        get:d=>{const a=(d.seg&&d.seg[curSeg])||[]; if(!a.length) return null;
                return {n:a.reduce((x,i)=>x+i.n,0), base:a.reduce((x,i)=>x+i.base,0)};}});
      el.innerHTML=rtab(rows, curSeg==='platform'?'Platform':curSeg==='channel'?'Channel':'ID type')
        + `<p class="csub" style="margin:8px 0 0">Rows are the breakdown, columns are your comparison, and the bottom row is the check &mdash; each column has to reconcile to its own blended rate. <b>Watch the bases.</b> Splitting an already-narrow segment across five channels is how a finding becomes four cells of a few hundred users each, and the &plusmn;interval printed beside a thin cell is there to stop you quoting it.</p>`;
    }
    const nc=document.getElementById('segNote');
    if(nc){ nc.innerHTML=HARD?'':`<b>The commentary below describes the <i>All users</i> column only.</b> ${notesFor(curSeg)}`; nc.style.display=HARD?'none':''; }
    return;
  }
  if(curSeg==='cross'){ el.innerHTML=segMatrix(); }
  else if(curSeg==='crossdoc'){ el.innerHTML=segMatrix(DATA.segCrossDoc,'All<br>ID types','Platform and ID type'); }
  else {
    const items=DATA.seg[curSeg];
    el.innerHTML=hbars(items,{fmt:v=>PCT(v),max:0.6,colorFn:softFn(it=>it.v<0.4?'var(--critical)':'var(--s1)'),
      subFn:it=>`${N(it.n)} / ${N(it.base)}`});
    const tot=items.reduce((a,i)=>a+i.n,0), totb=items.reduce((a,i)=>a+i.base,0);
    el.innerHTML+=`<p class="csub" style="margin:10px 0 0;text-align:right">Adds up to <b>${N(tot)} of ${N(totb)}</b> = ${PCT(tot/totb,0)} — the blended rate. Every breakdown must reconcile to it.</p>`;
  }
  const nn=document.getElementById('segNote'); if(nn){nn.innerHTML=HARD?'':notesFor(curSeg);nn.style.display=HARD?'none':'';}

  'Live events':'The raw event stream. Every action in the app emits an event with properties — this is the ground truth every report is aggregated from.',
  'Event volumes':'Every tracked event ranked by how many users fired it. The gaps between consecutive events are conversion steps — big gaps are leaks.',
  'Acquisition by channel':'Where your sign-ups come from. High volume is not the same as high value — always check how each channel then converts.',
  'Sign-ups by channel':'Sign-up volume by acquisition channel. Read it next to the completion-rate chart — the biggest channel is not always the best one.',
  'Voice of customer':'The qualitative side: what users complain about, ranked. The "why" behind the funnel — read it alongside the numbers.',
  'KYC completion by channel':'The verification pass-rate for each acquisition channel. Reveals whether a channel brings low-intent or friction-sensitive users.',
  'Channel detail':'The same acquisition data as an exact table — sign-up counts and conversion rate per channel.',
  'Break down the KYC step':'Segments one funnel step by platform, channel or ID type. Segmenting turns a blended average into a specific, fixable problem.',
  'Break down the weakest step':'Segments one funnel step by platform, channel or ID type. Segmenting turns a blended average into a specific, fixable problem.',
  'Time to convert':'How long users take to get from one step to the next. A short median with a long tail means most succeed fast — and the rest are fighting friction.',
  'Where inside KYC users quit':'Within a single step, which screen actually loses people — so you know the exact surface to redesign.',
  'Where inside this step users quit':'Within a single step, which screen actually loses people — so you know the exact surface to redesign.',
  'What this costs':'A simple projection: if you lifted this rate, how many extra activations (and dollars) would follow. Turns a UX fix into business value.',
  'Retention curve':'The share of activated users still active after N days. A flat, high curve is healthy; a steep early drop signals a leaky product.',
  'Weekly cohorts':'Retention split by the week users activated. Compare rows to see whether newer cohorts retain better or worse than older ones.',
  'Verification flow':'The verification journey as a Sankey. Bar height is users reaching each screen; the red wedge is who leaks out before the next. Find the fattest red wedge.',
  'Verification flow · Android only':'The same verification journey for Android users only — compare the red wedges to the all-users view to see where the platform gap comes from.',
  'Top drop-off point':'The single largest leak in the path — the one transition losing the most users. Fix this before anything else in the flow.',
  'What verified users do next':'The steps after verification. A healthy tail here proves the journey only breaks in one place — verification itself.',
  'Revenue trend':'Revenue over recent weeks. Look for growth, plateaus or dips you can tie back to a product or funnel change.',
  'Revenue mix':'What revenue is made of (fees vs subscriptions). Shows how concentrated or diversified your income is.',
  'Product engagement':'Feature-adoption among activated users — wallet, repayments, card controls, and the advance-vs-send mix. Shows whether the users you activate actually stick and use the product.',
  'Rating trend':'Average rating over months. Direction matters more than the number — a falling rating is an early warning.',
  'Rating distribution':'How ratings split across 1–5 stars. A bimodal split (many 5s AND many 1s) means some users love it while others hit a wall.',
  'Complaint themes':'Negative reviews grouped by topic, most common first. Tells you what to fix, in users’ own order of priority.',
  'Support tickets':'Support contacts grouped by category. When tickets, reviews and the funnel all agree, you’ve found a real problem.',
  'Recent reviews':'A sample of individual reviews. Read a few word-for-word — the exact phrasing often reveals the root cause.',
  'Activity':'This user’s complete event history, newest first. A single trail like this often reveals the exact failure an aggregate only hints at.',
  'Properties':'The user’s profile attributes — platform, version, channel, country, value. What you filter and break down cohorts by.'
};
function decorateEdu(){
  document.querySelectorAll('#panel .card').forEach(c=>{
    if(c.dataset.eduDone)return;
    const t=c.querySelector('h3')||c.querySelector('.tile .lab');
    if(!t)return;
    const key=(t.childNodes[0]?t.childNodes[0].textContent:t.textContent).trim().replace(/\s+/g,' ');
    let e=EDU[key]|| EDU[key+' '] || null;
    if(e){c.setAttribute('data-edu',e);c.dataset.eduDone='1';
      if(!t.querySelector('.edu-i')){const i=document.createElement('span');i.className='edu-i';i.textContent='ⓘ';t.appendChild(i);} }
  });
}
let cur='overview';
// Hard mode strips every answer cue — the bottleneck flag, the red highlights,
// the verdict notes — so a group has to find the story instead of reading it.
// It is settable two ways, and BOTH persist, because the old version reset on
// every refresh and quietly handed the answers back.
//   1. ?mode=hard / ?hard=1 in the URL (this is what the facilitator shares)
//   2. the chip in the header
// Either route writes localStorage, so whatever was last chosen is what comes
// back on the next load, with or without the query string.
// The URL branch has to WRITE, not just read. It used to return the answer
// straight out of the query string, which meant the shared ?mode=hard link was
// the one setting that did NOT survive a refresh — the exact inverse of what
// this comment and four other documents claimed. A facilitator sharing the link
// would watch a pair reload the tab mid-exercise and get the red banner back.
let HARD=(function(){
  const remember=(v)=>{ try{ localStorage.setItem('nimbusHard', v?'1':'0'); }catch(e){} return v; };
  try{
    const q=new URLSearchParams(location.search);
    if(q.has('mode')) return remember(q.get('mode')==='hard');
    if(q.has('hard'))  return remember(q.get('hard')!=='0');
    return localStorage.getItem('nimbusHard')==='1';
  }catch(e){ return false; }
})();
// Hard mode has to travel. The workbook and the tracker both link back here, and
// a pair that clicked through from a ?mode=hard tab used to land in soft mode and
// read the Exercise-3 answer off the bottleneck banner. Any link on this page
// carrying data-keepmode picks the current mode up on the way out.
function hardHref(href){
  if(!HARD) return href;
  return href + (href.indexOf('?')<0?'?':'&') + 'mode=hard';
}
const softFn=(fn)=>HARD?(()=> 'var(--s1)'):fn;
function paintHardChip(){
  const c=document.getElementById('hardChip'); if(!c)return;
  c.textContent='🎓 Hard mode: '+(HARD?'ON':'off');
  c.style.background=HARD?'var(--brand)':''; c.style.color=HARD?'#fff':'';
  c.style.borderColor=HARD?'var(--brand)':'';
}
function toggleHard(){
  HARD=!HARD;
  try{ localStorage.setItem('nimbusHard',HARD?'1':'0'); }catch(e){}
  paintHardChip(); nav(cur);
}
// paint the chip on load so a ?mode=hard link does not look like it did nothing
document.addEventListener('DOMContentLoaded',paintHardChip);
function paintRail(){
  document.getElementById('rail').innerHTML=NAV.map(sec=>
    (sec.grp?`<div class="grp">${sec.grp}</div>`:'<div style="height:4px"></div>')+
    sec.items.map(it=>`<div class="nav ${cur===it[0]?'on':''}" data-edu="${(it[3]||'').replace(/"/g,'&quot;')}" onclick="nav('${it[0]}')"><span class="ic">${it[1]}</span>${it[2]}</div>`).join('')
  ).join('');
}
function nav(v){
  cur=v; paintRail();
  document.getElementById('panel').innerHTML=VIEWS[v]();
  window.scrollTo(0,0);
  if(v==='funnel'){ setSeg(curSeg,null); }
  if(v==='insights'){
    document.getElementById('insEvBtn').onclick=toggleInsMenu;
    const bi=insBd==='none'?1:insBd==='plat'?2:3;
    document.querySelectorAll('#insBd button').forEach((b,i)=>b.classList.toggle('on',i===bi-1));
    document.getElementById('insU').style.opacity=insMeasure==='uniq'?1:.55;
    document.getElementById('insT').style.opacity=insMeasure==='tot'?1:.55;
    paintIns();
  }
  decorateEdu();
  requestAnimationFrame(fitFunnelLabels);
}
/* Measure, do not guess. A 6.7% bar is unreadable on a phone and perfectly
   readable on a laptop, and hard mode changes the shape of the funnel, so the
   only honest test is whether the text fits the box it is in right now. */
function fitFunnelLabels(){
  document.querySelectorAll('.fnl .fstep').forEach(st=>{
    const bar=st.querySelector('.fbar'), out=st.querySelector('.fnumout');
    if(!bar||!out) return;
    bar.classList.remove('tiny'); out.classList.remove('on');
    if(bar.scrollWidth>bar.clientWidth+1){ bar.classList.add('tiny'); out.classList.add('on'); }
  });
}
window.addEventListener('resize',fitFunnelLabels);
function toggleTheme(){
  const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',d?'light':'dark');
  document.getElementById('themeChip').textContent=d?'🌙 Dark':'☀️ Light';
}
/* tooltip — data marks (data-tip) take precedence; section explanations (data-edu) otherwise */
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  const ed=e.target.closest('[data-edu]');
  let html=null, edu=false, w=240;
  if(t){ html=t.dataset.tip; }
  else if(ed){ html='<span class="eh">ⓘ What this shows</span>'+ed.dataset.edu; edu=true; w=320; }
  if(html){
    tip.innerHTML=html; tip.className=edu?'edu':''; tip.style.opacity='1';
    let x=e.clientX+14,y=e.clientY+14; if(x>innerWidth-w)x=e.clientX-(w-10); if(y>innerHeight-90)y=e.clientY-80;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  } else { tip.style.opacity='0'; }
});
/* boot */
paintCmpBar();paintRail();nav('overview');
</script>
