.slide.title::after{display:none}
.pad{padding:50px 60px 18px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;position:relative}
.pad::-webkit-scrollbar{width:0}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);margin-bottom:14px}
h1{font-size:46px;line-height:1.05;letter-spacing:-.02em;margin:0 0 14px;font-weight:600;color:var(--navy)}
h2{font-size:33px;line-height:1.1;letter-spacing:-.015em;margin:0 0 14px;font-weight:600;color:var(--navy)}
h1::after,h2::after{content:"";display:block;width:52px;height:5px;border-radius:3px;background:var(--pink);margin-top:14px}
h3{font-size:20px;margin:0 0 6px;font-weight:600;color:var(--navy)}
p{font-size:18px;line-height:1.55;color:var(--slate);margin:0 0 14px}
.big{font-size:21px}
ul{margin:6px 0;padding:0;list-style:none}
li{font-size:18px;line-height:1.5;color:var(--ink);padding:9px 0 9px 30px;position:relative}
li:before{content:"";position:absolute;left:2px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--grad)}
li b{color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
/* Four rungs need tighter cards than three: same padding at 25% width wraps the
   headings onto two lines and pushes the row past the slide. */
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.four .card{padding:16px 15px}
.four .card h3{font-size:15.5px;margin-bottom:4px}
.four .card p{font-size:13.5px;line-height:1.42}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 12px rgba(18,24,38,.05)}
.card h3{font-size:17px}
.card p{font-size:15px;margin:0}
.card h3::after,.card h2::after{display:none}
.tag{display:inline-flex;align-items:center;gap:7px;background:#efeeff;color:var(--indigo);font-weight:700;font-size:14px;padding:6px 13px;border-radius:999px}
.foot{height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 60px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:500}
.conf{color:var(--muted);letter-spacing:.02em}
/* dark statement slides */
.slide.dark{background:radial-gradient(1100px 560px at 16% -18%,#20233a,#121826 62%),#121826;color:#fff}
.slide.dark h1,.slide.dark h2,.slide.dark h3{color:#fff}
.slide.dark .kicker{color:var(--pink)}
.slide.dark p{color:#c7c9d6}
.slide.dark li{color:#e7e8f0}
.slide.dark li b{color:#fff}
.slide.dark .foot{border-color:rgba(255,255,255,.12);color:#8b8fa3}
.slide.dark .conf{color:#8b8fa3}
/* exercise slides (light lavender) */
.slide.ex{background:#f5f4ff}
.slide.ex h1,.slide.ex h2,.slide.ex h3{color:var(--navy)}
.slide.ex p{color:var(--slate)}
.slide.ex li{color:var(--ink)}
.slide.ex li b{color:var(--navy)}
.slide.ex li:before{background:var(--indigo)}
.slide.ex .foot{border-color:#e4e2f6;color:#9a97b5}
.slide.ex .conf{color:#9a97b5}
.slide.dark b{color:#fff}
.exbadge{display:inline-flex;align-items:center;gap:9px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;margin-bottom:16px;box-shadow:0 8px 18px rgba(101,97,255,.28)}
.pill{display:inline-block;background:#fff;border:1px solid #e4e2f6;color:var(--indigo);font-weight:700;font-size:14px;padding:6px 12px;border-radius:9px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.mini .st{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.mini .st.bad{border-color:#fbcfe0;background:#fff0f6}
.mini .st .v{font-size:22px;font-weight:800;color:var(--navy)}
.mini .st .l{font-size:11px;color:var(--slate);font-weight:600;margin-top:3px}
.mini .st .c{font-size:12px;font-weight:700;color:var(--muted);margin-top:5px}
.flow{display:flex;align-items:stretch;gap:0;margin:10px 0}
.flow .n{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 14px;text-align:center;position:relative}
.flow .n .t{font-weight:700;font-size:16px;color:var(--navy)}
.flow .n .d{font-size:12.5px;color:var(--slate);margin-top:4px;line-height:1.35}
.flow .a{display:flex;align-items:center;color:var(--indigo);font-size:22px;padding:0 6px}
.note{font-size:14px;color:var(--slate);background:#f5f4ff;border:1px solid #e6e4fb;border-left:3px solid var(--indigo);border-radius:12px;padding:14px 16px;line-height:1.5;margin-top:auto}
.slide.ex .note{background:#fff;border-color:#e4e2f6;border-left-color:var(--pink);color:var(--slate)}
.slide.dark .note{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);border-left-color:var(--pink);color:#c7c9d6}
.habits li{font-size:16.5px;line-height:1.42;padding:7px 0 7px 26px}
.habits li:before{top:13px}
.eg{display:block;margin-top:5px;font-size:14px;line-height:1.42;color:var(--slate);border-left:2px solid var(--pink);padding-left:10px}
.slide.dark .eg{color:#c7c9d6}
.protocol .card{display:flex;flex-direction:column}
.protocol h3{margin:11px 0 6px;font-size:19px}
.protocol p{font-size:14.5px;line-height:1.45;margin:0 0 8px}
.protocol .why{margin:auto 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.4;color:var(--muted)}
.exhow{display:flex;flex-wrap:wrap;gap:7px;margin:-6px 0 15px}
.exhow span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;color:var(--slate)}
.exhow span b{font-weight:800;color:var(--indigo)}
.exhow .ar{border:none;background:none;padding:0 1px;color:var(--muted);font-weight:600}
.protocol .card{padding:16px 18px}
.rhythm{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.rhythm th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.rhythm td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);color:var(--slate)}
.rhythm tr td:first-child{font-weight:600;color:var(--ink)}
.rhythm th:not(:first-child),.rhythm td:not(:first-child){text-align:center;width:88px}
.rhythm tr td:last-child{font-weight:700;color:var(--indigo)}
.rhythm tr:last-child td{border-bottom:none}
.paral{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
.paral th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 14px 5px 0;border-bottom:1px solid var(--line)}
.paral td{padding:6px 14px 6px 0;border-bottom:1px solid var(--line);color:var(--slate);vertical-align:top;line-height:1.4}
.paral tr td:first-child{font-weight:700;color:var(--ink);white-space:nowrap;width:124px}
.paral tr td:nth-child(2){color:var(--good);width:40%}
.paral tr td:last-child{color:var(--indigo);font-weight:600}
.paral tr:last-child td{border-bottom:none}
.agenda li{padding:13px 0 13px 36px}
.agenda li:before{content:"🧑‍🏫";background:none;width:auto;height:auto;left:0;top:8px;font-size:16px;border-radius:0}
.agenda li.pr:before{content:"👥"}
.agenda li.tm:before{content:"⏱"}
.agenda li.fp{font-size:15px;font-weight:700;color:var(--pink);padding:0 0 10px 36px;margin-top:-11px;line-height:1.4}
.agenda li.fp:before{content:"🤝";top:0}
.agenda li.fp b{color:var(--pink)}
.agenda li.bk:before{content:"☕"}
.agenda li i{font-style:normal;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.doit{background:#fff0f5;border:1px solid #ffd9e6;border-left:3px solid var(--pink);color:var(--slate)}
.doit b{color:var(--pink)}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.kv span{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--slate)}
/* title slide */
.slide.title{background:#fff}
.title-pad{padding:56px 62px;flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.tlogo{position:absolute;top:34px;right:46px;height:42px;z-index:3}
.twolf{position:absolute;right:-16px;bottom:-24px;height:112%;z-index:1;pointer-events:none;filter:drop-shadow(0 12px 34px rgba(250,53,123,.18))}
.tcontent{position:relative;z-index:2;max-width:63%}
.hero{font-size:60px;font-weight:600;line-height:1.0;color:var(--navy);margin:0 0 16px}
.hero::after{content:"";display:block;width:70px;height:6px;border-radius:3px;background:var(--grad);margin-top:20px}
/* QR */
.qrbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 12px rgba(18,24,38,.05)}
.qrimg{min-height:180px;display:grid;place-items:center;margin:0 auto}
.qrimg img{width:180px;height:180px;image-rendering:pixelated;border-radius:6px}
.qrimg.empty{border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;font-weight:600;padding:14px;line-height:1.45;min-height:120px}
.qrcap{font-weight:700;color:var(--navy);margin-top:12px;font-size:15px}
.qrurl{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.qrurl:focus{outline:none;border-color:var(--indigo)}
.qrhint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4;text-align:left}
.qrtog{font-size:10.5px;color:var(--muted);font-weight:700;cursor:pointer;margin-top:8px;user-select:none}
.qrtog:hover{color:var(--indigo)}
.qrlink{display:block;margin-top:9px;background:var(--grad);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.01em;text-decoration:none;padding:8px 10px;border-radius:9px;line-height:1.2}
.qrlink:hover{filter:brightness(1.08)}
.qrlink.off{display:none}
.qrbox.minia .qrlink{margin-top:7px;font-size:11.5px;padding:6px 8px;border-radius:8px}
.cpbtn{display:block;width:100%;margin-top:6px;background:#f2f3f9;border:1px solid var(--line);color:var(--slate);font-family:inherit;font-weight:800;font-size:11px;letter-spacing:.01em;padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1.2}
.cpbtn:hover{border-color:var(--indigo);color:var(--indigo)}
.cpbtn.ok{background:#eafaf1;border-color:#bfe9cf;color:var(--good)}
.cpbtn.off{display:none}
.qrbox:not(.minia) .cpbtn{font-size:12px;padding:7px 10px;margin-top:7px}
.cpbtn.cpi{display:inline-block;width:auto;margin-top:10px;font-size:11.5px;padding:7px 11px}
.tviz{background:#fbfbfe;border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin-bottom:14px}
.tviz svg text{font-family:'Outfit',system-ui,sans-serif}
/* speaker notes */
#notes{position:fixed;left:0;right:0;bottom:0;background:#121826;color:#e7e8f0;padding:16px 26px;font-size:15px;line-height:1.5;
  transform:translateY(100%);transition:.3s;z-index:40;max-height:34vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
#notes.on{transform:none}
#notes b{color:#a5a1ff}
#notes .nh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--pink);font-weight:800;margin-bottom:6px}
/* controls */
.ctl{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:rgba(18,24,38,.85);backdrop-filter:blur(8px);border-radius:999px;padding:7px 10px;z-index:50}
.ctl button{background:transparent;border:0;color:#cbccd6;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;font-family:inherit}
.ctl button:hover{background:rgba(255,255,255,.12);color:#fff}
.ctl .cnt{color:#cbccd6;font-size:13px;font-weight:700;padding:0 10px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.prog{position:fixed;top:38px;left:0;height:3px;background:var(--grad);z-index:60;transition:width .3s}
/* overview grid */
#grid{position:fixed;inset:0;background:#0b0d14;z-index:70;padding:30px;overflow:auto;display:none;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}
#grid.on{display:grid}
.thumb{background:#1b1e2b;border:2px solid transparent;border-radius:10px;padding:14px;cursor:pointer;color:#e7e8f0;min-height:96px}
.thumb:hover{border-color:var(--pink)}
.thumb .tn{font-size:11px;color:var(--pink);font-weight:800}
.thumb .tt{font-size:14px;font-weight:700;margin-top:6px;line-height:1.25}
.hint{position:fixed;bottom:16px;left:18px;color:#5b6070;font-size:12px;font-weight:600;z-index:50}

/* section bar + timer */
.secbar{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;gap:4px;padding:0 12px;background:rgba(11,13,20,.94);z-index:55}
.secbar .sec{display:flex;align-items:center;gap:6px;color:#8b90a5;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.secbar .sec:hover{background:rgba(255,255,255,.08);color:#fff}
.secbar .sec.on{background:var(--grad);color:#fff}
.secbar .sec.done{color:#c7c9d6}
.secbar .sec .sn{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:10px}
.secbar .sec.on .sn{background:rgba(255,255,255,.25)}
.secbar .sec .sm{font-size:10px;color:inherit;opacity:.7}
.secbar .sp{flex:1}
#timer{display:flex;align-items:center;gap:7px;background:#1b1e2b;border:1px solid #2a2e40;border-radius:999px;padding:4px 12px;cursor:pointer;color:#cbccd6;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;user-select:none}
#timer .tl{font-size:11px}
#timer.run{border-color:var(--indigo);color:#fff}
#timer.over{border-color:var(--pink);color:var(--pink)}
/* compact QR card (no input) */
.kitrow{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.42;color:var(--slate);box-shadow:0 1px 6px rgba(18,24,38,.04)}
.kitrow b{color:var(--navy)}
.kiti{font-size:17px;line-height:1.25;flex:0 0 auto}
.kitm{color:var(--muted);font-size:12px;font-weight:600}
.kitlnk{display:flex;align-items:center;gap:8px}
.kitlnk span{flex:0 0 62px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kitlnk code{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;background:#f4f4f9;border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--navy);word-break:break-all;line-height:1.3}
.qrbox.minia{padding:10px 12px;flex:0 0 auto}
.qrbox.minia .qrimg{min-height:132px}
.qrbox.minia .qrimg img{width:132px;height:132px}
.qrbox.minia .qrcap{font-size:12.5px;margin-top:6px}
/* SCALE TO FIT, rather than reflow to fit.
   The slide used to be sized in viewport units (width:min(1120px,94vw);
   height:min(680px,92vh)), so every window size produced a DIFFERENT layout: a
   narrower window wrapped every line one word earlier, each wrap cost a line
   box, and the surplus height disappeared into .pad{overflow:auto} with the
   scrollbar suppressed two rules above. Twelve slides silently lost their
   bottom edge at 1024x768 and five at 1152x864 -- among them the entire
   "Pair (11 min)" block of Exercise 3 -- with nothing on screen to say so. A
   facilitator who simply had the browser un-maximised was presenting a
   truncated deck and could not know it.
   So: fix the design box at 1120x700 and scale the whole slide instead. Every
   viewport above the phone breakpoint now renders the SAME layout, which means
   a slide that fits at the design size fits everywhere, and test-deck-fit.js
   has exactly one geometry to guard instead of an open-ended list of window
   sizes. Below 701px the phone rules still reflow to one column, because
   scaling a 1120px slide onto a 390px phone would render 6px body text.
   --k comes from fitSlides(); the 1 fallback keeps the deck usable if it
   somehow never runs. */
@media(min-width:701px){
  .slide{width:1120px;height:700px;transform:translateY(14px) scale(calc(var(--k,1)*.99))}
  .slide.on{transform:scale(var(--k,1))}
}
@media(max-width:700px){.pad,.title-pad{padding:30px 26px}h1{font-size:32px}h2{font-size:25px}.hero{font-size:38px}.tcontent{max-width:100%}.twolf{opacity:.18}.two,.three,.four{grid-template-columns:1fr}.flow{flex-direction:column}.flow .a{transform:rotate(90deg);padding:4px 0}}
</style>
</head>
<body>
<div class="secbar" id="secbar"></div>
<div class="prog" id="prog"></div>
<div class="hint">← → navigate · N notes · O overview · T timer · R reset timer</div>
<div class="stage" id="stage"></div>
<div id="grid"></div>
<div id="notes"></div>
<div class="ctl">
  <button onclick="prev()">‹</button>
  <span class="cnt" id="cnt">1 / 1</span>
  <button onclick="next()">›</button>
  <button onclick="toggleNotes()" title="Speaker notes (N)">🗒️</button>
  <button onclick="toggleGrid()" title="Overview (O)">▦</button>
</div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;

        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

/* a link is the configurable base URL for the key + an optional per-slide hash (#ex3) */
function qrFull(key,hash){const b=(QR[key]||'').trim();return b?b+(hash||''):'';}
function renderQR(key){
  const inp=document.getElementById('url-'+key); const base=QR[key]||'';
  if(inp && document.activeElement!==inp && inp.value!==base) inp.value=base;
  document.querySelectorAll('[data-qr="'+key+'"]').forEach(box=>{
    const url=qrFull(key,box.dataset.hash), mini=!!box.closest('.qrbox.minia');
    if(/^https?:\/\/.+/i.test(url)){

      catch(e){box.innerHTML='That URL is too long or invalid for a QR code.';box.classList.add('empty');}
    } else { box.innerHTML=mini?'…':'⚙️ Set the URL below to generate the code'; box.classList.add('empty'); }
  });
  document.querySelectorAll('[data-lnk="'+key+'"]').forEach(a=>{
    const url=qrFull(key,a.dataset.hash);
    if(/^https?:\/\/.+/i.test(url)){a.href=url;a.classList.remove('off');} else {a.removeAttribute('href');a.classList.add('off');}
  });
  document.querySelectorAll('[data-cp="'+key+'"]').forEach(b=>{
    const url=qrFull(key,b.dataset.hash);
    b.classList.toggle('off',!/^https?:\/\/.+/i.test(url)); b.title=url;
  });
}
/* copy-to-clipboard for the facilitator: paste straight into Slack */
function copyFallback(text){
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:-1000px;left:0;opacity:0';
  document.body.appendChild(ta);ta.select();
  let ok=false; try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); return ok;
}
function copyLink(btn){
  const url=qrFull(btn.dataset.cp,btn.dataset.hash);
  if(!/^https?:\/\/.+/i.test(url))return;
  const flash=(msg,cls)=>{
    if(!btn.dataset.label)btn.dataset.label=btn.textContent;
    btn.textContent=msg;btn.classList.remove('ok');if(cls)btn.classList.add(cls);
    clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.textContent=btn.dataset.label;btn.classList.remove('ok');},2400);
  };
  const ok=()=>flash('✓ Copied — paste it in Slack','ok');
  const fail=()=>{ if(copyFallback(url)) ok(); else flash('Press ⌘/Ctrl+C to copy'); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok,fail);
  else fail();
}

  <div class="tcontent">
    <div class="kicker">Wolfpack Digital · Product Team</div>
    <h1 class="hero">Data Analysis<br>Workshop</h1>
    <p class="big" style="max-width:560px;color:var(--slate)">From analytics to product decisions — map the journey, read the funnel, find the bottleneck, and turn it into an initiative-based plan you can pitch to a client.</p>
    <div class="kv" style="margin-top:22px"><span>⏱ Half-day, hands-on</span><span>👥 Solo → pairs → debrief</span><span>📱 Live product + analytics</span></div>
  </div>
</div>${foot('Facilitation deck')}`,
 notes:`Welcome everyone. Frame the day: <b>by the end, every person in this room will have diagnosed a real-looking product and produced a client-ready plan to fix its biggest problem.</b> We learn the method on a worked example (a commerce app, Bloom) and you apply it hands-on to a fintech app (Nimbus). All data is synthetic — built for teaching. Keep energy high; this is hands-on, not a lecture.<br><br><b>Before you start — two facilitator affordances.</b> Every QR card on this deck also carries a <b>🔗 Open</b> button (opens the tool in a new tab on your screen) and a <b>📋 Copy</b> button (puts the URL on your clipboard — paste it straight into the Slack channel). The exercise slides copy a <b>deep link</b> that lands people on that exact exercise, e.g. <code>…/exercise-workbook.html#ex3</code>, so nobody has to click through. <b>Post each link in Slack as you start the exercise</b>, not all at once at the beginning — it keeps the channel readable and stops people running ahead. If you're self-hosting the kit elsewhere, hit <b>⚙️ change link</b> on any QR card once; the QR, the open button and the copy button all re-point together and it saves on this device.`},

{section:0,html:`<div class="pad">
  <div class="kicker">Why we're here</div>
  <h2>Great PMs don't guess which feature to build next. They follow the evidence.</h2>
  <div class="two" style="margin-top:8px">
    <div><ul>
      <li><b>The data tells you WHERE</b> users struggle — which step of the journey leaks.</li>
      <li><b>The feedback tells you WHY</b> — reviews, tickets and NPS explain the number.</li>
      <li><b>An initiative-based plan turns that into action</b> — bets tied to a KPI target, not a wishlist.</li>
      <li><b>A clear client story wins the work</b> — evidence → diagnosis → plan → impact.</li>
    </ul></div>
    <div class="card" style="align-self:center">
      <h3>The trap we're avoiding</h3>
      <p style="margin-bottom:10px">"Users are complaining, let's redesign the home screen." → months of work, the number doesn't move.</p>
      <h3 style="color:var(--indigo)">The habit we're building</h3>
      <p>"60% of sign-ups never verify, and 61% of that drop is one screen — fix that screen." → measurable lift.</p>
    </div>
  </div>
</div>${foot('Why data-driven PM')}`,
 notes:`Make it concrete: most feature debates are opinion vs opinion. Data + feedback replace that with "here's the leak, here's the cause, here's the bet." Ask the room: <b>"When did you last ship something because the data pointed at it — vs because someone senior asked?"</b> Keep it light.`},

{cls:'dark',section:0,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">The mindset</div>
  <h1>No one will ask you for the insight.</h1>
  <p class="big" style="max-width:780px">Clients send requests. Backlogs send tickets. But the suggestions that actually move a product don't arrive as anyone's request — they exist because a PM got <b>curious</b> and went looking, then was <b>proactive</b> enough to bring what they found.</p>
  <div class="kv" style="margin-top:20px"><span style="color:#c7d2fe;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)">🔍 Curiosity finds it</span><span style="color:#c7d2fe;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)">📊 Data validates it</span><span style="color:#c7d2fe;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)">🚀 Proactivity ships it</span></div>
</div>${foot('The mindset')}`,
 notes:`Land this hard before any method: ask the room — <b>"when did a client last ASK you to find their bottleneck?"</b> Never. That's the point. Nobody writes a ticket saying "please discover the insight". The PMs clients trust are the ones who show up with the finding no one requested. The next two slides split this into the two habits: curiosity and proactivity.`},

{section:0,html:`<div class="pad">
  <div class="kicker">The mindset · be curious</div>
  <h2>Insights hide in plain sight — curiosity is what finds them</h2>
  <div class="two">
    <ul>
      <li><b>Open the dashboard nobody asked you to open</b> — weekly, not quarterly. The biggest leaks sit in reports everyone has access to and no one reads.</li>
      <li><b>Read reviews and tickets on a normal Tuesday</b> — not only after a crisis. Users explain the "why" for free, in their own words.</li>
      <li><b>Chase "that's weird."</b> A number that breaks the pattern of its neighbours is an invitation, not noise.</li>
      <li><b>Walk the product yourself, end to end.</b> Feel the friction your charts only describe.</li>
    </ul>
    <div class="card" style="align-self:center">
      <h3>Curiosity, structured</h3>
      <p>Curiosity finds the thread; this workshop gives you the method that pulls it — journey → funnel → bottleneck → plan → story.</p>
      <div class="note" style="margin-top:10px">The bottleneck you'll diagnose today was "hiding" in a dashboard the whole team could open. Someone just had to look.</div>
    </div>
  </div>
</div>${foot('Mindset · curiosity')}`,
 notes:`Make each habit concrete with a 10-second example from your own work if you have one. The point to stress: curiosity is a scheduled behaviour, not a personality trait — put "read 20 reviews + open the funnel" in your calendar. Tie to today: everything they'll find in the exercises was findable months ago by anyone who looked.`},

{section:0,html:`<div class="pad">
  <div class="kicker">The mindset · be proactive</div>
  <h2>Bring the suggestion before anyone asks for it</h2>
  <div class="flow" style="margin-bottom:8px">
    <div class="n"><div class="t">Notice</div><div class="d">a weird number, a repeated complaint</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Dig</div><div class="d">segment it, read the feedback</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Validate</div><div class="d">3 pieces of evidence, not a hunch</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Suggest</div><div class="d">an initiative tied to a KPI target</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Win</div><div class="d">the client funds it — trust grows</div></div>
  </div>
  <div class="two" style="margin-top:8px">
    <ul>
      <li>A valid suggestion is <b>always grounded in data or user evidence</b> — but the request for it will <b>never appear in your inbox</b>. If you wait to be asked, it doesn't happen.</li>
      <li><b>Proactive ≠ opinionated.</b> "I think we should redesign onboarding" is an opinion. "60% never verify, and 61% of that drop is one screen — here's a scored plan" is a suggestion.</li>
    </ul>
    <div class="card" style="align-self:center">
      <h3>Why it matters commercially</h3>
      <p>Evidence-based, unprompted suggestions are what turn a delivery team into a <b>product partner</b> — clients fund findings, not feature lists. It's how engagements grow.</p>
    </div>
  </div>
</div>${foot('Mindset · proactivity')}`,
 notes:`This is the agency superpower: walking into a client call with "we noticed something in your data — and here's a validated plan for it". Contrast the two failure modes: the reactive PM (waits for the backlog) and the opinionated PM (suggests without evidence). The loop on this slide IS the workshop — Notice→Dig→Validate→Suggest is exactly moves 1–5. Today trains the muscle.`},

{section:0,html:`<div class="pad">
  <div class="kicker">What you'll learn</div>
  <h2>Six skills you'll leave with</h2>
  <div class="two">
    <ul>
      <li><b>Map a user journey</b> and spot the gates where products break.</li>
      <li><b>Build and read a funnel</b> — step vs overall conversion, and how to size the prize.</li>
      <li><b>Diagnose a bottleneck</b> by triangulating quant (funnel + segments) with qual (reviews, tickets, NPS).</li>
    </ul>
    <ul>
      <li><b>Turn a diagnosis into an initiative-based plan</b> — Objective → Initiatives → Actions, prioritised with ICE.</li>
      <li><b>Tell the client story</b> that turns evidence into an approved plan.</li>
      <li><b>Read a product-analytics tool fluently</b> — funnels, retention, flows, cohorts and user profiles.</li>
    </ul>
  </div>
  <div class="note">The method is product-agnostic. You'll learn it on a worked example and practise it on a second product — then you can point it at anything you own.</div>
</div>${foot('Learning outcomes')}`,
 notes:`Set the learning contract explicitly — people focus better when they know the target. Emphasise these are portable skills, not Nimbus trivia. If anyone's analytics-shy, reassure them: reading the dashboard fluently is one of the outcomes, not a prerequisite.`},

{section:0,html:`<div class="pad">
  <div class="kicker">What you'll walk away with</div>
  <h2>Outputs, and how the time splits</h2>
  <div class="two">
    <div>
      <h3>In your hands by the end</h3>
      <ul>
        <li>A completed <b>journey + funnel</b> for a real-looking product</li>
        <li>A written <b>diagnosis</b> backed by 3 pieces of evidence</li>
        <li>A prioritised <b>initiative plan</b> (Objective → Initiatives → Actions, ICE-ranked)</li>
        <li>A <b>client story</b> outline — the pitch that wins the work</li>
      </ul>
    </div>
    <div class="card" style="align-self:center">
      <h3>35% teaching · 65% doing</h3>
      <div class="mini" style="grid-template-columns:1fr 1fr;margin-top:4px">
        <div class="st"><div class="v">75m</div><div class="l">Concept &amp; report tour</div></div>
        <div class="st"><div class="v">140m</div><div class="l">Hands-on &amp; debrief</div></div>
      </div>
      <p style="margin-top:12px">Each move is a few minutes of theory, then you do it. You keep everything you produce — it lives in your browser and prints to PDF.</p>
      <p style="margin-top:8px;opacity:.7;font-size:.86em">225 minutes, less a 10-minute break. Add up the next slide if you want to check — we would rather you did. The one judgement call: the 8-minute model-deck walk at the reveal is booked as debrief. Call it teaching instead and the split is 39/61.</p>
    </div>
  </div>
</div>${foot('Outcomes & format')}`,
 notes:`Manage expectations on format: this is a working session, not a lecture. The 35/65 split is a promise — hold yourself to it; if a concept runs long, cut it and let them learn by doing. If someone adds the agenda up and challenges the number, that is a <b>good</b> outcome on day one of a data workshop: 75 minutes facilitator-led against 140 in their hands, out of 215 working minutes. Say so and move on. Point out the deliverables are theirs to take home in the workbook and tracker.`},

{section:0,html:`<div class="pad">
  <div class="kicker">Agenda</div>
  <h2>How the 3h45 runs</h2>
  <div class="two agenda">
    <ul>
      <li><b>Welcome &amp; the method</b> — why + five moves <span class="pill" style="background:#eef2ff;color:var(--indigo)">20m</span></li>
      <li class="fp">We <b>form pairs</b> here — about 10 minutes in. Same partner all day.</li>
      <li class="pr"><b>Meet the product</b> — explore the app together <span class="pill" style="background:#eef2ff;color:var(--indigo)">10m</span></li>
      <li><b>Tour the analytics</b> — read each report <span class="pill" style="background:#eef2ff;color:var(--indigo)">20m</span></li>
      <li class="pr"><b>Move 1 · Map the user journey</b> <i>teach 5 + do 15</i> <span class="pill" style="background:#eef2ff;color:var(--indigo)">20m</span></li>
      <li class="pr"><b>Move 2 · Build the funnel</b> <i>teach 5 + do 15</i> <span class="pill" style="background:#eef2ff;color:var(--indigo)">20m</span></li>
    </ul>
    <ul>
      <li class="pr"><b>Move 3 · Diagnose the bottleneck</b> <i>teach 5 + do 25</i> <span class="pill" style="background:#eef2ff;color:var(--indigo)">30m</span></li>
      <li class="bk"><b>Break</b> — at the two-hour mark <span class="pill" style="background:#eef2ff;color:var(--indigo)">10m</span></li>
      <li class="pr"><b>Move 4 · Initiative-based plan</b> <i>teach 10 + do 30</i> <span class="pill" style="background:#eef2ff;color:var(--indigo)">40m</span></li>
      <li class="pr"><b>Move 5 · The client story</b> <i>teach 10 + do 30</i> <span class="pill" style="background:#eef2ff;color:var(--indigo)">40m</span></li>
      <li><b>Reveal + debrief</b> — the model answer <span class="pill" style="background:#eef2ff;color:var(--indigo)">15m</span></li>
      <li class="tm" style="color:var(--muted)">~3h45 total · a section timer sits top-right — start it as each block begins</li>
    </ul>
  </div>
  <div class="note"><b>👥 = you work in pairs</b> (solo → pair → debrief) · <b>🧑‍🏫 = whole room together</b>. Each Move is a short teach to the room, then the exercise in pairs — six of the nine working blocks are paired. Everything lives in the browser. No installs, no logins.</div>
</div>${foot('Agenda')}`,
 notes:`Set expectations on pace. Exercises are the point; teaching bits are short. Walk the 👥 column explicitly — "everything with two heads next to it you do with a partner, that's most of the day." Confirm logistics: one laptop per pair is enough, but <b>everyone fills in their own workbook</b>. Workbook open in one tab, dashboard in another. Point out the section bar at the top of the deck. <b>Do not form the pairs yet</b> — the next slide is where you do it, and it explains the solo→pair→debrief rhythm first so people know what they're signing up for. Do not skip that slide; it is what makes the exercises work.<br><br><b>Be honest about the length.</b> It is 3h45 with the break, not "a half day" in the three-hour sense — say the finish time out loud now so nobody has a hard stop they haven't mentioned.<br><br><b>Running late? Cut in this order</b> — and decide by the break, not in the last twenty minutes: (1) trim the <b>Move 5 teaching</b> to the one-slide version and let the story structure come out of the workbook template; (2) drop <b>Exercise 5 to a 10-minute outline</b> — headline plus three bullets, no full narrative; (3) shorten the <b>Ex 1 and Ex 2 debriefs</b> to two pairs each instead of a full round. <b>Never cut:</b> the break, Exercise 3 (the diagnosis is the spine of the whole day), or the reveal — the model answer is what people photograph and take home.`},

{section:0,html:`<div class="pad">
  <div class="kicker">How every exercise runs</div>
  <h2>Alone first. Then in pairs. Then the room.</h2>
  <div class="three protocol">
    <div class="card">
      <div class="tag" style="background:#eef2ff;color:var(--indigo)">1 · Solo</div>
      <h3>Think on your own</h3>
      <p>Silently write <b>your own</b> answer in <b>your own</b> workbook. No discussion yet. Short — a few minutes.</p>
      <p class="why">Why: talking first generates <b>fewer and weaker</b> ideas than thinking alone first — the nominal-group finding (Diehl &amp; Stroebe, 1987).</p>
    </div>
    <div class="card">
      <div class="tag" style="background:#fff0f5;color:var(--pink)">2 · Pair</div>
      <h3>Compare &amp; reconcile</h3>
      <p>Turn to your partner. Where do you differ? Argue it out and agree one answer to carry forward. Swap who drives each exercise.</p>
      <p class="why">Why: answers that change after discussion go <b>wrong→right far more than right→wrong</b> — it converts, not averages (Crouch &amp; Mazur, 2001).</p>
    </div>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">3 · Debrief</div>
      <h3>Share with the room</h3>
      <p>One pair presents; others add what differed. <b>The person who wasn't typing speaks.</b></p>
      <p class="why">Why: social loafing <b>shrinks when individual contributions are identifiable</b> — it doesn't vanish, which is why we name who speaks (Karau &amp; Williams, 1993).</p>
    </div>
  </div>
  <table class="rhythm">
    <tr><th>Exercise</th><th>🧍 Solo</th><th>👥 Pair</th><th>🗣 Debrief</th><th>Total</th></tr>
    <tr><td>1 · Map the user journey</td><td>3m</td><td>7m</td><td>5m</td><td>15m</td></tr>
    <tr><td>2 · Build the funnel</td><td>4m</td><td>6m</td><td>5m</td><td>15m</td></tr>
    <tr><td>3 · Diagnose the bottleneck</td><td>7m</td><td>11m</td><td>7m</td><td>25m</td></tr>
    <tr><td>4 · Initiative-based plan</td><td>8m</td><td>14m</td><td>8m</td><td>30m</td></tr>
    <tr><td>5 · Draft the client story</td><td>10m</td><td>12m</td><td>8m</td><td>30m</td></tr>
  </table>
  <div class="note doit" style="margin-top:10px"><b>🤝 Find your partner now</b> — same pair all day. Pick someone you <b>don't</b> work with daily. Odd number? One trio, never four.</div>
</div>${foot('How exercises run')}`,
 notes:`This is the operating manual for the rest of the session — 90 seconds on the three phases, then <b>form the pairs right here, before you teach anything else</b>. This is the moment: people are still settling, nothing is in flight, and they'll be seated with their partner for the method teaching and the app tour, so they're already talking by the time Exercise 1 starts. Don't leave pairing until just before Ex 1 — the shuffle costs you five minutes and the first exercise starts cold.<br><br><b>How to pair:</b> assign, don't let the room self-select — left to themselves people sit with whoever they already work with and reproduce the same hierarchy. Say it plainly: "partner with someone from a different team, and try to mix someone comfortable with analytics with someone who isn't." Count the room; odd number gets exactly one trio. Give it 2 minutes, then move on — don't let it become an activity.<br><br>The temptation all day will be to skip the solo phase because it feels slow; don't. It is what stops the loudest person in each pair from setting the answer before anyone else has thought. Two rules you enforce personally: <b>everyone writes in their own workbook</b> even when a pair shares one laptop, and <b>at debrief you call on the person who was not typing</b>. Say out loud that you'll do the second one — knowing it's coming is most of the effect. If someone asks why not bigger groups: bigger groups mean less airtime each and more room to coast, with no better answers.`},

/* ===================== SECTION 1 · METHOD ===================== */
{cls:'dark',section:1,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Part 1</div>
  <h1>The method</h1>
  <p class="big" style="max-width:760px">One repeatable loop — five moves — that takes you from raw analytics to a plan a client will fund. Plus the habits that keep you honest while reading data.</p>
</div>${foot('Part 1 · The method')}`,
 notes:`A breath between sections. Keep it to 20 seconds: "First we learn the loop and the reading habits; then we meet the product and practise the loop end-to-end." Dividers like this are your pacing markers all day.`},

{section:1,html:`<div class="pad">
  <div class="kicker">The framework · the spine of the day</div>
  <h2>Five moves, in order</h2>
  <div class="flow">
    <div class="n"><div class="t">1 · Journey</div><div class="d">The path a user takes to value</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">2 · Funnel</div><div class="d">Turn the journey into measurable steps</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">3 · Bottleneck</div><div class="d">Find the biggest leak + why it leaks</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">4 · Initiatives</div><div class="d">Bets tied to a KPI target</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">5 · Client story</div><div class="d">Evidence → plan → impact → ask</div></div>
  </div>
  <p style="margin-top:22px">Each exercise is one move. By the end you'll have run all five on the same product — a repeatable loop you can point at <i>any</i> product afterwards.</p>
  <div class="note">This is the same structure Wolfpack uses in discovery: <b>Objective → Initiatives → Actions</b>. Moves 1–3 find the Objective; moves 4–5 build and sell the Initiatives.</div>
</div>${foot('The framework')}`,
 notes:`This slide is the map for the whole day — come back to it between exercises ("we just finished move 2"). Stress that the order matters: people love jumping to solutions (move 4) before they've found the real leak (move 3). The discipline is doing them in sequence.`},

{section:1,html:`<div class="pad">
  <div class="kicker">Before we read a single chart</div>
  <h2>Six habits for reading product data honestly</h2>
  <div class="two habits">
   <ul>
    <li><b>Step vs overall conversion.</b> A step can look fine against the top but be terrible vs its neighbours.
      <span class="eg"><b>Bloom:</b> checkout holds 30% of the people who reach it. Against the top of the funnel that reads "6.6% of visitors" — scary but useless. Against its <i>neighbours</i> (40% and 90%) the 30% is the outlier. Compare sideways, not to the top.</span></li>
    <li><b>Segment before you conclude.</b> A blended average can hide two completely different products.
      <span class="eg"><b>Bloom:</b> checkout completion reads 30%. Split by device it is 41% in the app and 22% on mobile web — one number was hiding two products. <b>Nimbus has a blended number too. You will split it this afternoon; do not guess it now.</b></span></li>
    <li><b>Volume ≠ value.</b> The biggest source of users is often the worst source of customers.
      <span class="eg"><b>Bloom:</b> the cheapest traffic source fills the top of the funnel and empties at checkout; referral sends a fraction of the volume and buys. Optimise the funnel you <i>keep</i>, not the one you fill — and note the shape to look for: a source that leads at one step and trails at the next.</span></li>
   </ul>
   <ul>
    <li><b>Quant finds where, qual explains why.</b> Never ship a fix off a number alone.
      <span class="eg"><b>Bloom:</b> Flows says the checkout leak happens at one specific screen. That's the <i>where</i>. The reviews — "I just wanted to buy a candle, not make an account" — are the <i>why</i>. Ship off the number alone and you redesign the wrong screen.</span></li>
    <li><b>Correlation isn't cause.</b> Two things moving together is a hypothesis, not a finding.
      <span class="eg"><b>Bloom:</b> customers who use the wishlist spend 3× more. Tempting: "push everyone to the wishlist." More likely: people who already intend to buy use the wishlist. The wishlist is a symptom of intent, not a cause of spend.</span></li>
    <li><b>Trust the source.</b> Know which product and which date range a number came from.
      <span class="eg"><b>Here:</b> every figure in Nimbus and Bloom is synthetic, built for this workshop. In the wild, ask three questions before you quote a chart: whose definition of the event, which date range, and does the tracking actually fire on Android?</span></li>
   </ul>
  </div>
</div>${foot('Reading data honestly')}`,
 notes:`Six traps that produce bad roadmaps — walk the examples, they land far better than the rules. The two that bite hardest: <b>blended averages</b> (always segment) and <b>solving off a number with no qual</b>. <b>Every example on this slide is Bloom, deliberately.</b> The equivalent Nimbus numbers are what Exercises 2 and 3 are graded on, so do not supply them here, and if someone in the room offers one, write it on the flip chart as a <i>hypothesis to test</i> rather than confirming it. The wishlist example is the one people argue with — let them, that argument <i>is</i> the lesson.`},

{section:1,html:`<div class="pad">
  <div class="kicker">Two products · learn, then apply</div>
  <h2>Watch the method on one product. Run it yourself on another.</h2>
  <div class="two">
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Learn on · Bloom</div>
      <h3 style="margin-top:12px">A home-plants shopping app</h3>
      <p>Every concept in the day is worked through on <b>Bloom</b>, a D2C commerce app whose funnel leaks at <b>checkout</b>. You watch the move; the answer is given.</p>
    </div>
    <div class="card">
      <div class="tag">📘 Apply to · Nimbus</div>
      <h3 style="margin-top:12px">A fintech money app</h3>
      <p>Then you run the exact same move on <b>Nimbus</b> — with the real app, the live analytics and your workbook. Its bottleneck is yours to find.</p>
    </div>
  </div>
  <table class="paral">
    <tr><th>Move</th><th>📗 Shown on Bloom</th><th>📘 You do on Nimbus</th></tr>
    <tr><td>1 · Journey</td><td>Install → browse → cart → checkout → delivered</td><td>Map sign-up → ID check → first transfer</td></tr>
    <tr><td>2 · Funnel</td><td>Add-to-cart → checkout converts at 30% — the cliff</td><td>Build the funnel from the live dashboard</td></tr>
    <tr><td>3 · Bottleneck</td><td>Forced signup + card-only — the cause, not "confusing checkout"</td><td>Back your cause with behaviour <i>and</i> user voice</td></tr>
    <tr><td>4 · Plan</td><td>Guest checkout, scored and funded against the gap</td><td>Score and sequence your own initiatives</td></tr>
    <tr><td>5 · Story</td><td>The whole diagnosis in one breath, one ask</td><td>Outline the deck you'd actually present</td></tr>
  </table>
  <div class="note">Different domains, one method. If it works on a plant shop <i>and</i> a money app, it'll work on your product too. Bloom's numbers are illustrative; Nimbus has a full analytics tool behind it.</div>
</div>${foot('Learn on Bloom · apply to Nimbus')}`,
 notes:`This is the pedagogical spine of the redesign: <b>I do / you do</b>. On each concept slide you'll show Bloom (commerce, checkout leak) fully worked; the matching exercise has them do it on Nimbus (fintech, KYC leak). Reassure them the contrast is deliberate — seeing the method transfer across two very different products is the whole point.`},

/* ===================== SECTION 2 · PRODUCT ===================== */
{cls:'dark',section:2,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Part 2</div>
  <h1>Meet the product you'll practise on</h1>
  <p class="big" style="max-width:760px">Before the data, feel the product. Go hands-on with Nimbus and notice where <i>you</i> nearly gave up — that hunch becomes your first hypothesis.</p>
</div>${foot('Part 2 · The product')}`,
 notes:`Short breath. The point of going hands-on first: they will <b>feel</b> the bottleneck before they see it in the data, which makes the funnel reveal land much harder. Get everyone to actually reach a first transaction.`},

{section:2,mins:9,html:`<div class="pad">
  <div class="kicker">Meet the product</div>
  <h2>“Nimbus” — a money app</h2>
  <div class="two">
    <div>
      <p><b>What it does:</b> instant advances on money you're owed, plus low-fee transfers. "Money that moves at your speed."</p>
      <p><b>North Star = the first transaction</b> — the moment a user actually moves money (sign up → verify identity (KYC) → link a bank → transact).</p>
      <div class="card" style="padding:16px 18px">
        <h3 style="font-size:16px">Do this now (10 min) · 👥 sit with your partner</h3>
        <ul style="margin-top:2px">
          <li>Both of you on your own phone → go all the way to a first transaction</li>
          <li>Notice where <b>you</b> felt friction or nearly gave up</li>
          <li>Write it down, then <b>compare with your partner</b> — did you stumble in the same place?</li>
        </ul>
        <p style="margin:6px 0 0;color:var(--indigo);font-weight:700">Hypothesis first, data second.</p>
      </div>
    </div>
    ${qrCard('app')}
  </div>
</div>${foot('The product · Nimbus')}`,
 notes:`Get everyone into the app. This is the pairs' warm-up — low stakes, no wrong answers, and it gets them talking to each other before the first real exercise, which is exactly why we paired them up ten minutes ago. Insist they each use their own phone rather than watching over a shoulder; comparing two independent experiences is the whole point. Insist they actually finish a transaction — the ID capture step is deliberately fiddly (glare → retake). <b>Expect the room to split, and use the split.</b> About four in ten will sail through the photo first time; the rest retake, and a few will be there four, five, six goes. Those are the dashboard's own retry odds wired into the app, not a bug — so ask for a <b>show of hands: "who got the photo first time?"</b> and you have drawn the retry distribution on the room before anyone has opened a chart. It is also the day's first lesson in miniature: the average experience does not exist, and the person it happened to is not in the room until you count. The learning: <b>they will feel the bottleneck before they see it in the data.</b> Collect a couple of out-loud reactions ("the ID photo kept failing") — and deliberately one from a hand that stayed up, because <i>"it was fine for me"</i> is precisely the objection their client will raise on Exercise 5. Don't reveal the funnel yet — let their felt experience become a hypothesis. (The app is fullscreen on phones; the facilitator panel is off unless you add ?facilitator=1.)`},

/* ===================== SECTION 3 · ANALYTICS TOUR ===================== */
{cls:'dark',section:3,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Part 3</div>
  <h1>Tour the analytics</h1>
  <p class="big" style="max-width:820px">A product-analytics tool has one report per question. Learn what each answers — then reading any dashboard (Mixpanel, Amplitude, GA) becomes the same handful of moves.</p>
  <div style="display:flex;gap:18px;align-items:center;margin-top:18px">
    <div class="note" style="margin:0;flex:1;align-self:center">Golden rule for every chart: read it, then ask <b>"so what would I do differently?"</b> No answer → it's a vanity metric.<br><br><b>Ten reports; we walk seven.</b> <b>Acquisition</b> (where users come from) and <b>Monetization</b> (what they turn into) you open yourselves — Exercise 3 needs the first, Exercise 5 is scored on the second.</div>
    <div style="flex:0 0 200px">${qrCard('an')}</div>
  </div>
</div>${foot('Part 3 · Tour the analytics')}`,
 notes:`Open nimbus-analytics.html on the projector and keep it open for this whole section — one slide per report, walked live. Scan the QR to get it on their phones. Tell them: every serious analytics tool is the same reports under different names; learn the questions, not the buttons.<br><br><b>Walk the mechanics, not the findings.</b> The slides illustrate each report on Bloom; the tool on the projector holds Nimbus. Show them where the controls are — the breakdown selector, the date range, the cohort list — and resist reading out what Nimbus's numbers say. Everything the tour reveals is something a pair is graded on discovering in the next two hours, and a room that has been told the answer cannot un-hear it.<br><br><b>Say the ten-versus-seven line out loud.</b> Acquisition and Monetization get thirty seconds each at the end of this section — click into them, name what lives there, move on. Exercise 5 asks for impact in money and the only place revenue per activated user exists is Monetization; a pair that has never seen the board will size it with the wrong denominator, which is the single most common Exercise 5 miss.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Overview</div>
  <h2>Overview — the headline &amp; the whole funnel</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "How healthy are we, and where's the biggest problem?"</li>
      <li><b>KPI tiles</b> — active users, sign-ups, KYC completion, revenue — the pulse in one row.</li>
      <li>The <b>mini-funnel</b> shows every stage at a glance; scan for the step where the bar collapses.</li>
      <li>The <b>live event stream</b> is the raw material: every tap emits an event with properties.</li>
    </ul>
    <div class="card">
      ${vzTourOverview()}<h3>How to read it</h3>
      <p>Always start here. A dashboard's job is to point you at the <b>one number worth chasing</b> today — then you leave Overview and dig into the report that explains it.</p>
      <div class="note" style="margin-top:10px">Watch a rate tile, not just counts: a falling <b>KYC completion %</b> caps everything downstream.</div>
    </div>
  </div>
</div>${foot('Analytics · Overview')}`,
 notes:`Live: show the KPI row and the mini-funnel with the red KYC bar. Teach the reflex — start broad, spot the biggest drop, then leave for a detailed report. Point out the event stream so they understand everything else is aggregated from those raw events.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Insights</div>
  <h2>Insights — count anything, split it any way</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "How many of X — and how does that differ by group?"</li>
      <li>Pick an <b>event</b> (e.g. "KYC Approved"), measure it as <b>unique users</b> or <b>total events</b>.</li>
      <li><b>Break down</b> by any property — platform, channel, app version — to turn one blended number into a comparison.</li>
      <li>This is where a <b>blended average</b> splits into iOS 52% vs Android 30%.</li>
      <li><b>+ Add comparison</b> (top bar) is the bigger hammer: define a group once — <i>Android <b>AND</b> Moldova</i> — and <i>every</i> report splits by it until you clear it.</li>
    </ul>
    <div class="card">
      ${vzTourInsights()}<h3>Why it matters</h3>
      <p>Segmentation is the single highest-value habit in analytics. Insights is the general-purpose tool for it — every "wait, for <i>whom</i>?" question lives here.</p>
      <div class="note" style="margin-top:10px"><b>Breakdown ≠ comparison.</b> A breakdown splits <i>one</i> chart by <i>one</i> property. A comparison is a group you defined — one or more properties, ANDed — that travels with you across every report. You need the second to hold something constant.</div>
    </div>
  </div>
</div>${foot('Analytics · Insights')}`,
 notes:`Live: choose "KYC Approved", break down by platform — the Android gap jumps out. Then break the same event by channel. Hammer the lesson: a single number is a starting point, a broken-down number is an insight.<br><br><b>Now teach the comparison bar, because Exercise 3 is built on it.</b> Click <b>+ Add comparison</b> at the top, pick Platform → Android, save. Every report on the left now draws two columns, and the grey "All users" column is still the published dashboard — that is the point, you are adding a lens, not filtering the truth away. Then click <b>＋ and…</b> inside the same comparison and add Country → Moldova: one chip, two conditions, ANDed. Say the sentence out loud — <i>"a breakdown asks how the number differs; a comparison lets you hold one thing still while you look at another"</i> — because that is the whole of confounding in one line, and they will need it in forty minutes.<br><br>Three mechanics to show and then leave alone: the chip prints <b>n</b> (they need it to judge whether a gap is noise), the bar <b>persists as you navigate</b>, and a report that cannot honestly split by a comparison <b>says so on the card</b> rather than drawing something plausible. Point at one of those refusals — Cohorts is the easiest — and say why it matters: a saved cohort is a stored list, not a live query, so splitting it would be a lie with a chart on top. Do not build the Moldova comparison's <i>finding</i> here; building the mechanism is the tour's job, and the finding is what Exercise 3 is graded on.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Funnels</div>
  <h2>Funnels — where a multi-step journey leaks</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "Of everyone who starts, how many finish — and where do they fall out?"</li>
      <li><b>Step conversion</b> vs <b>overall</b>; the <b>conversion window</b> (how long they have to finish).</li>
      <li><b>Time-to-convert</b> — a short median with a long tail means most succeed fast and the rest are fighting friction.</li>
      <li><b>Break the whole funnel down</b> by platform or channel at once — the tool prints every step's spread, a 95% interval and a significance test, so you can see whether a gap sits at one step or at all of them.</li>
    </ul>
    <div class="card">
      ${vzTourFunnels()}<h3>The core diagnostic</h3>
      <p>Shown on <b>Bloom</b>; the tool in front of you holds <b>Nimbus</b>. This is the report you'll live in for Exercises 2–3. Find the <b>cliff</b> — the step far below its neighbours — then break it down until the blended average becomes a specific, fixable problem.</p>
      <div class="note" style="margin-top:10px">Biggest % drop and biggest <i>absolute</i> loss aren't always the same step. Check both.</div>
    </div>
  </div>
</div>${foot('Analytics · Funnels')}`,
 notes:`The slide shows <b>Bloom</b> so the tour does not answer Exercise 2 for them. Drive the live tool anyway — show the chrome, not the conclusions: the step-conversion column, the conversion window, the time-to-convert distribution, and above all the <b>Breakdown</b> control, which splits <i>every</i> step by platform or channel at once. Point at three columns and move on: <b>Spread</b> (how far apart the best and worst segment are, in percentage points), the <b>±95%</b> interval in each tooltip, and the <b>z</b> beside each spread — above about 2 the gap is unlikely to be noise. Say the sentence that unlocks Exercise 3: "a gap at <i>one</i> step is a broken step; the same gap at <i>every</i> step is just a worse audience." Do not read the Nimbus rows out. This report earns the most airtime — it's the spine of the diagnosis exercises.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Retention</div>
  <h2>Retention — do the users you win stick?</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "After they activate, do they come back — and for how long?"</li>
      <li>Read the <b>cohort grid</b>: each row is users who activated in a week; columns are weeks after. Colour = % still active.</li>
      <li><b>N-day</b> (came back on exactly day N) vs <b>rolling</b> (day N or later).</li>
      <li>Break down by segment to check whether a group churns faster.</li>
    </ul>
    <div class="card">
      ${vzTourRetention()}<h3>What it rules in or out</h3>
      <p>Retention decides <i>which</i> problem you have. If activated users stick (Nimbus does), the leak is <b>getting them activated</b>, not keeping them — so fix the funnel, not retention.</p>
      <div class="note" style="margin-top:10px">A flat, high curve is healthy. A steep early drop means a leaky product.</div>
    </div>
  </div>
</div>${foot('Analytics · Retention')}`,
 notes:`Live: the cohort heatmap and the iOS-vs-Android curves that sit almost on top of each other. The teaching point is subtle but important — good retention <b>redirects</b> you upstream to activation. Many teams waste quarters on retention when their real leak is the funnel.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Flows</div>
  <h2>Flows — the real paths users take</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "Between two events, what actually happens — and where do people peel off?"</li>
      <li>A <b>Sankey</b>: bar height = users reaching a screen; the red wedge = who leaks out before the next.</li>
      <li>Set an <b>anchor</b> event and look at steps before/after; segment to compare (e.g. Android only).</li>
      <li>Find the <b>fattest red wedge</b> — the single screen losing the most people.</li>
    </ul>
    <div class="card">
      ${vzTourFlows()}<h3>From "which step" to "which screen"</h3>
      <p>Funnels tell you the weak <i>step</i>; Flows tells you the exact <i>screen</i> inside it. Shown on <b>Bloom</b>, where the wedge falls at the account gate. Careful, though: a screen that people <i>reach</i> and then fail on is a different problem from one they never reach — check which you have before you promise a redesign.</p>
      <div class="note" style="margin-top:10px">Great for confirming a diagnosis: watch the leak happen step by step.</div>
    </div>
  </div>
</div>${foot('Analytics · Flows')}`,
 notes:`Live: drive the Sankey and the anchor-event control, and show that it segments — but do not narrate the Nimbus finding, that is Exercise 3. The teaching point is the one on the slide: Flows makes a leak <b>visceral</b>, one screen and this many people gone, and it also lets you separate <i>never got there</i> from <i>got there and failed</i>. Those two have completely different fixes and completely different owners, and pairs who miss the distinction will propose a redesign for a problem that is not on the screen at all.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Cohorts &amp; Users</div>
  <h2>Cohorts &amp; Users — from a number to a person</h2>
  <div class="two">
    <ul>
      <li><b>Cohorts:</b> saved groups defined by <i>behaviour</i> — "KYC abandoners", "Android sign-ups", "activated". The building block for every breakdown and campaign.</li>
      <li><b>Users:</b> an individual's full property set and <b>event timeline</b> — where an aggregate becomes a story.</li>
      <li>Drill from a metric → the users behind it → one profile → the exact failure.</li>
    </ul>
    <div class="card">
      ${vzTourCohorts()}<h3>Why both matter</h3>
      <p>Cohorts size the prize — Bloom's <b>15,400 cart abandoners</b> is a number you can put in a business case. One profile proves the cause: added to cart at 19:41, started checkout at 19:42, hit <i>"account required"</i> at 19:42, gone at 19:43. <b>The aggregate is the pattern; the profile is the proof.</b> You need both — a cohort with no profile is a number nobody believes, a profile with no cohort is an anecdote.</p>
    </div>
  </div>
</div>${foot('Analytics · Cohorts & Users')}`,
 notes:`Live on Nimbus: open the Cohorts list so they see saved groups are just behaviour written down, open the Users list, open any profile and scroll the timeline. <b>Do not read the cohort sizes out and do not stop on a profile to interpret it</b> — the cohort that sizes Exercise 2's prize and the profile that names Exercise 3's cause are both on that screen, and a pair that has been handed either will not go looking. Show the mechanics: how a cohort is defined, how you jump from a cohort to the people in it, how a timeline reads.<br><br>The pairing — big cohort number plus one damning profile — is how you make a data point persuasive in a client room, and it is worth saying explicitly, because most PMs bring one or the other and get pushed back on both. Point at the Bloom example on the slide for the shape of it.`},

{section:3,html:`<div class="pad">
  <div class="kicker">Report · Voice of customer</div>
  <h2>Voice of customer — the “why” behind the numbers</h2>
  <div class="two">
    <ul>
      <li><b>What it answers:</b> "We see the drop — but <i>why</i> are people leaving?"</li>
      <li><b>Reviews, ratings, NPS and support tickets</b>, grouped into themes and ranked.</li>
      <li>The power move: when the <b>funnel, the segments and the feedback all point at the same screen</b>, you have a diagnosis, not a hunch.</li>
    </ul>
    <div class="card">
      ${vzTourVoc()}<h3>Quant + qual = a diagnosis</h3>
      <p>Numbers tell you <i>where</i>; verbatims tell you <i>why</i>. On Bloom the top complaint theme and the leaking screen name the same thing — that agreement is the diagnosis. Quote the theme share and the step rate separately: they have different denominators and one never "explains" the other exactly.</p>
      <div class="note" style="margin-top:10px">Always read a few reviews word-for-word — the phrasing often names the root cause.</div>
    </div>
  </div>
</div>${foot('Analytics · Voice of customer')}`,
 notes:`Live: the complaint themes, the ticket categories, and 2–3 verbatim reviews — read them for <i>texture</i>, not for the answer. Land triangulation one more time before the exercises: it is the skill Exercise 3 is graded on. Add the caveat that separates a good pair from a great one — reviews are self-selected and skew to whoever writes them, so check <i>which</i> store or channel each one came from before you attribute it to a segment. That's the end of the tour; hand the dashboard to them and say plainly that everything from here is theirs to find.`},

/* ===================== SECTION 4 · THE FIVE MOVES ===================== */
{cls:'dark',section:4,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Part 4</div>
  <h1>The five moves — learn, then apply</h1>
  <p class="big" style="max-width:800px">For each move: a 2-minute worked example on <b>Bloom</b> (the plant shop), then you run the same move on <b>Nimbus</b> in your workbook. Scan the workbook code on each exercise.</p>
</div>${foot('Part 4 · The five moves')}`,
 notes:`This is the heart of the day and where most of the time goes. Rhythm per move: show the Bloom example (I do), set the exercise on Nimbus (you do), circulate, debrief against the answer key. Keep concept slides tight — the doing is the learning.`},

/* ---- Move 1 ---- */
{section:4,html:`<div class="pad">
  <div class="kicker">Move 1 · Concept · learn on Bloom</div>
  <h2>The user journey — the path to value</h2>
  <div class="two">
    <ul>
      <li>A journey is the <b>sequence of stages</b> a user moves through to reach value (the North Star event).</li>
      <li>For each stage capture the user's <b>goal</b>, <b>action</b>, <b>touchpoint</b>, and likely <b>emotion</b>.</li>
      <li><b>Gates</b> — mandatory steps between the user and value — are where journeys break.</li>
    </ul>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Bloom example</div>
      <h3 style="margin-top:10px">Journey of a plant shopper</h3>
      ${vzJourney()}
      <p style="margin-top:12px"><b>Checkout</b> is the gate — it forces account creation and card-only payment. Emotion dips hard right there: "I just want to buy the plant."</p>
    </div>
  </div>
</div>${foot('Move 1 · Journey')}`,
 notes:`Keep the concept to 3 minutes. Teach <b>gates</b> using Bloom: checkout forces a signup and only takes a card — a classic value-blocking gate. Then hand off: "now map Nimbus's journey — it has two gates of its own." The Bloom answer is given; Nimbus is theirs.`},

{cls:'ex',section:4,mins:15,html:`<div class="pad">
  <div class="exbadge">✍️ Exercise 1 · apply to Nimbus · 15 min</div>
