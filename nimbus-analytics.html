<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus Analytics</title>
<style>
:root{
  --page:#f4f5f7; --surface:#ffffff; --ink:#1f2430; --ink2:#5b6472; --muted:#8a93a3;
  --line:#e6e9ef; --line2:#eef1f5; --rail:#ffffff; --brand:#4F46E5;
  /* validated dataviz palette (light) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --seq100:#cde2fb; --seq250:#86b6ef; --seq400:#3987e5; --seq500:#256abf; --seq600:#184f95; --seq700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --goodink:#006300;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
html[data-theme="dark"]{
  --page:#0d0f12; --surface:#16191e; --ink:#f3f5f8; --ink2:#c3c8d2; --muted:#8a93a3;
  --line:#262b33; --line2:#20242b; --rail:#131519;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --seq100:#0d366b; --seq250:#184f95; --seq400:#3987e5; --seq500:#5598e7; --seq600:#86b6ef; --seq700:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none}
/* Top bar */
.top{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:20}
.top .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.top .logo .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4F46E5,#0EA5E9);display:grid;place-items:center;color:#fff;font-size:14px}
.prop{display:flex;align-items:center;gap:7px;background:var(--page);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px;color:var(--ink2)}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:7px;background:var(--page);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.ava{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#0EA5E9);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
/* Layout */
.wrap{display:flex;min-height:calc(100vh - 56px)}
.rail{width:230px;background:var(--rail);border-right:1px solid var(--line);padding:12px 10px;flex:0 0 auto;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.rail .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 8px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--ink2);font-weight:600;cursor:pointer;font-size:13.5px}
.nav .ic{width:18px;text-align:center;font-size:15px}
.nav:hover{background:var(--page)}
.nav.on{background:#eef2ff;color:var(--brand)}
html[data-theme="dark"] .nav.on{background:#20233a;color:#a5b4fc}
.main{flex:1;padding:22px 26px;min-width:0}
.h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.hsub{color:var(--ink2);margin:3px 0 18px;font-size:13.5px}
/* Cards & grid */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:2fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700}
.card .csub{color:var(--muted);font-size:12px;margin:0 0 12px}
.tile .lab{color:var(--ink2);font-size:12.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.tile .val{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tile .dl{font-size:12px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--goodink)} .down{color:var(--critical)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.flag.bad{background:#fdeaea;color:var(--critical)} .flag.warn{background:#fff6e6;color:#b45309} .flag.good{background:#e8f7e8;color:var(--goodink)}
html[data-theme="dark"] .flag.bad{background:#3a1f22} html[data-theme="dark"] .flag.warn{background:#3a2f1a} html[data-theme="dark"] .flag.good{background:#14331a;color:#7fe08a}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.num{text-align:right}
.bar-cell{position:relative}
.bar-cell .bg{position:absolute;left:10px;top:50%;transform:translateY(-50%);height:7px;border-radius:4px;background:var(--s1);opacity:.9}
/* funnel */
.fnl{display:flex;flex-direction:column;gap:3px}
.fstep{display:grid;grid-template-columns:180px 1fr 120px;align-items:center;gap:14px}
.fbarwrap{background:var(--line2);border-radius:8px;height:38px;position:relative;overflow:hidden}
/* When the bar is too narrow to hold its own number, the number steps just past
   the end of the bar instead of being clipped by the track. Which bars those
   are is measured at paint time -- see fitFunnelLabels() -- not guessed. */
.fbar.tiny{font-size:0}
.fnumout{position:absolute;top:0;height:100%;display:none;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;pointer-events:none}
.fnumout.on{display:flex}
.fbar{height:100%;border-radius:8px;background:var(--seq400);display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:700;font-size:13px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.fname{font-weight:700;font-size:13.5px}
.fname .s{display:block;color:var(--muted);font-size:11px;font-weight:600}
.conv{font-weight:800;font-size:15px;text-align:right}
.drop{font-size:11px;color:var(--muted);text-align:right}
/* segmented funnel: reuses .smat, adds a scroll wrapper and sub-step rows */
.sfwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
.smat.sfun{min-width:540px}
.smat.sfun td.rl{font-size:12px;white-space:nowrap;padding-right:10px}
.smat.sfun tr.sub td.rl{padding-left:15px;font-weight:600;color:var(--muted);font-size:11.5px}
.smat.sfun tr.sub .cell{padding:5px 4px}
.smat.sfun tr.sub .cell b{font-size:12.5px}
.smat.sfun .sp{font-variant-numeric:tabular-nums}
.smat.sfun .sp b{font-size:13px}
.cardhd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.sw{width:11px;height:11px;border-radius:3px}
/* seg toggle */
.seg{display:inline-flex;background:var(--page);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* query builder controls */
.qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.qgroup{display:flex;align-items:center;gap:7px}
.qlab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.smat{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.smat th{font-weight:700;color:var(--muted);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px 7px;text-align:center;vertical-align:bottom;line-height:1.25}
.smat th.rh{text-align:left;padding-left:0;width:74px}
.smat td.rl{font-weight:700;color:var(--ink2);font-size:12.5px;padding-right:8px;white-space:nowrap}
.smat td.c{padding:0 3px 6px}
.smat .cell{border-radius:8px;padding:7px 4px;text-align:center;line-height:1.2;cursor:default}
.smat .cell b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.smat .cell i{display:block;font-style:normal;font-size:10px;opacity:.78;font-variant-numeric:tabular-nums;margin-top:1px}
.smat .cell.worst{outline:2px solid var(--critical);outline-offset:-2px}
.segbase{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
/* The column widths arrive in a custom property rather than an inline style,
   because an inline grid-template-columns cannot be overridden by a media
   query -- and 150+96+66 plus three 12px gaps is 348px, which is 24px more than
   a 390px phone has to give. */
.hbrow{display:grid;grid-template-columns:var(--hbcols);align-items:center;gap:12px}
.qsel.fixed{cursor:default;color:var(--muted);border-style:dashed;background:transparent}
.qsel.fixed:hover{border-color:var(--line)}
.qsel{display:inline-flex;align-items:center;gap:6px;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer}
.qsel:hover{border-color:var(--brand)}
.qsel.ev{color:var(--brand);border-color:#c7cbf6;background:#eef2ff}
html[data-theme="dark"] .qsel.ev{background:#20233a;border-color:#3a3f66}
.qpill{font-size:10.5px;font-weight:700;color:var(--muted)}
/* review */
.rev{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:10px;background:var(--surface)}
.rev .rh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.stars{color:var(--warning);font-size:13px;letter-spacing:1px}
.rev .plat{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.rev p{margin:2px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fdeaea;color:var(--critical);margin-top:7px}
html[data-theme="dark"] .tag{background:#3a1f22}
/* cohort grid */
.coh{border-collapse:separate;border-spacing:3px}
.coh td.c{width:44px;height:30px;text-align:center;border-radius:5px;color:#0b2b53;font-weight:700;font-size:11px;border:0}
/* sankey / flows */
.flowwrap{overflow-x:auto}
/* Under a comparison the flow is drawn as one card per series inside the same
   scroller. The diagram has a 680px floor, so on a phone the card must be
   allowed to grow to it — otherwise the card's border sits at the viewport
   width and the diagram draws straight through it and off the screen. Sizing
   the card to its content instead keeps one shared scroller, which is what you
   want here: all three diagrams pan together and stay aligned. */
#sankey .smcard{width:max-content;min-width:100%}
.fnode rect{rx:4}
.flab{font-size:11.5px;font-weight:700;fill:var(--ink)}
.fsub{font-size:10.5px;font-weight:600;fill:var(--muted)}
.fdrop{font-size:10.5px;font-weight:700;fill:var(--critical)}
/* cohort cards */
.cohcard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cohcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.cohcard.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(79,70,229,.18)}
.cohcard .cn{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.cohcard .cz{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.cohcard .cd{font-size:12px;color:var(--ink2);line-height:1.4}
/* users */
.urow{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 90px;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.urow:hover{background:var(--page)}
.urow .uav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:0 0 auto}
.uname{display:flex;align-items:center;gap:10px;font-weight:600}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.badge.crit{background:#fdeaea;color:var(--critical)} .badge.ok{background:#e8f7e8;color:var(--goodink)} .badge.warn{background:#fff6e6;color:#b45309} .badge.neu{background:var(--line2);color:var(--ink2)}
html[data-theme="dark"] .badge.crit{background:#3a1f22} html[data-theme="dark"] .badge.ok{background:#14331a;color:#7fe08a} html[data-theme="dark"] .badge.warn{background:#3a2f1a}
/* activity timeline */
.tl{position:relative;margin:0;padding:0 0 0 20px;list-style:none}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 15px}
.tli .dot{position:absolute;left:-19px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--s1);border:2px solid var(--surface)}
.tli.bad .dot{background:var(--critical)} .tli.good .dot{background:var(--good)}
.tli .ev{font-weight:700;font-size:13px}
.tli .mt{font-size:11.5px;color:var(--muted)}
.tli .dt{font-size:12px;color:var(--ink2);margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:600;text-align:right}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand);cursor:pointer;margin-bottom:12px}
/* distribution */
.dist{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.dist .db{flex:1;background:var(--seq400);border-radius:4px 4px 0 0;min-height:3px}
.dist .dbx{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:600;margin-top:4px}
/* tooltip */
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;transition:opacity .12s;z-index:60;max-width:230px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#tip .tk{color:#cbd5e1;font-weight:600}
#tip.edu{max-width:320px;padding:11px 13px;border-top:3px solid var(--brand);font-weight:500}
#tip.edu .eh{color:#a5b4fc;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.edu-i{display:inline-block;margin-left:6px;color:var(--brand);font-size:12px;font-weight:700;cursor:help;opacity:.75;vertical-align:middle}
[data-edu]:hover{cursor:help}
.tile[data-edu]:hover,.card[data-edu]:hover{box-shadow:0 0 0 2px rgba(79,70,229,.25),var(--shadow)}
.slc:hover .cross,.slc:hover .hd{opacity:1}
.cross{opacity:0} .hd{opacity:0}
.note{background:#eff3ff;border:1px solid #dbe4ff;border-radius:11px;padding:12px 14px;font-size:13px;color:#39415a;line-height:1.5;margin-top:14px}
html[data-theme="dark"] .note{background:#1a1f33;border-color:#2a3350;color:#c3c8d2}
.banner{display:flex;gap:10px;align-items:flex-start;background:#fdeef0;border:1px solid #f6cfd4;border-radius:11px;padding:12px 14px;font-size:13px;color:#7a1f28;line-height:1.5}
html[data-theme="dark"] .banner{background:#2a1518;border-color:#4a2228;color:#f0b8bf}
.ins{display:flex;gap:10px;align-items:flex-start;background:#eef7f0;border:1px solid #cfe9d6;border-radius:11px;padding:12px 14px;font-size:13px;color:#1f5130;line-height:1.5}
html[data-theme="dark"] .ins{background:#12271a;border-color:#224a2f;color:#a7e0b8}
.smallcap{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:0 0 8px}
/* ---------- comparison bar -------------------------------------------------
   Sticky under the header and present on every report, because a comparison
   that only exists on the page you built it on teaches the opposite of what a
   segment is for. */
.cmpbar{position:sticky;top:56px;z-index:19;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cmpbar .cl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-right:2px}
.cchip{display:inline-flex;align-items:center;gap:7px;background:var(--page);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px;font-weight:600;font-size:12.5px;color:var(--ink2);max-width:340px}
.cchip .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.cchip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip .cn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cchip .x{cursor:pointer;color:var(--muted);font-weight:800;padding:0 1px;flex:0 0 auto}
.cchip .x:hover{color:var(--critical)}
.cadd{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px dashed var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;color:var(--brand);cursor:pointer;font-family:inherit}
.cadd:hover{border-color:var(--brand);background:var(--page)}
.cadd[disabled]{opacity:.45;cursor:not-allowed;color:var(--muted)}
.clink{background:transparent;border:0;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline;padding:4px 2px}
.clink:hover{color:var(--ink)}
.cbuild{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin:0 18px 0;position:sticky;top:104px;z-index:18}
.cbrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.cbrow:first-of-type{border-top:0}
.cbsel{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
.cvals{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:220px}
.cval{display:inline-flex;align-items:center;gap:5px;background:var(--page);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.cval.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cvhint{font-size:11.5px;color:var(--muted);font-weight:600;align-self:center}
.cbfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.cbtn{font-family:inherit;font-weight:700;font-size:13px;border-radius:9px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);background:var(--page);color:var(--ink2)}
.cbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.cbtn[disabled]{opacity:.45;cursor:not-allowed}
.cwarn{background:#fff8e6;border:1px solid #f4dfae;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#6b4a05;line-height:1.45;width:100%}
html[data-theme="dark"] .cwarn{background:#2a2413;border-color:#4d431f;color:#e8d49a}
/* "this report cannot be split" — the honest em-dash, never a silent number */
.cno{background:var(--page);border:1px dashed var(--line);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:12px}
.cno b{color:var(--ink)}
.smcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:12px}
.smhd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:9px}
.smhd .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.smhd .cn{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ctab{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
/* No uppercase on the series columns: a name the group built themselves reads
   "Android + Country: Moldova", and shouting it back at them in caps makes a
   long header unreadable. The metric column keeps the table-header look. */
.ctab th{font-weight:700;color:var(--ink2);font-size:11.5px;padding:0 6px 7px;text-align:right;vertical-align:bottom;line-height:1.3;max-width:190px}
.ctab th:first-child{text-align:left;padding-left:0;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;color:var(--muted)}
.ctab th .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:baseline}
.ctab th .sn{font-size:10.5px;color:var(--muted);display:block;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.ctab td{padding:6px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--line2)}
.ctab td:first-child{text-align:left;padding-left:0;font-weight:600;color:var(--ink2)}
.ctab td.big{font-weight:800;font-size:13.5px}
.ctab .dd{font-size:10.5px;font-weight:700;display:block;margin-top:1px}
.ctab tr.tot td{border-top:2px solid var(--line2);font-weight:800}
.ctab td.em{color:var(--muted);font-weight:700}
.ctab td.sub{font-weight:500;color:var(--muted);padding-left:14px}
/* Grouped bars. Each series is scaled to its OWN largest bar: a segment a
   twentieth the size of the whole would otherwise render as five hairlines
   and its shape -- the only thing a mix chart is for -- would be invisible.
   The printed number stays absolute, and the caption says so. */
.gbgrp{margin-bottom:14px}
.gbk{font-weight:700;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
/* The value column is 96px rather than 74px because a rate bar can now print
   its 95% interval underneath the number. Count bars carry no interval and
   simply sit in a slightly wider column. */
.gbr{display:grid;grid-template-columns:minmax(90px,140px) 1fr 96px;gap:9px;align-items:center;margin-bottom:4px}
.gnm{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtr{background:var(--line2);border-radius:5px;height:13px;overflow:hidden}
.gfl{display:block;height:100%;border-radius:5px}
.gvl{font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.gvl .gd{display:block;font-size:9.5px;font-weight:700;letter-spacing:.005em;white-space:nowrap}
.gem{font-size:12px;font-weight:700;color:var(--muted)}
@media(max-width:780px){
  .gbr{grid-template-columns:minmax(72px,110px) 1fr 80px;gap:6px}
  .ctab th{max-width:120px}
}
@media(max-width:780px){
  .cmpbar{padding:8px 12px;top:56px}
  .cbuild{margin:0 12px;top:auto;position:static}
  .cchip{max-width:100%}
}
/* phone: the rail becomes a horizontal scroller so reports fit a small screen */
@media(max-width:780px){
  .wrap{flex-direction:column}
  .rail{position:static;width:100%;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .rail .grp{display:none}
  .nav{flex:0 0 auto;padding:8px 12px;white-space:nowrap}
  .main{padding:16px 14px}
  .top{gap:8px;padding:0 12px;overflow-x:auto}
  .prop{display:none}
  .qgroup{flex-wrap:wrap}
  .fstep{grid-template-columns:92px minmax(56px,1fr) 62px;gap:7px}
  .fstep>*{min-width:0}
  .fname{font-size:12px} .fname .s{display:none}
  .fbar{font-size:11px;padding-left:6px}
  .fnumout{font-size:11px;padding-left:6px}
  .conv{font-size:13px}
  .smat.sfun{min-width:480px;font-size:11px}
  .smat.sfun td.rl{font-size:11px;padding-right:6px}
  .cardhd{gap:8px}
  .urow{grid-template-columns:1.4fr 1fr 90px;gap:8px}
  .urow > div:nth-child(3),.urow > div:nth-child(5){display:none}
  /* The four-column breakdown row folds instead of overflowing: name and value
     on the top line, the bar full width beneath it, the denominator under that.
     The denominator stays because it is what makes a breakdown reconcile to the
     blended rate, and on a phone there is no hover to recover it from. */
  .hbrow{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}
  .hbrow>*{min-width:0}
  .hbrow>:nth-child(1){grid-area:1/1}
  .hbrow>:nth-child(2){grid-area:2/1/auto/-1}
  .hbrow.hbrow4>:nth-child(3){grid-area:3/1/auto/-1}
  .hbrow>:last-child{grid-area:1/2;text-align:right}
}

// fit.js — the only maths that matters here.
//
// Every new dimension in the analytics tool has to reconcile to numbers that
// are already published in the deck, the workbook and the rubric. So nothing is
// "simulated" in the usual sense: the funnel outcome of every synthetic user is
// ALLOCATED against the published margins, never drawn from a distribution and
// hoped over. These two helpers do that allocation.
//
//   ipf(seed, rows, cols)          – iterative proportional fitting: nudge a
//                                    seed matrix until it matches both margins.
//   fitInt(seed, rows, cols, cap)  – same, then round to integers WITHOUT
//                                    breaking either margin, honouring an
//                                    optional per-cell ceiling.
//
// Plain ES5-ish JS on purpose: this file gets inlined into a single-file HTML
// app later, so it may not depend on anything Node-only.
// ---------------------------------------------------------------------------

  for (i = 0; i < (iters || 400); i++) {
    for (r = 0; r < R; r++) {
      var s = 0; for (c = 0; c < C; c++) s += X[r][c];
      var f = s > 0 ? rows[r] / s : 0;
      for (c = 0; c < C; c++) X[r][c] *= f;
    }
    for (c = 0; c < C; c++) {
      var s2 = 0; for (r = 0; r < R; r++) s2 += X[r][c];
      var f2 = s2 > 0 ? cols[c] / s2 : 0;
      for (r = 0; r < R; r++) X[r][c] *= f2;

// Floor everything, then hand out the leftover units one at a time to whichever
// still-eligible cell has the largest fractional part. That works because the
// matrix of fractional parts is itself a feasible point of the transportation
// polytope, so an integral solution is guaranteed to exist; the greedy pass can
// still paint itself into a corner when caps bite, hence the repair loop.

      } else {
        for (c = 0; c < C && !moved; c++) {
          if (c === needC || I[needR][c] >= (cap ? cap[needR][c] : Infinity)) continue;
          for (r = 0; r < R && !moved; r++) {
            if (r === needR || I[r][c] <= 0) continue;
            if (cap && I[r][needC] >= cap[r][needC]) continue;
            I[needR][c]++; I[r][c]--; I[r][needC]++;

    if (!moved) throw new Error('roundKeepingMargins: cannot repair (dr=' + dr + ' dc=' + dc + ')');

function fitInt(seed, rows, cols, cap) {
  var sr = rows.reduce(function (a, b) { return a + b; }, 0);
  var sc = cols.reduce(function (a, b) { return a + b; }, 0);

    if (s !== rows[r]) throw new Error('fitInt: row ' + r + ' = ' + s + ' want ' + rows[r]);

  for (var c2 = 0; c2 < cols.length; c2++) {
    var s2 = 0; for (var r2 = 0; r2 < rows.length; r2++) s2 += I[r2][c2];
    if (s2 !== cols[c2]) throw new Error('fitInt: col ' + c2 + ' = ' + s2 + ' want ' + cols[c2]);

  // --- 3. post-verification stages ------------------------------------------
  // Seeded on the verified table so the shape of who links a bank follows the
  // shape of who got verified, and capped by it so no cell can overshoot.
  var nz = function (m) { return m.map(function (row) { return row.map(function (v) { return v || 1e-9; }); }); };
  var bank = fitInt(nz(VER_N), BANK_PLAT, BANK_CHAN, VER_N);
  var txn = fitInt(nz(bank), TXN_PLAT, TXN_CHAN, bank);
  var rep = [];
  for (p = 0; p < 2; p++) rep.push(splitInt(REP_PLAT[p], txn[p], txn[p]));

  for (p = 0; p < 2; p++) for (c = 0; c < 5; c++) {
    var vw = [], vcap = [];
    for (d = 0; d < 3; d++) { vw.push(verD[p][c][d]); vcap.push(verD[p][c][d]); }
    var bd = splitInt(bank[p][c], vw, vcap);
    var td = splitInt(txn[p][c], bd, bd);
    var rd = splitInt(rep[p][c], td, td);
    for (d = 0; d < 3; d++) {
      stg[p][c][d][4] = verD[p][c][d] - bd[d];
      stg[p][c][d][5] = bd[d] - td[d];
      stg[p][c][d][6] = td[d] - rd[d];
      stg[p][c][d][7] = rd[d];
    }
  }

  // --- 4. installs that never signed up -------------------------------------
  var noSgn = fitInt(outer(NOSGN_PLAT, NOSGN_CHAN), NOSGN_PLAT, NOSGN_CHAN);

  // --- 5. emit rows ----------------------------------------------------------
  var N = 50000;
  var uPlat = new Uint8Array(N), uChan = new Uint8Array(N), uDoc = new Uint8Array(N),
    uStage = new Uint8Array(N), uCtry = new Uint8Array(N), uDev = new Uint8Array(N),
    uVer = new Uint8Array(N), uWeek = new Uint8Array(N), uRetry = new Uint8Array(N);
  var at = 0;
  for (p = 0; p < 2; p++) {
    for (c = 0; c < 5; c++) {
      for (i = 0; i < noSgn[p][c]; i++) { uPlat[at] = p; uChan[at] = c; uDoc[at] = 3; uStage[at] = 0; at++; }
      for (d = 0; d < 3; d++) for (var s = 1; s <= 7; s++) {
        for (i = 0; i < stg[p][c][d][s]; i++) { uPlat[at] = p; uChan[at] = c; uDoc[at] = d; uStage[at] = s; at++; }
      }
    }
  }
  if (at !== N) throw new Error('emitted ' + at + ' rows, expected ' + N);

  // --- 6. paint the unconstrained dimensions --------------------------------
  // Outcome class: 0 install-only, 1 left at details, 2 left at photo,
  // 3 left at liveness, 4 verified (everything downstream behaves the same).
  var cls = new Uint8Array(N);
  for (i = 0; i < N; i++) cls[i] = uStage[i] >= 4 ? 4 : uStage[i];

  var rowsByPC = [[], []];                      // row indices per platform, by class
  for (p = 0; p < 2; p++) { rowsByPC[p] = [[], [], [], [], []]; }
  for (i = 0; i < N; i++) rowsByPC[uPlat[i]][cls[i]].push(i);

  var rnd = mulberry32(20260723);

  for (p = 0; p < 2; p++) {
    var devs = DEV_OF[p], nd = devs.length;
    var platTotal = rowsByPC[p].reduce(function (a, g) { return a + g.length; }, 0);
    var classTotals = rowsByPC[p].map(function (g) { return g.length; });

    // profile cell = week x device x version
    var cellW = [], cellMeta = [];
    for (var wk = 0; wk < 5; wk++) for (var dv = 0; dv < nd; dv++) for (var vr = 0; vr < 3; vr++) {
      var share = WEEK_W[wk] * DEV_W[p][dv] * VER_BY_WEEK[wk][vr];
      if (share <= 0) continue;
      cellW.push(share); cellMeta.push([wk, devs[dv], vr]);
    }
    var cellSize = splitInt(platTotal, cellW);

    // Outcome propensity per profile cell. iOS is flat; on Android the 4.3.0
    // capture regression hits Samsung A-series and Xiaomi Redmi and dumps the
    // difference squarely into "left at ID photo".
    var seed = [];
    for (i = 0; i < cellMeta.length; i++) {
      var m = cellMeta[i], dvi = m[1], vri = m[2];
      var hit = (p === 1) && (dvi === 4 || dvi === 5) && (vri >= 1);
      var pr;
      if (p === 0) {
        pr = dvi === 3 ? [1, 1.05, 1.10, 1.05, 0.95] : [1, 1, 1, 1, 1];   // SE/older: marginally worse camera
      } else {
        pr = hit ? [1, 1.00, 1.62, 0.90, 0.44] : [1, 1.00, 0.93, 1.02, 1.06];
      }
      seed.push(pr.map(function (x) { return x * cellSize[i] || 1e-9; }));
    }
    var alloc = fitInt(seed, cellSize, classTotals);

    // Country: mix differs sharply by platform, propensity by outcome barely at
    // all. That is the whole trick — the aggregate country gap is platform mix.
    var ctrySize = splitInt(platTotal, CTRY_W[p]);
    var CTRY_PR = [[1, 1, 1, 1, 1.00], [1, 1.01, 1.03, 1.00, 0.97],
    [1, 0.99, 0.98, 1.00, 1.02], [1, 1, 1.01, 1.00, 0.99]];
    var cseed = ctrySize.map(function (sz, ci) { return CTRY_PR[ci].map(function (x) { return x * sz || 1e-9; }); });
    var calloc = fitInt(cseed, ctrySize, classTotals);

    for (k = 0; k < 5; k++) {
      var group = rowsByPC[p][k];
      var bag = [], cbag = [];
      for (i = 0; i < cellMeta.length; i++) for (var q = 0; q < alloc[i][k]; q++) bag.push(i);
      for (i = 0; i < ctrySize.length; i++) for (var q2 = 0; q2 < calloc[i][k]; q2++) cbag.push(i);
      if (bag.length !== group.length || cbag.length !== group.length) {
        throw new Error('profile bag mismatch p' + p + ' class' + k + ': ' + bag.length + '/' + cbag.length + ' vs ' + group.length);
      }
      shuffle(bag, rnd); shuffle(cbag, rnd);
      for (i = 0; i < group.length; i++) {
        var row = group[i], mm = cellMeta[bag[i]];
        uWeek[row] = mm[0]; uDev[row] = mm[1]; uVer[row] = mm[2]; uCtry[row] = cbag[i];
      }
    }
  }

  // Retries: only defined once someone actually reached the photo step.
  for (i = 0; i < N; i++) {
    if (uStage[i] < 2) { uRetry[i] = 4; continue; }
    var affected = (uPlat[i] === 1) && (uDev[i] === 4 || uDev[i] === 5) && (uVer[i] >= 1);
    var r = rnd();
    if (uStage[i] === 2) {                                  // never got a passing photo
      uRetry[i] = affected ? (r < 0.72 ? 3 : r < 0.92 ? 2 : 1)
        : (r < 0.34 ? 3 : r < 0.68 ? 2 : 1);
    } else {                                                 // photo eventually accepted
      uRetry[i] = affected ? (r < 0.30 ? 0 : r < 0.72 ? 1 : r < 0.94 ? 2 : 3)
        : (r < 0.71 ? 0 : r < 0.93 ? 1 : r < 0.99 ? 2 : 3);
    }
  }

  // --- 7. retention depth, activated users only -----------------------------
  // retRoll = index of the last milestone the user was still active at, so
  // rolling retention at k is simply "how many have retRoll >= k". retMask
  // carries one bit per milestone for the N-day curve; bit k can only be set
  // if retRoll >= k, and within that survivor pool it is handed out at the
  // rate the published N-day curve requires. 255 / 0 mean "not activated".
  var uRetRoll = new Uint8Array(N).fill(255), uRetMask = new Uint8Array(N);
  for (p = 0; p < 2; p++) {
    var act = [];
    for (i = 0; i < N; i++) if (uPlat[i] === p && uStage[i] >= 6) act.push(i);
    var np = act.length;
    if (np !== TXN_PLAT[p]) throw new Error('activated ' + np + ' != ' + TXN_PLAT[p]);
    shuffle(act, rnd);

    var rollCnt = RET_ROLL[p].map(function (v) { return Math.round(v * np); });
    rollCnt[0] = np;
    for (k = 1; k < 6; k++) if (rollCnt[k] > rollCnt[k - 1]) throw new Error('retention not monotone at ' + k);
    var at2 = 0;
    for (k = 0; k < 6; k++) {
      var lastDist = rollCnt[k] - (k === 5 ? 0 : rollCnt[k + 1]);
      for (i = 0; i < lastDist; i++) uRetRoll[act[at2++]] = k;
    }
    if (at2 !== np) throw new Error('retRoll assigned ' + at2 + ' of ' + np);

    // act was filled shallowest-first, so the users who survive to milestone k
    // are the last rollCnt[k] entries of it. Re-shuffle that suffix each time
    // so the N-day bits do not inherit the ordering of the rolling assignment.
    for (k = 0; k < 6; k++) {
      var nd = Math.round(RET_NDAY[p][k] * np);
      if (nd > rollCnt[k]) throw new Error('N-day ' + RET_DAYS[k] + ' exceeds survivors: ' + nd + ' > ' + rollCnt[k]);
      var pool = act.slice(np - rollCnt[k]);
      shuffle(pool, rnd);
      for (i = 0; i < nd; i++) uRetMask[pool[i]] |= (1 << k);
    }
  }

  return {
    n: N, plat: uPlat, chan: uChan, doc: uDoc, stage: uStage,
    country: uCtry, device: uDev, ver: uVer, week: uWeek, retry: uRetry,
    retRoll: uRetRoll, retMask: uRetMask,
    labels: { PLAT: PLAT, CHAN: CHAN, DOC: DOC, COUNTRY: COUNTRY, DEVICE: DEVICE, VER: VER, WEEK: WEEK, RETRY: RETRY, STAGE: STAGE, RET_DAYS: RET_DAYS }
  };
}

/* ---------- gen/segment-engine.js ---------- */
/* =================== comparison engine ===================================
   Everything below turns "a comparison" into a DATA-shaped object, so the
   existing view code can keep rendering the way it always has.

   Two rules govern the whole design.

   1. WITH NO COMPARISON ACTIVE, NOTHING CHANGES. Views render from the same
      hardcoded DATA literal they always did, byte for byte. The 50,000-row
      table is not even built. That is what keeps every published number in the
      deck, the workbook and the rubric exactly where it was.

   2. A COMPARISON THAT CANNOT BE HONOURED MUST SAY SO. Silently rendering the
      unsegmented number under a comparison chip is the single worst thing this
      tool could teach, because it is indistinguishable from a null result. So
      every metric declares whether it can be split, and the ones that cannot
      render an em-dash with the reason attached.
   ========================================================================= */

/* The user table is built once, lazily, on the first comparison. ~70ms. */
var UT = null;
function userTable(){ if(!UT){ UT = buildUsers(); } return UT; }

/* Dimensions offered in the builder. `after` records the point in the funnel
   at which the dimension starts to exist — a property nobody records for a
   user who never got there. Filtering on one silently drops everyone upstream,
   which is a real and very common way to read a funnel wrong, so the bar says
   it out loud instead of letting the first step quietly become 100%. */
const DIMS = [
  {k:'plat',    lab:'Platform',          arr:'plat',    labs:'PLAT'},
  {k:'chan',    lab:'Channel',           arr:'chan',    labs:'CHAN'},
  {k:'country', lab:'Country',           arr:'country', labs:'COUNTRY'},
  {k:'device',  lab:'Device model',      arr:'device',  labs:'DEVICE'},
  {k:'ver',     lab:'App version',       arr:'ver',     labs:'VER'},
  {k:'week',    lab:'Sign-up week',      arr:'week',    labs:'WEEK'},
  {k:'doc',     lab:'ID document',       arr:'doc',     labs:'DOC',   after:'signed up'},
  {k:'retry',   lab:'ID-photo retries',  arr:'retry',   labs:'RETRY', after:'reached the ID-photo step'},
];
const DIMBY = {}; DIMS.forEach(d=>DIMBY[d.k]=d);
function dimVals(k){ return userTable().labels[DIMBY[k].labs]; }

const CMP_COLORS = ['var(--s2)','var(--s4)','var(--warning)'];
const BASE_COLOR = 'var(--s1)';
const CMP_MAX = 3;
/* [{conds:[{dim,vals:[valueIndex,...]}]}] — AND across dimensions, OR within
   one. That is GA4's model and it is the one the exercise needs: "Moldova AND
   Android" is the condition that makes the country trap resolve. */
let CMP = [];

function cmpName(c){
  return c.conds.map(cd=>{
    const vals=dimVals(cd.dim);
    const picked=cd.vals.map(v=>vals[v]);
    return picked.length===1 ? picked[0]
         : picked.length===vals.length ? DIMBY[cd.dim].lab+': any'
         : picked.length<=2 ? picked.join(' or ')
         : DIMBY[cd.dim].lab+': '+picked.length+' values';
  }).join(' + ');
}
function cmpMask(c){
  const T=userTable(), m=new Uint8Array(T.n).fill(1);
  c.conds.forEach(cd=>{
    const arr=T[DIMBY[cd.dim].arr], keep=new Uint8Array(256);
    cd.vals.forEach(v=>keep[v]=1);
    for(let i=0;i<T.n;i++) if(m[i] && !keep[arr[i]]) m[i]=0;
  });
  return m;
}
/* Which dimensions in this comparison only exist further down the funnel. */
function cmpGrainWarn(c){
  const w=c.conds.map(cd=>DIMBY[cd.dim]).filter(d=>d.after);
  if(!w.length) return null;
  return w.map(d=>`<b>${d.lab}</b>`).join(' and ')+` ${w.length>1?'are':'is'} only recorded once a user has ${w[0].after} — so everyone upstream of that is excluded from this series, and its funnel starts there.`;
}
function cmpActive(){ return CMP.length>0; }

/* ---- events that a per-user table can and cannot reproduce ---------------
   The seven below are funnel milestones: "did this user get at least this
   far". The other three (Advance Taken, Money Sent, Nimbus+ Subscribed) are
   post-activation product events with no per-user record here, so they are
   declared unsplittable rather than quietly reported unsegmented. */
const EV_STAGE = {
  'App Install':0, 'Sign-Up Completed':1, 'KYC Started':1, 'ID Photo Submitted':2,
  'KYC Approved':4, 'Bank Linked':5, 'Transaction Completed':6
};

/* ---- the one pass over 50,000 rows -------------------------------------- */
function aggregate(mask){
  const T=userTable(), n=T.n;
  const st=new Int32Array(8);
  const stP=[new Int32Array(8),new Int32Array(8)];
  const stC=[]; for(let c=0;c<5;c++) stC.push(new Int32Array(8));
  const stD=[]; for(let d=0;d<4;d++) stD.push(new Int32Array(8));
  const sgnPC=[new Int32Array(5),new Int32Array(5)], verPC=[new Int32Array(5),new Int32Array(5)];
  const sgnPD=[new Int32Array(3),new Int32Array(3)], verPD=[new Int32Array(3),new Int32Array(3)];
  const rRoll=[new Int32Array(6),new Int32Array(6)], rNday=[new Int32Array(6),new Int32Array(6)];
  const rBase=[0,0];
  let total=0;
  for(let i=0;i<n;i++){
    if(mask && !mask[i]) continue;
    total++;
    const s=T.stage[i], p=T.plat[i], c=T.chan[i], d=T.doc[i];
    st[s]++; stP[p][s]++; stC[c][s]++; stD[d][s]++;
    if(s>=1){ sgnPC[p][c]++; sgnPD[p][d]++; if(s>=4){ verPC[p][c]++; verPD[p][d]++; } }
    if(s>=6){
      rBase[p]++;
      const rr=T.retRoll[i], mk=T.retMask[i];
      for(let k=0;k<6;k++){ if(rr>=k) rRoll[p][k]++; if(mk>>k&1) rNday[p][k]++; }
    }
  }
  const ge=(a,s)=>{ let x=0; for(let k=s;k<8;k++) x+=a[k]; return x; };
  return {total, st, stP, stC, stD, sgnPC, verPC, sgnPD, verPD, rRoll, rNday, rBase, ge,
          reach:(s)=>ge(st,s), reachP:(p,s)=>ge(stP[p],s), reachC:(c,s)=>ge(stC[c],s)};
}

/* ---- turn the counters into something shaped exactly like DATA ----------- */
function shape(A){
  const PL=['iOS','Android'], CH=BASE_DATA.segCross.cols, DC=BASE_DATA.segCrossDoc.cols;
  /* Row order is taken from the baseline, never recomputed. DATA.seg.channel is
     sorted by verification rate and DATA.channels by volume; if a comparison
     re-sorted itself the columns of a side-by-side table would stop lining up,
     which is exactly the kind of quiet mis-read this tool exists to prevent. */
  const ordSeg = BASE_DATA.seg.channel.map(r=>CH.indexOf(r.k));
  const ordChan = BASE_DATA.channels.map(r=>CH.indexOf(r.name));
  const step=[A.total, A.reach(1), A.reach(4), A.reach(5), A.reach(6), A.reach(7)];
  const funnel=BASE_DATA.funnel.map((f,i)=>({
    stage:f.stage, note:f.note, users:step[i],
    conv: i===0?1:(step[i-1]?step[i]/step[i-1]:0),
    pctTop: step[0]?step[i]/step[0]:0
  }));
  const segRow=(k,base,nn)=>({k, n:nn, base, v:base?nn/base:0});
  const seg={
    platform: PL.map((k,p)=>segRow(k,A.reachP(p,1),A.reachP(p,4))),
    channel:  ordSeg.map(c=>segRow(CH[c],A.reachC(c,1),A.reachC(c,4))),
    doc:      DC.map((k,d)=>segRow(k,A.ge(A.stD[d],1),A.ge(A.stD[d],4)))
  };
  const mat=(rowsArr,cols,sgn,ver)=>{
    const o={rows:[],cols:cols.slice(),base:{},n:{}};
    rowsArr.forEach((rk,p)=>{
      let tot=0; for(let j=0;j<cols.length;j++) tot+=sgn[p][j];
      if(!tot) return;
      o.rows.push(rk);
      o.base[rk]=Array.from(sgn[p]); o.n[rk]=Array.from(ver[p]);
    });
    const keep=[]; o.cols.forEach((c,j)=>{ let t=0; o.rows.forEach(r=>t+=o.base[r][j]); if(t) keep.push(j); });
    if(keep.length!==o.cols.length){
      o.cols=keep.map(j=>o.cols[j]);
      o.rows.forEach(r=>{ o.base[r]=keep.map(j=>o.base[r][j]); o.n[r]=keep.map(j=>o.n[r][j]); });
    }
    return o;
  };
  const dropTot=A.st[1]+A.st[2]+A.st[3];
  const kycDrop=[['Personal details',A.st[1]],['ID photo capture',A.st[2]],['Selfie / liveness',A.st[3]]]
    .map(([k,v])=>({k, v:dropTot?v/dropTot:0, users:v}));
  const mkFlow=(a)=>({
    nodes:[{k:'Sign-up complete',sub:'entered verification',n:A.ge(a,1)},
           {k:'Personal details',sub:'form submitted',n:A.ge(a,2)},
           {k:'ID photo capture',sub:'photo accepted',n:A.ge(a,3)},
           {k:'Selfie / liveness',sub:'liveness passed',n:A.ge(a,4)},
           {k:'Identity verified',sub:'KYC approved',n:A.ge(a,4)}],
    drops:[{after:0,n:a[1],why:'abandoned on personal-details form'},
           {after:1,n:a[2],why:'photo rejected / app crash on upload'},
           {after:2,n:a[3],why:'liveness failed (low light)'}],
    after:[{k:'Bank linked',n:A.ge(a,5)},{k:'First transaction',n:A.ge(a,6)},{k:'Dropped after verify',n:a[4]}]
  });
  const flow=mkFlow(A.st); flow.ios=mkFlow(A.stP[0]); flow.android=mkFlow(A.stP[1]);
  const events=BASE_DATA.events.map(e=>{
    const s=EV_STAGE[e.name];
    if(s===undefined) return {name:e.name, cat:e.cat, total:null, plat:null, chan:null, split:false};
    const plat={}, chan={};
    PL.forEach((k,p)=>plat[k]=A.reachP(p,s));
    CH.forEach((k,c)=>chan[k]=A.reachC(c,s));
    return {name:e.name, cat:e.cat, total:A.reach(s), plat, chan, split:true};
  });
  const channels=ordChan.map(c=>{
    const b=A.reachC(c,1), nn=A.reachC(c,4);
    return {name:CH[c], signups:b, kyc:b?nn/b:0, kycUsers:nn};
  });
  /* The count travels with the rate. A retention rate on its own cannot be
     compared to anything: the moment the app started printing a 95% interval
     beside these numbers it needed the numerator they were computed from, and
     recovering one by multiplying the rate back up by its base is not a count —
     it is a count plus whatever the rate was rounded to on the way past. */
  const rc=(arr)=>{
    const base=A.rBase[0]+A.rBase[1];
    return BASE_DATA.retentionCurve.map((r,k)=>{
      const n=arr[0][k]+arr[1][k];
      return {d:r.d, n, v:base?n/base:0};
    });
  };
  const rp=(arr)=>({iOS:  BASE_DATA.retentionCurve.map((r,k)=>A.rBase[0]?arr[0][k]/A.rBase[0]:0),
                    Android:BASE_DATA.retentionCurve.map((r,k)=>A.rBase[1]?arr[1][k]/A.rBase[1]:0)});
  return {
    funnel, seg, channels, kycDrop, flow, events,
    segCross: mat(PL,CH,A.sgnPC,A.verPC),
    segCrossDoc: mat(PL,DC,A.sgnPD,A.verPD),
    retentionCurve: rc(A.rRoll), retentionNday: rc(A.rNday),
    retPlat: rp(A.rRoll), retPlatNday: rp(A.rNday),
    retBase: A.rBase[0]+A.rBase[1], retBasePlat:{iOS:A.rBase[0],Android:A.rBase[1]},
    /* Everything below is either a stock, a pre-aggregate over a different
       cohort window, or hand-authored copy. None of it can be split by a
       comparison, and each says so where it renders. */
    trend:null, revenue:null, cohorts:null, ttc:null, feed:null, profiles:null,
    reviews:null, cohortsSaved:null, kpis:null, segCrossDoc_note:null,
    _synthetic:true, _n:A.total
  };
}

/* Series the whole app renders against. Index 0 is always the unfiltered
   baseline and always uses the hardcoded DATA, so a screenshot taken with a
   comparison open still shows the published numbers in the first column. */
let SERIES_CACHE = null;
function series(){
  if(SERIES_CACHE) return SERIES_CACHE;
  const out=[{name:'All users', color:BASE_COLOR, data:BASE_DATA, all:true, n:50000}];
  CMP.forEach((c,i)=>{
    const A=aggregate(cmpMask(c));
    out.push({name:cmpName(c), color:CMP_COLORS[i%CMP_COLORS.length], data:shape(A),
              cmp:c, idx:i, n:A.total, warn:cmpGrainWarn(c)});
  });
  SERIES_CACHE=out; return out;
}
function invalidateSeries(){ SERIES_CACHE=null; }
/* === INLINE:END === */

/* Retention rates are derived from counts, never hand-typed — the same rule the
   segment table above already obeys. The published curve was authored at two
   decimals, which was harmless for as long as it only ever drew a chart. It
   stopped being harmless the moment every comparison began printing a margin
   beside its gap: a comparison series is counted off the generated user table,
   so leaving the all-users column on a rounded export measured the two arms of
   the same difference with two different instruments. D1 is the worst of them,
   0.48 against a true 0.4836 — a 0.36pp bias handed to every retention
   comparison on the page, and a third of the margin at a 400-user base.

   Nothing on screen moves. Every derived value rounds to the published one at
   the precision this dashboard prints it: 48 / 38 / 32 / 24 / 19 rolling and
   48 / 26 / 19 / 13 / 9 N-day, per platform 50/46 at D1 and 20/18 at D30. What
   changes is that the number is now a count over a base instead of a rate that
   has to be multiplied back up to find one. */
(()=>{
  const s=shape(aggregate(cmpMask({conds:[]})));
  DATA.retBase=s.retBase; DATA.retBasePlat=s.retBasePlat;
  DATA.retentionCurve=s.retentionCurve; DATA.retentionNday=s.retentionNday;
  DATA.retPlat=s.retPlat; DATA.retPlatNday=s.retPlatNday;
})();

/* =================== chart helpers =================== */
function svgLine(id, values, {labels, fmt=(v)=>v, w=680, h=210, color='var(--s1)', fill=true}={}){
  const padL=8,padR=14,padT=14,padB=26;
  const n=values.length, min=Math.min(...values)*0.9, max=Math.max(...values)*1.04;
  const pw=w-padL-padR, ph=h-padT-padB;
  const X=i=>padL+ (n===1?pw/2: i*pw/(n-1));
  const Y=v=>padT+ ph*(1-(v-min)/(max-min));
  let pts=values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  let grid=''; for(let g=0;g<=3;g++){const yy=padT+ph*g/3; grid+=`<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;}
  let area = fill?`<path d="M${X(0)},${Y(values[0])} L${pts.replace(/ /g,' L')} L${X(n-1)},${padT+ph} L${X(0)},${padT+ph} Z" fill="${color}" opacity="0.09"/>`:'';
  let slices='';
  values.forEach((v,i)=>{
    const x=X(i), y=Y(v);
    const lab = labels? labels[i]: ('#'+(i+1));
    slices+=`<g class="slc">
      <line class="cross" x1="${x}" y1="${padT}" x2="${x}" y2="${padT+ph}" stroke="${color}" stroke-width="1" stroke-dasharray="3 3"/>
      <circle class="hd" cx="${x}" cy="${y}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
      <rect x="${x-(pw/n/2)}" y="${padT}" width="${pw/n}" height="${ph}" fill="transparent" data-tip="<span class='tk'>${lab}</span><br>${fmt(v)}"/>
    </g>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    ${grid}${area}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${slices}
  </svg>`;
}
function multiLine(series, {labels, fmt=(v)=>v, w=680, h=210}={}){
  const padL=8,padR=14,padT=14,padB=26;
  const all=[].concat(...series.map(s=>s.values));
  const min=Math.min(...all)*0.9, max=Math.max(...all)*1.04;
  const n=series[0].values.length, pw=w-padL-padR, ph=h-padT-padB;
  const X=i=>padL+(n===1?pw/2:i*pw/(n-1));
  const Y=v=>padT+ph*(1-(v-min)/(max-min));
  let grid=''; for(let g=0;g<=3;g++){const yy=padT+ph*g/3; grid+=`<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;}
  let lines=series.map(s=>{
    const pts=s.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    let dots=s.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}"/><rect x="${X(i)-(pw/n/2)}" y="${padT}" width="${pw/n}" height="${ph}" fill="transparent" data-tip="<span class='tk'>${s.name} · ${labels?labels[i]:i}</span><br>${fmt(v)}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${grid}${lines}</svg>`;
}
function hbars(items, {fmt=(v)=>PCT(v), max=null, colorFn=null, w=680, subFn=null}={}){
  const mx = max!=null?max:Math.max(...items.map(i=>i.v));
  const cols = subFn? '150px 1fr 96px 66px' : '150px 1fr 66px';
  return `<div style="display:flex;flex-direction:column;gap:11px">`+items.map(it=>{
    const c = colorFn? colorFn(it): 'var(--s1)';
    const pct = mx? (it.v/mx*100):0;
    const tip = subFn? `<span class='tk'>${it.k}</span><br>${subFn(it)}<br>= ${fmt(it.v)}` : `<span class='tk'>${it.k}</span><br>${fmt(it.v)}`;
    return `<div class="hbrow${subFn?' hbrow4':''}" style="--hbcols:${cols}">
      <div style="font-weight:600;font-size:13px;color:var(--ink2)">${it.k}</div>
      <div style="background:var(--line2);border-radius:6px;height:20px;overflow:hidden" data-tip="${tip}">
        <div style="width:${pct}%;height:100%;background:${c};border-radius:6px"></div></div>
      ${subFn?`<div class="segbase">${subFn(it)}</div>`:''}
      <div class="num" style="font-weight:700;font-variant-numeric:tabular-nums">${fmt(it.v)}</div>
    </div>`;
  }).join('')+`</div>`;
}
function statusColor(sev){return sev==='critical'?'var(--critical)':sev==='serious'?'var(--serious)':sev==='warning'?'var(--warning)':'var(--muted)';}
function seqColor(t){
  const stops=['--seq100','--seq250','--seq400','--seq500','--seq600','--seq700'];
  const i=Math.min(stops.length-1, Math.max(0, Math.round(t*(stops.length-1))));
  return `var(${stops[i]})`;
}
function avatarColor(str){const cs=['#4F46E5','#0EA5E9','#1baf7a','#eb6834','#e87ba4','#eda100','#7c58e6'];let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%cs.length;return cs[h];}

  </div>
  <div class="grid g2e" style="margin-top:14px">
    ${HARD?`<div class="card"><h3>Drill into the weak step</h3><p class="csub">Where exactly do people quit?</p><div class="note" style="margin-top:0">A step is made of screens — one of them is doing most of the damage. Open <b>Flows</b>, follow the path through the step you flagged, and find the screen with the fattest drop-off wedge.</div>${cmpOn()?kycMixCmp():''}</div>`:`<div class="card"><h3>Where inside KYC users quit</h3><p class="csub">${cmpOn()?'Share of abandonment by screen, per comparison':'Share of abandonment by screen'}</p>
      ${cmpOn()?kycMixCmp():hbars(DATA.kycDrop,{fmt:v=>PCT(v),colorFn:softFn(d=>d.v>0.5?'var(--critical)':'var(--s1)')})}
      <div class="note">61% of abandonment happens on <b>one screen</b> — ID photo capture. Open <b>Flows</b> to watch it happen step by step.</div></div>`}
    <div class="card"><h3>What this costs</h3><p class="csub">${HARD?`Size the prize of fixing the weak step`:`If the weak step went 40% → 60%`}</p>
      ${impactCalc()}
      ${cmpOn()?impactCmp():''}
    </div>
  </div>
  ${HARD?'':`<div class="ins" style="margin-top:14px">💡 <div><b>Find interesting segments:</b> switch the breakdown above to <b>Platform × Channel</b>, then ask two <i>different</i> questions.<br><br><b>Where is the prize?</b> <b>Android + Paid social, 22%</b> (1,782 of 8,100) — the worst rate in the table and the biggest cell in it. That is where the volume is, so that is where to aim.<br><br><b>Where is the surprise?</b> Not there. Android converts at 30% and paid social at 28%, so a cell with <i>no interaction whatsoever</i> lands at 30% × 28% ÷ 40% ≈ <b>21%</b> — and you observe 22%. Two below-average margins produce a below-both cell by arithmetic, not by discovery. The cell that genuinely misbehaves is <b>Paid search</b>: iOS falls to <b>39%</b> against an expected 46%, while Android rises to <b>30%</b> against an expected 26%. It is the one channel where the 22pp platform gap shrinks to 9pp, and it is the only real interaction in the grid. Check it before you believe it: those are the two smallest cells in the table (1,400 and 1,000 users, intervals of about &plusmn;2.6 and &plusmn;2.8pp), so the residuals do clear their own noise — but on 2,400 of 50,000 installs. That makes it a real finding on a slice too small to build a roadmap around: worth one follow-up question, not a workstream. Hover any cell to see its expected value and its interval.</div></div>`}`;
},

retention(){
  const cur = retMode==='plat';
  return `<h1 class="h">Retention</h1><p class="hsub">Do activated users come back? Measured from first transaction, returning on <b>App Open</b>.</p>
  <div class="qbar">
    <div class="qgroup" data-tip="<span class='tk'>Born on</span><br>The event that starts a user's clock. Here retention is measured from a user's <b>first transaction</b>, not from install — so it answers “do people who got value come back?”, not “do downloads come back?”<br><i>Fixed in this demo.</i>"><span class="qlab">Born&nbsp;on</span><span class="qsel ev">◆ First transaction</span></div>
    <div class="qgroup" data-tip="<span class='tk'>Returned on</span><br>What counts as coming back. <b>App Open</b> is a low bar — opening the app is not the same as using it. A stricter return event (another transaction) always produces a lower curve.<br><i>Fixed in this demo.</i>"><span class="qlab">Returned&nbsp;on</span><span class="qsel ev">◆ App Open</span></div>
    <div class="qgroup"><span class="qlab">Type</span>
      <span class="qsel ${retType==='roll'?'ev':''}" id="rnR" onclick="setRetType('roll',this)" data-tip="<span class='tk'>Rolling retention</span><br>Returned on day N <b>or any day after</b>. The kinder, higher number — use it for “are they still around?”">Rolling</span>
      <span class="qsel ${retType==='nday'?'ev':''}" id="rnN" onclick="setRetType('nday',this)" data-tip="<span class='tk'>N-day retention</span><br>Returned on <b>exactly</b> day N. The stricter, lower number — use it for “is this a daily habit?”">N-day</span></div>
    <div class="qgroup"><span class="qlab">Break&nbsp;down</span>
      <div class="seg" id="retBd"><button class="${retMode==='none'?'on':''}" onclick="setRetBd('none',this)">None</button><button class="${retMode==='plat'?'on':''}" onclick="setRetBd('plat',this)">Platform</button></div></div>
  </div>
  <div class="grid g2e">
    <div class="card"><h3>Retention curve</h3><p class="csub">${cmpOn()?'One line per comparison — ':cur?'iOS vs Android — ':''}${retType==='roll'?'% still active on day N or later':'% active on exactly day N'}</p>
      <div id="retCurve">${cmpOn()?retCurveCmp():retCurve()}</div>
      ${cmpOn()?`<div class="legend">${series().map(s=>`<span class="lg"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>
        ${cur?cno('The platform toggle','Your comparison has taken over this chart. Platform is just another dimension &mdash; add <b>Platform is Android</b> to the comparison bar and it draws as a line beside everything else you are testing, on the same axis, instead of living in a toggle that only this one view has.'):''}`
        :cur?`<div class="legend"><span class="lg"><span class="sw" style="background:var(--s1)"></span>iOS</span><span class="lg"><span class="sw" style="background:var(--s2)"></span>Android</span></div>`:`<div class="legend">${[1,3,5].map(i=>{const c=(retType==='roll'?DATA.retentionCurve:DATA.retentionNday)[i];
          /* read off the curve, not re-typed beside it. Three numbers copied by
             hand into a legend are three numbers that can disagree with the line
             they sit under, and nobody checks a legend. */
          return `<span class="lg">${c.d} <b style="color:var(--ink);margin-left:4px">${PCT(c.v)}</b></span>`;}).join('')}</div>`}
      ${HARD?'':`<div class="note" style="margin-top:12px;font-size:12.5px">Same users, two definitions. <b>Rolling</b> counts anyone who came back on day N <i>or later</i>; <b>N-day</b> counts only those active on that exact day. Rolling is always the bigger number — which is why the definition has to be on the chart, not in someone's head.</div>`}
    </div>
    <div class="card"><h3>Weekly cohorts</h3><p class="csub">Retention by activation week (darker = higher)</p>
      ${cohortGrid()}
      ${cmpOn()?cno('The cohort grid','It is built on <b>six weekly activation cohorts</b>, and the event table a comparison filters holds the <b>last 30 days</b>. Two different windows over two different populations: rebuilding this grid from a 30-day table would mean inventing four of its six rows. The grain mismatch is the finding here &mdash; when a chart and your segment disagree about what a "user" is, the chart is right to refuse.'):''}
    </div>
  </div>
  ${cmpOn()?`<div class="card" style="margin-top:14px"><h3>Retention by comparison</h3><p class="csub">The same three milestones, with the base each rests on</p>
    ${rtab(RET_ROWS,'Milestone')}
    <p class="csub" style="margin:8px 0 0"><b>This is the table that decides the exercise, and the bases are why.</b> Retention here is measured on <i>activated</i> users &mdash; people who completed a first transaction &mdash; and activation is exactly what the funnel is losing. So a segment that looks catastrophic upstream arrives here with a base a fraction of the size, and a few hundred users produce a &plusmn;interval wide enough to swallow any difference you think you can see. Read the interval before the number. A null result on a thin base is not evidence of no difference; it is an absence of evidence, and the two are not the same claim.</p></div>`:''}
  <div class="note">${HARD?`Retention is <b>stable</b> across cohorts and platforms. So ask: is the problem that activated users leave — or that too few users get activated in the first place?`:`Retention is <b>stable</b> across cohorts and platforms — iOS and Android retain almost identically once activated. So the problem isn't that activated users leave; it's that too few get activated. The leak is <b>upstream at KYC</b>, not here. Fix activation before spending on retention.`}${cmpOn()?` <b>Test it yourself.</b> Build any segment you like in the comparison bar and watch this curve refuse to move. Nine cuts of this data and the curves sit on top of each other — a genuine null result, and the most valuable thing on this screen, because it rules a whole workstream out.`:''}</div>`;
},

flows(){
  const A = flowSeg==='android', I = flowSeg==='ios';
  const FD = A?DATA.flow.android : I?DATA.flow.ios : DATA.flow;
  const FLAB = A?' · Android only' : I?' · iOS only' : '';
  return `<h1 class="h">Flows</h1><p class="hsub">The real path users take through verification — where they move forward, and where they leak out.</p>
  <div class="qbar">
    <div class="qgroup" data-tip="<span class='tk'>The path being traced</span><br>Flows follows real user paths between two events. Everything drawn below happens between <b>sign-up complete</b> and <b>identity verified</b> — the step the funnel flagged.<br><i>Fixed in this demo.</i>"><span class="qlab">Path&nbsp;from</span><span class="qsel ev">◆ Sign-up complete</span><span class="qpill">→</span><span class="qsel ev">◆ Identity verified</span></div>
    <div class="qgroup"><span class="qlab">Steps</span><span class="qsel fixed" data-tip="<span class='tk'>Depth of the path</span><br>How many steps after the starting event to draw. More steps means more branches and a thinner, harder-to-read diagram.<br><i>Fixed at 3 in this demo.</i>">Show 3 after</span></div>
    <div class="qgroup"><span class="qlab">Segment</span>
      <div class="seg" id="flowBd"><button class="${flowSeg==='all'?'on':''}" onclick="setFlow('all',this)">All users</button><button class="${flowSeg==='ios'?'on':''}" onclick="setFlow('ios',this)">iOS</button><button class="${flowSeg==='android'?'on':''}" onclick="setFlow('android',this)">Android</button></div></div>
  </div>
  <div class="card"><h3>Verification flow${FLAB}</h3><p class="csub">Bar height = users reaching that screen · red = dropped off before the next${cmpOn()?' · one diagram per comparison':flowSeg!=='all'?' · switch between iOS and Android to compare the same screen':''}</p>
    ${cmpOn()
      ? `<div class="cno" style="margin-top:0"><b>One diagram per series.</b> Bar heights are scaled inside each card, so do not compare heights across cards &mdash; compare the <i>shape</i>, and read the drop rates in the table below for the levels.${flowSeg!=='all'?` And note the toggle above is now doing the same job as the comparison bar: add <b>Platform is ${A?'Android':'iOS'}</b> as a comparison instead and it lines up beside everything else you are testing.`:''}</div>
         <div class="flowwrap" id="sankey">${smallMult(()=>sankey(A?DATA.flow.android:I?DATA.flow.ios:DATA.flow))}</div>`
      : `<div class="flowwrap" id="sankey">${sankey(FD)}</div>`}
  </div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card"><h3>Top drop-off point</h3><p class="csub">${cmpOn()?'Every transition in the path, as a rate':'Biggest single leak in the path'}</p>
      ${cmpOn()?flowDropCmp():topLeak(FD)}
      ${HARD?'':`<div class="note">${A?`On Android, <b>the ID-photo screen loses 7,900 of the 15,800</b> who reach it — exactly half. Now switch to iOS: the same screen loses 3,812 of 13,320, or <b>29%</b>. Same screen, same build, twice the failure rate. That is a platform bug, not a user-motivation problem.`:I?`On iOS the ID-photo screen loses <b>29%</b> of those who reach it (3,812 of 13,320). That is still the worst screen in the flow — but it is <b>half</b> the Android rate. The screen is weak everywhere and broken on one platform.`:`One transition — <b>ID photo capture</b> — accounts for the majority of all verification loss. That is the screen to rebuild first. Now split it by platform to see who it hits.`}</div>`}
    </div>
    <div class="card"><h3>What verified users do next</h3><p class="csub">Steps after "Identity verified"${FLAB}</p>
      ${cmpOn()
        ? gbars(BASE_DATA.flow.after.map(a=>a.k),{fmt:v=>N(v),
            get:(d,k)=>{const f=A?(d.flow&&d.flow.android):I?(d.flow&&d.flow.ios):d.flow;
                        const x=f&&f.after.find(y=>y.k===k); return x?x.n:null;}})
        : hbars(FD.after.map(a=>({k:a.k,v:a.n})),{fmt:v=>N(v),max:FD.after[0].n,colorFn:softFn(a=>/Dropped/.test(a.k)?'var(--warning)':'var(--s3)')})}
      ${HARD?'':`<div class="note" style="margin-top:12px">Past verification the path is healthy — <b>${PCT(FD.after[0].n/FD.nodes[FD.nodes.length-1].n,0)}</b> of verified users link a bank, and most of those transact. ${A||I?`The other platform's rate is within a point of this one — <b>once users are through KYC, iOS and Android behave the same</b>. That is what makes the gap a verification problem and not an audience problem.`:`The journey only breaks in one place. Split by platform: this card barely moves, while the flow above does.`}</div>`}
    </div>
  </div>`;
},

cohorts(){
  const c = DATA.cohortsSaved[cohSel];
  return `<h1 class="h">Cohorts</h1><p class="hsub">Saved groups of users defined by what they did — the building blocks for every breakdown and campaign.</p>
  ${cmpOn()?cno('Saved cohorts','A saved cohort <b>is</b> a segment &mdash; the same idea as the comparison bar, kept rather than retyped. Which is exactly why they do not nest here: each card carries a size counted once over its own window, and the overlap between that and your comparison is a <b>joint</b> the two totals cannot give you. &ldquo;18,400 activated users&rdquo; and &ldquo;Paid social&rdquo; say nothing about how many are both &mdash; the honest answer is anywhere from zero to the smaller of the two, and picking the middle is a guess with a number on it. Build the intersection in the comparison bar instead, where it is counted rather than inferred.'):''}
  <div class="grid g3">
    ${DATA.cohortsSaved.map((c,i)=>cohCard(c,i)).join('')}
  </div>
  <div class="card" style="margin-top:16px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${c.name}</h3>
      <span class="badge ${c.tag==='critical'?'crit':c.tag==='warn'?'warn':'ok'}">${N(c.size)} users</span></div>
    <p class="csub" style="margin:8px 0 12px">Definition: ${c.def}</p>
    <div class="grid g2e">
      <div><div class="smallcap">Platform split</div>${hbars([{k:'iOS',v:c.plat.iOS},{k:'Android',v:c.plat.Android}],{fmt:v=>N(v),max:Math.max(c.plat.iOS,c.plat.Android)||1,colorFn:softFn(x=>x.k==='Android'&&c.tag==='critical'?'var(--critical)':'var(--s1)')})}</div>
      <div><div class="smallcap">Why this cohort matters</div><div style="font-size:13px;color:var(--ink2);line-height:1.5">${HARD?c.def:c.note}</div></div>
    </div>
    ${cmpOn()?`<p class="csub" style="margin:10px 0 0">The split above is <b>this cohort's own</b>, not your comparison's &mdash; the definition on this card is the only filter applied to it.</p>`:''}
  </div>`;
},

users(){
  if(userSel!=null) return userProfile(DATA.profiles[userSel]);
  const rows=DATA.profiles.map((u,i)=>`
    <div class="urow" onclick="openUser(${i})">
      <div class="uname"><span class="uav" style="background:${avatarColor(u.name)}">${u.name[0]}</span>${u.name}<span class="qpill">${u.id}</span></div>
      <div style="color:var(--ink2)">${u.plat} · ${u.ver}</div>
      <div style="color:var(--ink2)">${u.chan}</div>
      <div><span class="badge ${u.status}">${u.statusLab}</span></div>
      <div class="num" style="font-weight:700">${u.ltv?'$'+u.ltv.toFixed(2):'—'}</div>
    </div>`).join('');
  return `<h1 class="h">Users</h1><p class="hsub">Individual profiles with their full property set and event history. Where an aggregate becomes a person.</p>
  ${cmpOn()?cno('This list','These twelve are a <b>hand-picked illustrative sample</b>, not a draw from the 50,000-row table, so filtering them by your comparison would hand you a list that looks like evidence and is not: a sample chosen to illustrate is not a sample you can count. Profiles and comparisons run in opposite directions and the work needs both. A profile turns a number into a <b>hypothesis</b> &mdash; three rejected ID photos in ninety seconds, then gone &mdash; and the comparison bar is where you find out how many people that actually happened to. Read one, form the guess, then go count it.'):''}
  <div class="card" style="padding:0;overflow:hidden">
    <div class="urow" style="border-bottom:1px solid var(--line);background:var(--page);cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700">
      <div>User</div><div>Platform</div><div>Channel</div><div>Status</div><div class="num">LTV</div></div>
    ${rows}
  </div>
  ${HARD?'':`<div class="ins" style="margin-top:14px">💡 <div>Open <b>Andrei P.</b> — three rejected ID-photo attempts in 90 seconds, then gone. Every row in the "KYC abandoners" cohort is a story like this. The aggregate is the pattern; the profile is the proof.</div></div>`}`;
},

monetization(){
  const r=DATA.revenue;
  return `<h1 class="h">Monetization</h1><p class="hsub">Revenue from advance fees and Nimbus+ subscriptions.</p>
  ${cmpOn()?cno('Revenue','Two separate reasons, and both matter for the sizing work. <b>One: these are stocks.</b> $35,340 a month across the <b>18,400</b> users who have ever activated and are still here &mdash; not the <b>6,720</b> this month\'s funnel produced. Your comparison is a property of this month\'s arrivals, and slicing a standing balance by a property of the newest cohort is the stock-and-flow error made structural. <b>Two: there is no money on a user row.</b> The per-user table records which milestones each person reached, not what they paid, so there is nothing to add up per segment. Which forces the sizing to run the other way round, and that is the correct way round: take the extra activations your fix wins <i>in the funnel</i>, multiply by the value of an activation <i>on this page</i>, and say out loud which month you mean.'):''}
  <div class="grid g4">
    ${tile('Revenue (mo.)','$'+N(DATA.kpis.revenue.v),+0.04,false,"<span class='tk'>Monthly revenue</span><br>Advance fees ($30,000) + Nimbus+ subscriptions ($5,340). Both reconcile to the event table, and it is worth doing once by hand. Subs: <b>1,070</b> subscribers &times; $4.99 = $5,340. Fees: $30,000 across the <b>4,570</b> people who took an advance = <b>$6.56 each</b>, which at the app's 3% fee is about <b>$219</b> of advances each &mdash; two advances of roughly $110 against a $200 rolling limit, which is what a fortnightly pay cycle looks like. <b>Mind the grain:</b> 4,570 is <i>unique users</i>, not advances, so that $6.56 is revenue per <i>person</i> and never per <i>transaction</i>. Read what an event table counts before you divide by one of its numbers.")}
    ${tile('Activated base',N(DATA.kpis.activatedBase.v),+0.07,false,"<span class='tk'>Activated base</span><br>Everyone who has ever completed a first transaction and is still active — <b>18,400</b>. Do not confuse this with the <b>6,720</b> activations the funnel produced <i>this month</i>. One is a stock, the other a flow, and mixing them is the most common way a business case gets inflated.")}
    ${tile('Rev. / activated user','$1.92',+0.02,false,"<span class='tk'>Monthly revenue per activated user</span><br>$35,340 &divide; <b>18,400 activated users</b>. <b>This is the monthly number.</b> An activation you win this month is worth about this much in its first month — not $5.26.")}
    ${tile('LTV / activated user','$5.26',+0.02,false,"<span class='tk'>Lifetime value per activated user</span><br>$1.92 a month &times; <b>2.74 months</b> average activated life (18,400 base &divide; 6,720 new per month). Equivalently $35,340 &divide; 6,720 — the same arithmetic, but it is a <b>lifetime</b> figure. Multiply a monthly lift by this and you get lifetime value, not monthly revenue.")}
  </div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card"><h3>Revenue trend</h3><p class="csub">Weekly, last 8 weeks</p>
      ${svgLine('rev', r, {labels:r.map((_,i)=>'Wk '+(i+1)), fmt:v=>'$'+N(v), color:'var(--s1)'})}</div>
    <div class="card"><h3>Revenue mix</h3><p class="csub">This month</p>
      ${hbars([{k:'Advance fees',v:30000},{k:'Nimbus+ subs',v:5340}],{fmt:v=>'$'+N(v),colorFn:(_,i)=>'var(--s1)'})}
      <div class="note">Revenue tracks the <b>activated base</b>, not the monthly activation count: <b>$35,340 &divide; 18,400 activated users ≈ $1.92 each per month</b>. Nimbus+ accounts for $5,340 of it across <b>1,070</b> subscribers (≈$4.99 each).${HARD?'':`<br><br><b>Watch the units.</b> $35,340 &divide; <b>6,720</b> gives $5.26, and that number is genuinely useful — but it is a <b>lifetime</b> value, because 6,720 is a monthly <i>flow</i> and 18,400 is the <i>stock</i> it feeds. Win 1,000 extra activations and you earn <b>+$1.9k in month one</b>, rising to <b>+$1.9k &times; 2.74 ≈ +$5.3k a month</b> once those cohorts have stacked up. Same arithmetic, three-times-different answer depending on which month you mean.`}</div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Product engagement</h3><p class="csub">How activated users use the app's features</p>
    ${hbars([{k:'Card added to wallet',v:0.58},{k:'Advance repaid on time',v:0.94},{k:'Transactions that are advances',v:0.68},{k:'Sent money to a contact',v:0.41},{k:'Used card freeze',v:0.06}],{fmt:v=>PCT(v),colorFn:()=>'var(--s1)'})}
    <div class="note">Beyond the funnel, these show whether activated users actually adopt the product — issuing a card, repaying advances, sending money. Strong adoption here means the activations you win tend to stick.</div>
  </div>`;
},

feedback(){
  const R=DATA.reviews;
  return `<h1 class="h">Voice of customer</h1><p class="hsub">App-store reviews, NPS and support tickets — the "why" behind the funnel.</p>
  ${cmpOn()?cno('Voice of customer','App-store reviews are <b>anonymous</b>: there is no user id on a review, so there is no key that would join one to the behavioural table your comparison filters. Support tickets sit in a different system with a different key again. This is not a hole in this dashboard, it is the ordinary condition of qualitative data &mdash; and it is why the strongest argument you can build on this page is made of <b>timing and theme</b> rather than a join. If the rating turns in the same week the funnel turns, and the top complaint names the same screen the funnel loses people on, that is three instruments agreeing. Three instruments that fail in different ways are worth more than one joined table, because a join can only ever be as good as its key.'):''}
  <div class="grid g4">
    ${tile('Avg. rating', R.avg+'★', -0.12, true)}
    ${tile('iOS / Android', R.iosAvg+' / '+R.andAvg, null)}
    ${tile('NPS', '+'+R.nps, -0.40, true)}
    ${tile('Reviews (30d)', N(R.count), +0.14)}
  </div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card"><h3>Rating trend</h3><p class="csub">6-month average — down from 4.1★</p>
      ${svgLine('rat', R.ratingTrend.map(r=>r.v), {labels:R.ratingTrend.map(r=>r.m), fmt:v=>v.toFixed(1)+'★', color:'var(--critical)'})}</div>
    <div class="card"><h3>Rating distribution</h3><p class="csub">Last 30 days — note the bimodal split</p>
      ${hbars(R.dist.map(d=>({k:d.s+'★',v:d.v})),{fmt:v=>PCT(v),colorFn:d=>d.k[0]>='4'?'var(--good)':d.k[0]==='3'?'var(--warning)':'var(--critical)'})}
      ${HARD?'':`<div class="note">People either love it (5★) or hit the wall (1★). The 1★ bucket is dominated by verification.</div>`}
    </div>
  </div>
  <div class="grid g2e" style="margin-top:14px">
    <div class="card"><h3>Complaint themes</h3><p class="csub">Share of negative reviews</p>
      ${hbars(R.themes,{fmt:v=>PCT(v),colorFn:softFn(t=>statusColor(t.sev))})}</div>
    <div class="card"><h3>Support tickets</h3><p class="csub">By category, last 30 days</p>
      ${hbars(R.tickets,{fmt:v=>PCT(v),colorFn:softFn(t=>t.v>0.4?'var(--critical)':'var(--s1)')})}
      ${HARD?'':`<div class="note">The #1 support category (41%) matches the #1 review theme and the funnel's worst step. Three signals, one cause.</div>`}
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Recent reviews</h3><p class="csub">Representative sample · 🔴 tagged = verification-related</p>
    ${R.list.map(reviewCard).join('')}
  </div>`;
},
};

/* fragments */
function tile(lab,val,delta,down,tip){
  let dl='';
  if(delta!=null){ const up=delta>0; const good = down? !up : up;
    dl=`<div class="dl ${good?'up':'down'}">${up?'▲':'▼'} ${Math.abs(delta*100).toFixed(0)}%</div>`; }

function sankey(flow){
  const nodes=flow.nodes, drops=flow.drops;
  const w=720,h=300,padT=20,padB=30,colW=118,gap=(w-colW*nodes.length)/(nodes.length-1);
  /* A comparison can select a segment where nobody reached the first screen of
     this path. Dividing by that zero produces Infinity heights and an SVG that
     renders as a blank box with no explanation, so the scale collapses to 0 and
     the caller says why. */
  const maxN=nodes[0].n, scale=maxN?(h-padT-padB)/maxN:0;
  if(!maxN) return `<div class="cno"><b>Nobody in this comparison reached the start of this path.</b> The flow begins at sign-up; a segment that has no signed-up users in it has no path to draw. That is a real answer about the segment, not a gap in the data.</div>`;
  let svg='';
  // flow ribbons + drop wedges
  for(let i=0;i<nodes.length-1;i++){
    const x0=i*(colW+gap)+colW, x1=(i+1)*(colW+gap);
    const hA=nodes[i].n*scale, hB=nodes[i+1].n*scale;
    const yA=padT, yB=padT;
    // main ribbon (carried forward = nodes[i+1].n)
    const carried=nodes[i+1].n*scale;
    svg+=`<path d="M${x0},${yA} L${x1},${yB} L${x1},${yB+hB} L${x0},${yA+carried} Z" fill="var(--seq400)" opacity="0.28"/>`;
    // drop wedge
    const d=drops.find(dd=>dd.after===i);
    if(d){ const dh=d.n*scale;
      svg+=`<path d="M${x0},${yA+carried} L${x0},${yA+carried+dh} L${x1-14},${yA+carried+dh+18} L${x1-14},${yA+carried+18} Z" fill="var(--critical)" opacity="${HARD?0.18:0.30}" data-tip="<span class='tk'>Drop-off</span><br>${N(d.n)} users<br>${d.why}"/>
      <text class="fdrop" x="${x0+8}" y="${yA+carried+dh+15}">▼ ${N(d.n)} left</text>`;
    }
  }
  // nodes
  nodes.forEach((nd,i)=>{
    const x=i*(colW+gap), bh=nd.n*scale;
    const bad=!HARD && i===2; // ID photo capture column is where the big leak follows
    svg+=`<g class="fnode" data-tip="<span class='tk'>${nd.k}</span><br>${N(nd.n)} users reached">
      <rect x="${x}" y="${padT}" width="${colW}" height="${Math.max(bh,4)}" rx="5" fill="${bad?'var(--critical)':'var(--seq500)'}" opacity="0.92"/>
      <text class="flab" x="${x}" y="${padT-6}">${nd.k}</text>
      <text x="${x+8}" y="${padT+18}" style="fill:#fff;font-size:12px;font-weight:800">${N(nd.n)}</text>
      <text class="fsub" x="${x}" y="${padT+Math.max(bh,4)+14}">${nd.sub}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;min-width:680px">${svg}</svg>`;
}
