  <div class="exhow"><span>🧍 Solo <b>3m</b></span><span class="ar">→</span><span>👥 Pair <b>7m</b></span><span class="ar">→</span><span>🗣 Debrief <b>5m</b></span></div>
  <h1>Map the user journey</h1>
  <div class="two">
    <ul>
      <li><b>Solo first:</b> the sheet opens with <b>one blank card</b>. Build the journey a stage at a time, from first touch all the way to <b>coming back</b>.</li>
      <li>For each stage fill the row: <b>goal · action · touchpoint · emotion (1–5)</b>.</li>
      <li>Mark the <b>gates</b> and circle the <b>lowest-emotion</b> stage.</li>
      <li>Write your <b>hypothesis</b>: where do you think users drop, and why?</li>
      <li><b>Then pair up:</b> compare journeys. Where do your stages, gates or emotion scores differ — and who's right?</li>
    </ul>
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div>
        <span class="pill">📄 Workbook → Exercise 1</span>
        <span class="pill" style="margin-top:10px;display:inline-block">📱 Use your hands-on app experience</span>
        <div class="note" style="margin-top:16px">Don't open the funnel data yet — this is your <b>hypothesis</b>. But do finish the journey: <b>Exercise 2's funnel is built from these stages</b>, so a step you leave out is a step you aren't yet measuring.</div>
      </div>
      ${qrMini('wb','Scan → workbook','#ex1')}
    </div>
  </div>
</div>${foot('Exercise 1 · Nimbus')}`,
 notes:`<b>3 min solo — enforce the silence</b>, it will feel awkward the first time and it is the most important 3 minutes of the day. Then "turn to your partner". Circulate during the pair phase. Push for specificity about emotion — the "Verify ID" row should score low if they were paying attention in the app. Common miss: listing features instead of user goals. Debrief: each pair names its predicted drop-off stage — <b>ask the non-typist</b> — and write predictions on a whiteboard to compare with reality next.<br><br><b>Watch the length of the journeys, not just their content.</b> The workbook now builds Exercise 2's funnel from whatever they draw here, so a four-stage map produces a four-row funnel and the pair never meets the bottleneck. As you circulate, ask anyone with a short map: "walk me from <b>never heard of it</b> to <b>used it twice</b> — where does yours start, and where does it stop?" The map is not one-way, though — a pair who realises in Exercise 2 that a step is missing can add it from the funnel and it appears here, so a short map is recoverable rather than fatal. It is still cheaper to draw it right the first time, because the stage arrives in the journey blank and they will owe it a goal, an action and an emotion when they are already deep in numbers. The dashboard reports six events; six stages is the shape you wantbefore the timer ends. Exercise 2 will name any event their map missed, but catching it here costs a sentence and catching it there costs them their exercise.`},

/* ---- Move 2 ---- */
{section:4,html:`<div class="pad">
  <div class="kicker">Move 2 · Concept · learn on Bloom</div>
  <h2>The funnel — the journey, measured</h2>
  <div class="two">
    <ul>
      <li>Pick the <b>events</b> that mark each stage; anchor the funnel on the <b>North Star</b>.</li>
      <li><b>Step conversion</b> = this ÷ previous. <b>Overall</b> = this ÷ top.</li>
      <li>Read <b>step</b> conversion to find the weak link; read <b>overall</b> to size the prize. A <b>cliff</b> — one step far below its neighbours — is your target.</li>
    </ul>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Bloom funnel</div>
      <div style="margin-top:10px">${vzFunnel([['Install',100000,'100k','—'],['Browse',55000,'55k','55%'],['Add cart',22000,'22k','40%'],['Checkout',6600,'6.6k','30%'],['Delivered',5940,'5.9k','90%']],3,520)}</div>
      <p style="margin-top:12px"><b>Add-to-cart → Checkout at 30%</b> is the <b>cliff</b> — far below its 40% and 90% neighbours. But the biggest <i>absolute</i> loss is <b>Install → Browse: 45,000 people</b>, against 15,400 at checkout.</p>
      <div class="note" style="margin-top:8px">Two different problems. A cliff is a <b>broken step</b>; a top-of-funnel leak is usually <b>the wrong audience or a weak first run</b>. Check both, then pick by what you can fix and what it is worth.</div>
    </div>
  </div>
</div>${foot('Move 2 · Funnel')}`,
 notes:`Drill the step-vs-overall distinction — the single most useful literacy skill here — and use Bloom to make the trap concrete. Ask "which step is worst?" and let the room say <b>checkout</b>; then show them Install → Browse loses <b>45,000</b> people to checkout's 15,400. Neither reading is wrong, they answer different questions: the cliff says <i>this step is broken</i>, the absolute loss says <i>this is where the volume goes</i>. Then ask the question rather than answering it: "on Nimbus, do the cliff and the biggest absolute loss land on the same step, or different ones?" — and let Exercise 2 settle it. Whichever way it comes out, the point survives: the two readings answer different questions and a plan needs both. Then: "now build Nimbus's funnel from the real dashboard."`},

{cls:'ex',section:4,mins:15,html:`<div class="pad">
  <div class="exbadge">✍️ Exercise 2 · apply to Nimbus · 15 min</div>
  <div class="exhow"><span>🧍 Solo <b>4m</b></span><span class="ar">→</span><span>👥 Pair <b>6m</b></span><span class="ar">→</span><span>🗣 Debrief <b>5m</b></span></div>
  <h1>Build the funnel from the data</h1>
  <div class="two">
    <ul>
      <li><b>Solo first:</b> your funnel is already there — it <i>is</i> your Exercise-1 journey. Tell each row which dashboard <b>event</b> counts it, then read the user count off <b>Nimbus Analytics → Funnels</b>. Missing a step? Add it right here with <b>＋</b> — it lands in your journey too.</li>
      <li>Compute <b>step conversion</b> for every step (this ÷ previous) — <b>do your own arithmetic</b>.</li>
      <li>Identify the <b>single worst step</b>. Compare to your Exercise-1 hypothesis — were you right?</li>
      <li><b>Then pair up:</b> check each other's numbers, then compute the <b>overall</b> install→first-transaction rate together. What's the prize if you fix the worst step?</li>
    </ul>
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div>
        <span class="pill">📊 Dashboard → Funnels</span>
        <span class="pill" style="margin-top:10px;display:inline-block">📄 Workbook → Exercise 2</span>
        <div class="note" style="margin-top:16px">Do the arithmetic <b>yourself</b>, on paper or in your head — don't just read the % off the screen, and don't let your partner do it for you. Feeling the math is the point.</div>
      </div>
      ${qrMini('wb','Scan → workbook','#ex2')}
    </div>
  </div>
</div>${foot('Exercise 2 · Nimbus')}`,
 notes:`The solo phase here is about <b>arithmetic confidence</b> — everyone must compute at least one step conversion with their own hands, or the rest of the day is faith-based. Both partners will land on the KYC step (40%); the pair phase is a numbers cross-check, which catches transcription errors fast.<br><br><b>The funnel is theirs, not ours.</b> It is generated from their Exercise-1 journey — same rows, same order, same names — so the sheet will name the worst step back to them in <i>their</i> words ("Sign up → Prove who I am"), not the dashboard's. That is the point: the map they drew is the thing being measured. Two consequences to expect. First, the "measured by…" box on each row is where a pair says which dashboard event counts that stage — pairs who skip it are typing numbers against labels they invented, which is the exact habit the day is against. Second, "Check my math" now also checks their map against the instrument and names any dashboard event no stage claims. A pair that gets <i>"your journey has no stage for Repeat (30d)"</i> has just been handed a real finding, and they can act on it without leaving the page: <b>＋</b> on any funnel row inserts a stage after it, and that stage appears in their Exercise 1 journey — blank, because the funnel can tell you a step exists but only the journey can say what the user was trying to do there. Renaming and reordering work the same way in both directions; numbers travel with the stage. So do not send them back to Exercise 1 to retype anything — send them back to <i>describe</i> what they just discovered. Debrief on prediction vs reality — celebrate pairs who called it from the app experience. Ask the sizing question: "install→first-txn is 13.4%; if KYC went 40→60%, roughly what happens?" (≈ +50% activations, +3,360/mo). This motivates the rest of the day.<br><br><b>Running a senior room?</b> Open the dashboard as <b>nimbus-analytics.html?mode=hard</b> and share that link instead of the plain one. Hard mode strips every answer cue — the red bottleneck banner, the highlighted bars, the verdict notes under each chart — so the group has to find the 40% step rather than read it off a flag. The mode is remembered on that device however it was set, so a mid-exercise refresh does not hand the answers back. For a room of experienced PMs that is the difference between an exercise and a demonstration; for a junior room, leave it off.`},

/* ---- Move 3 ---- */
{section:4,html:`<div class="pad">
  <div class="kicker">Move 3 · Concept · learn on Bloom</div>
  <h2>Find the bottleneck — and its cause</h2>
  <div class="four">
    <div class="card"><h3>① Locate</h3><p>The worst step is the bottleneck. Bloom: Add-to-cart → Checkout at 30%.</p></div>
    <div class="card"><h3>② Scan</h3><p>One dimension at a time. Bloom: mobile web 22% vs app 41%; guests worst. These are <b>candidates</b>.</p></div>
    <div class="card"><h3>③ Build</h3><p>Combine two and see which gap survives. Bloom: <i>guests on mobile web</i> — the device gap is mostly the guest gap wearing a phone.</p></div>
    <div class="card"><h3>④ Explain</h3><p>Reviews &amp; tickets for that step. Bloom: "had to make an account just to buy" · "no Apple Pay".</p></div>
  </div>
  ${vzTriangle()}
  <p style="margin-top:12px"><b>Quant tells you where. Qual tells you why.</b> But a one-dimension gap is a <b>candidate, not a cause</b> — until you hold the other dimension still and watch whether it survives, dissolves, or reverses.</p>
  <div class="note"><b>Bloom diagnosis:</b> users abandon at checkout because it <b>forces account creation and only takes a card</b> — not because "mobile web is bad". The device gap largely <i>dissolves</i> once you compare guests with guests: the cause is the gate, and mobile web was standing in for it.</div>
</div>${foot('Move 3 · Bottleneck')}`,
 notes:`The heart of the method — and the one slide where the room learns the difference between a chart and an argument. Walk Bloom along all four rungs: funnel (checkout) → scan (mobile web, guests) → <b>build</b> (guests on mobile web, using the comparison bar you showed them on the tour) → feedback (forced signup, no wallet).<br><br><b>Rung ③ is the new one and it is the point of the slide.</b> Say it plainly: "mobile web converts 19 points worse" and "guests convert worse" are two sentences about the same people, because guests are disproportionately on mobile web. Hold the checkout type still and most of the device gap goes away. That is <b>confounding</b>, it is the single most common way a competent PM ships the wrong fix, and the only defence is to build the compound segment and look. If a room wants the formal name, this is Simpson's paradox's everyday cousin — the direction of a difference can change once you condition on a third variable.<br><br>Then teach the third possible outcome, because rooms only ever expect two: a gap can <b>survive</b> (your candidate is still alive), <b>dissolve</b> (the first dimension was standing in for the second) or <b>reverse</b> (you had the sign backwards) — and reversal is the most valuable of the three, because it is the one that would have got you fired. The workbook makes them write which one happened.<br><br>One caveat to hand them before they go: building segments costs you sample. Every condition you AND on shrinks n, and past a point the gap you are staring at is smaller than the margin of error on your own sample. The workbook prices that live beside each segment they build. Say the rule once: <b>a gap smaller than its margin of error is a null result, not a small effect.</b><br><br>Then set them loose on Nimbus, where the signals converge on ID-photo capture — and where one of the country gaps is a confounder waiting for them.`},

{cls:'ex',section:4,mins:25,html:`<div class="pad">
  <div class="exbadge">✍️ Exercise 3 · apply to Nimbus · 25 min</div>
  <div class="exhow"><span>🧍 Solo <b>7m</b></span><span class="ar">→</span><span>👥 Pair <b>11m</b></span><span class="ar">→</span><span>🗣 Debrief <b>7m</b></span></div>
  <h1>Diagnose the bottleneck</h1>
  <div class="two">
    <ul>
      <li><b>Solo (7 min):</b> confirm the worst step, then <b>scan</b> it one dimension at a time &mdash; <b>Funnels &rarr; break down</b> covers platform, channel and ID type; country, version and device need <b>+ Add comparison</b>. Skim <b>Voice of customer</b>, then draft <i>"Users drop at ___ because ___ (evidence: ___, ___, ___)"</i> — <b>cause</b>, not symptom.</li>
      <li><b>Then build — two groups, not one.</b> AND your two best candidates into one chip, then a <b>second</b> differing in <b>exactly one</b> condition. Does the gap <b>survive</b>, <b>dissolve</b> or <b>reverse</b>?</li>
      <li><b>Pair (11 min):</b> read both diagnoses aloud, attack the weakest evidence, merge into <b>one</b> you'd defend to a client — and name <b>one hypothesis you killed</b>.</li>
    </ul>
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div>
        <span class="pill">📊 Funnels · Flows · Voice of customer</span>
        <span class="pill" style="margin-top:10px;display:inline-block">📄 Workbook → Exercise 3</span>
        <div class="note" style="margin-top:12px"><b>Step zero:</b> rule out a tracking bug — an event that never fires on Android makes every chart agree and all wrong.<br><b>Two chips, not one.</b> A compound group vs <i>All users</i> only proves it is unusual; the second says which half did it.<br><b>Check n.</b> Every AND shrinks the sample; a gap inside the printed margin is a <b>null result</b>, not a small effect.<br><b>Then</b> cite 3 receipts, one <b>not analytics</b> — funnel, segments and Flows read one stream; reviews don't.</div>
      </div>
      ${qrMini('wb','Scan → workbook','#ex3')}
    </div>
  </div>
</div>${foot('Exercise 3 · Nimbus')}`,
 notes:`The highest-value exercise — protect its time, and protect the <b>7-minute solo block</b> especially: this is a generation task, and two people who have each formed a view independently will surface roughly twice the hypotheses of two people who talked from minute one. Grade diagnoses on evidence: did they triangulate (funnel + segment + qual), or just point at the red bar? Push on cause vs symptom. Strong answer names <b>ID photo capture UX + Android camera</b> as the cause, with 3 receipts. Point them at Flows to make it vivid. In debrief, ask a pair where they <b>disagreed</b> — the disagreements teach more than the answers.<br><br>Two questions to push hard on, because almost nobody asks them unprompted. First: <b>"how do you know the tracking is right?"</b> The Android gap has an innocent explanation — an event that fires late, or not at all, on one platform — and ruling it out is the difference between an analyst and a chart-reader. (On Nimbus it is genuinely a UX problem: the reviews and tickets say so, and instrumentation bugs do not make people write about glare.) The strong answer settles it inside the funnel before it reaches for anything else, and the tool prints both halves of it. First, a verification event that under-fired on Android would <b>inflate</b> every rate measured after it — and the later steps sit within about two points of iOS, which is the opposite of what a missing event does. Second, break the step down and the tool splits verification into reaching the ID-photo screen and clearing approval: Android reaches it at almost the same rate as iOS and then fails approval, so <b>97% of the platform gap opens after the photo is submitted</b>. A dropped event cannot produce that shape. <i>Then</i> the reviews and tickets corroborate it, and corroboration from a genuinely separate source is worth having — but lead with the funnel, because it is the half a sceptical client cannot wave away as anecdote.<br><br>Second: <b>"which of your three receipts is actually independent?"</b> Funnel, segments and Flows are one event stream wearing three outfits. The reviews and the tickets are the separate witness — a diagnosis resting only on charts is one bad event definition away from being fiction.<br><br><b>Push one group to rule out the obvious confounder.</b> "Android is worse" is not yet a finding — Android might simply attract more people using the ID that fails most often. The dashboard can settle it: Funnels → break down → <b>Platform × ID type</b>. Standardising Android to the iOS document mix moves it from 30.1% to 30.7%, so document mix explains <b>0.7 of the 21.9 points</b>. The gap is real and it is the platform. That table also hides a second finding for a fast group: driving licences do disproportionately badly <i>on Android specifically</i> (17.0% against the 21.0% you would predict) while on iOS they beat prediction — two problems multiplying, not one.<br><br><b>The confounder that is actually waiting for them is the country one, and the comparison bar is how they kill it.</b> Scanning by country hands almost every group the same candidate: <b>Moldova 33.5% against Romania 41.8%</b>, an 8.3-point gap and an obvious story about a bad market. It is not a market problem. Moldova skews Android; Romania skews iOS; the platform gap is doing all the work. Make them build it rather than take your word for it: <b>+ Add comparison</b> → Country = Moldova <b>＋ and…</b> Platform = Android, save; a second comparison for Romania + Android. Held at Android, Romania lands at <b>30.2%</b> and Moldova at <b>29.2%</b> — the 8.3-point gap collapses to about <b>one point</b>, which is inside the noise on those sample sizes. That is the whole lesson of the day in one screen, and it is worth stopping the room for. A group that instead ships a Moldova-specific fix has spent a quarter on a variable that was never the cause.<br><br><b>Make them look at n while they do it.</b> The chips print the sample size, and the workbook computes the 95% margin beside each built segment as they type. This is where a fast group learns the other half of the skill: keep ANDing conditions and eventually every gap looks huge and none of them are real. The rule to say out loud — <b>if the gap is inside the margin of error, the honest report is "no detectable difference", not "a small effect"</b>. Groups that write down a 3-point gap on 180 users have found nothing and should say so; that is a pass, not a failure.<br><br><b>Make every group write the killed hypothesis.</b> The workbook has a field for it and the summary shouts when it is empty. A room that killed nothing controlled for nothing — they scanned, they liked what they saw, and they stopped. Ask at debrief: "what did you believe at minute five that you no longer believe?" A pair with no answer has a diagnosis you cannot trust, however good the charts look.<br><br><b>Senior room?</b> Hand out <b>nimbus-analytics.html?mode=hard</b> instead of the plain link. It strips the bottleneck banner, the red bars and the verdict notes, so the group has to build the diagnosis rather than read it. The mode is remembered on that device however it was set, and the workbook and tracker links carry it onward, so a pair cannot click through into a soft tab and read the answer off the banner.`},

{cls:'dark',section:4,mins:10,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Halfway</div>
  <h1>☕ Break — 10 minutes</h1>
  <p class="big" style="max-width:780px">You've just done the hard part: a diagnosis backed by what users <i>do</i> and what users <i>say</i> — two independent kinds of evidence, agreeing. After the break we turn that diagnosis into a funded plan, then into the story that sells it.</p>
  <div class="note" style="max-width:780px;margin-top:18px">Back in 10. Leave the laptop open on your workbook — we pick up at <b>Move 4 · the initiative-based plan</b>. Same partner.</div>
</div>${foot('Break · 10 min')}`,
 notes:`<b>Take the break — do not skip it and do not let it slide to 15 minutes.</b> You are two hours in, and the two heaviest exercises (the plan and the story) are still ahead; attention is the constraint from here, not content. Set the section timer to 10 and say the return time out loud <i>and</i> write it somewhere visible. Use the break yourself to scan two or three workbooks — Exercise 3 diagnoses are the best early-warning signal for who is drifting, and you can course-correct in one sentence when you restart. If the room is running late, this is <b>not</b> the thing you cut; cut from the Move 5 teaching instead (see the facilitator note on the agenda slide).`},

/* ---- Move 4 ---- */
{section:4,html:`<div class="pad">
  <div class="kicker">Move 4 · Concept · learn on Bloom</div>
  <h2>The initiative-based approach</h2>
  <div class="flow" style="margin-bottom:6px">
    <div class="n"><div class="t">Objective</div><div class="d">A KPI with a target &amp; date</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Initiatives</div><div class="d">The bets you believe move it</div></div>
    <div class="a">→</div>
    <div class="n"><div class="t">Actions</div><div class="d">Shippable steps design &amp; eng build</div></div>
  </div>
  <div class="two" style="margin-top:6px">
    <ul>
      <li>An objective is <b>only done when the number moves</b> — not when the feature ships.</li>
      <li><b>Several initiatives per objective</b> — keep adding until the target is covered.</li>
      <li>Each initiative carries a <b>hypothesis</b> and an <b>expected contribution</b> (pp) to the KPI.</li>
    </ul>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Bloom example</div>
      <p style="margin-top:10px"><b>Objective:</b> checkout completion 30% → 45% this quarter.</p>
      <p style="margin-top:8px"><b>Initiative:</b> Guest checkout.<br><b>Actions:</b> buy without an account, email-only capture, account offered <i>after</i> purchase. <b>+7pp, effort M.</b></p>
    </div>
  </div>
</div>${foot('Move 4 · Initiatives')}`,
 notes:`This is Wolfpack's spine — mirror the vocabulary. Hammer "<b>done = the number moved</b>". Use Bloom's guest-checkout initiative as the model: objective, hypothesis, concrete actions, expected pp, effort. Then Ex 4 — the biggest exercise — on Nimbus, with the initiative tracker.`},

{section:4,html:`<div class="pad">
  <div class="kicker">Move 4 · Concept · the other half of an objective</div>
  <h2>Every objective needs a guardrail</h2>
  <div class="two">
    <ul>
      <li><b>Fixing one metric can hurt another.</b> Loosening the KYC gate lifts activation — but can raise <b>fraud, advance defaults, and support load</b>. More activated users isn't a win if they default.</li>
      <li><b>Part of the 60% who fail is non-negotiable.</b> Some of the people who do not clear KYC are people your <b>verification vendor and compliance</b> rules are right to reject — that share is a floor under the failure rate, not a target. Partner with risk &amp; legal to find out how big it is, because it sets your real ceiling. You can't "UX" a regulation away.</li>
    </ul>
    <div class="card" style="align-self:center">
      <h3>State it as a guardrail</h3>
      <p style="font-size:19px;color:var(--navy);font-weight:600;line-height:1.35">"Lift KYC completion 40% → 60% <span style="color:var(--pink)">without</span> raising the 30-day default rate."</p>
      <div class="note" style="margin-top:6px">A strong objective names what must <b>not</b> move, too.</div>
      <div class="note" style="margin-top:10px"><b>A guardrail you can't measure is a wish — and it has to be a metric that already exists.</b> Name the metric, today's value, the threshold and the check: <i>"on-time advance repayment, currently 94% (4,295 of 4,570 advances), reviewed weekly — we stop and reassess below 92%."</i> That one is on the dashboard in front of you, under Cohorts. If your guardrail needs a new pipeline before anyone can read it, it will not be read: "don't make fraud worse" is something everyone nods at and nobody owns.</div>
    </div>
  </div>
</div>${foot('Pressure-test · guardrails')}`,
 notes:`Guardrails separate senior PMs from junior ones, and this slide sits <i>before</i> Exercise 4 on purpose — the answer key marks a plan down for not having one, so they have to hear it before they write theirs. In fintech especially, activation and risk pull against each other: ask "if we hit 60% but defaults double, did we win?" Normalize that some of the drop-off is <b>compliance, not UX</b> — you cannot design a regulation away, and a target that assumes you can is a target you will miss. (Bloom has a guardrail too: guest checkout must not raise payment-fraud chargebacks.) One line before you move on: a guardrail is not pessimism, it is what makes the number credible to the person funding it.`},

{section:4,html:`<div class="pad">
  <div class="kicker">Move 4 · Prioritisation · learn on Bloom</div>
  <h2>Which bet first? Score with ICE</h2>
  <div class="two">
    <ul>
      <li><b>Impact</b> — how much will it move the KPI? (1–10)</li>
      <li><b>Confidence</b> — how sure are we, given the evidence? (1–10)</li>
      <li><b>Ease</b> — how cheap/fast to ship? (1–10)</li>
      <li><b>ICE = I × C × E.</b> Rank descending; sequence quick, high-confidence wins first.</li>
    </ul>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Bloom, ranked</div>
      <div style="margin-top:10px">${vzIce()}</div>
      <p style="margin-top:12px">Ranked by <b>ICE</b>, not by lift — guest checkout happens to win on both. Estimated at +7 / +4 / +2 / +2pp.</p>
      <div class="note" style="margin-top:8px">Those add to +15pp — <i>suspiciously</i> exactly the 30→45% gap. <b>Lifts don't add.</b> Guest checkout and fewer form fields rescue the same shopper, so shipping both wins less than the sum. Treat the total as a <b>ceiling</b>, not a forecast — and when it lands exactly on your target, you reverse-engineered it.</div>
    </div>
  </div>
</div>${foot('Prioritisation · ICE')}`,
 notes:`Keep it practical — ICE is a conversation tool, not a precise science. The value is forcing "how confident are we, really?" against the Ex-3 evidence. Then spend a minute on the note, because the Bloom lifts summing to exactly the gap is the most common self-deception in planning. Coverage is a <b>necessary</b> check — if the bets do not add up you certainly cannot hit the number — but it is not <b>sufficient</b>, because overlapping bets count the same rescued user twice. Ask the room: "which two of these four fix the same person?" (guest checkout and fewer fields). Mention RICE (adds Reach) as an alternative.`},

{cls:'ex',section:4,mins:30,html:`<div class="pad">
  <div class="exbadge">✍️ Exercise 4 · apply to Nimbus · 30 min</div>
  <div class="exhow"><span>🧍 Solo <b>8m</b></span><span class="ar">→</span><span>👥 Pair <b>14m</b></span><span class="ar">→</span><span>🗣 Debrief <b>8m</b></span></div>
  <h1>Build the initiative-based plan</h1>
  <div class="two">
    <ul>
      <li><b>Solo (8 min):</b> one <b>Objective</b> — KPI, baseline, target, date — then <b>as many initiatives as you can</b>. Don't discuss.</li>
      <li><b>Pair (14 min):</b> pool both lists, cut to the best <b>3–4</b>. Each needs a <b>hypothesis</b>, 2–4 <b>actions</b>, a <b>contribution</b> (pp) and <b>effort</b>. Score with <b>ICE</b> separately, then compare — disagreement is the real argument.</li>
      <li><b>Sanity-check:</b> do contributions <b>reach the target</b>? Do two bets rescue the <b>same</b> user? Name a <b>guardrail</b>.</li>
      <li><b>Cost it — on whom?</b> Person-weeks per bet, then what <b>one point</b> earns per month. A point of <i>what</i>, measured on <b>which population</b>? Name your Ex-3 scope <i>and its size</i>.</li>
    </ul>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <div>
        <span class="pill">🎯 Initiative tracker (web) or Workbook → Ex 4</span>
        <button class="cpbtn cpi" data-cp="wb" data-hash="#ex4" onclick="copyLink(this)">📋 Copy workbook → Ex 4 link for Slack</button>
        <div class="note" style="margin-top:12px">Every initiative traces to Ex-3 evidence, or it's an opinion with a Jira ticket. <b>Overlapping lifts don't add</b>: two bets on one user give a ceiling.</div>
        <div class="note" style="margin-top:8px"><b>A rate has no value until you say whose.</b> One point on all 32,000 sign-ups is <b>$884</b>/mo at plateau; on the 17,500 Android sign-ups, <b>$483</b>; on the 5,400 who upload a driving licence on Android, <b>$149</b>. Same "+1pp" — <b>5.9×</b> across that ladder.</div>
      </div>
      ${qrMini('tr','Scan → tracker')}
    </div>
  </div>
</div>${foot('Exercise 4 · Nimbus')}`,
 notes:`The centrepiece. The <b>8 minutes of silent solo listing</b> is doing real work — pooled independent lists beat a group brainstorm on both count and quality, so resist the urge to shorten it. The <b>independent ICE scoring</b> is the other trick: identical scores usually mean one person deferred, and a 2-point gap on Confidence is the most productive argument in the room. Point them to the web initiative tracker (multi-group, auto-ICE, coverage check) or the workbook. Insist each initiative links to a specific Ex-3 evidence item. Watch for scope creep — pull them back to the one screen. The "do they add up to the target?" check separates a plan from a wishlist. Debrief: 2–3 pairs pitch their ranked list — <b>non-typist presents</b>. (The QR opens the tracker; the 📋 button copies the workbook Ex-4 link — paste it in Slack for anyone who'd rather stay in the workbook.)<br><br><b>Two lines to say out loud, because they are not on the slide.</b> First, during the solo listing: <i>"Quantity now, quality later — don't filter yet, you'll rank in a minute."</i> People self-censor their third idea, and the third idea is often the one nobody else in the room wrote down. Second, when you run the sanity check: <i>"If your lifts land on exactly the gap, you didn't estimate them — you worked backwards from the target."</i> Almost every group does this, including the Nimbus worked example in the tracker, which now flags itself for exactly that reason. It is not cheating and it is not a failure; it is the single most common way a plan gets built, and naming it once here is what makes them size the strongest bet on its own and offer the rest as headroom.<br><br><b>Then make them cost it.</b> Person-weeks on every bet, and one honest number for what a point of the KPI is worth per month. On Nimbus that is 320 more verified users per point, 52.5% of whom activate, at $1.92 a month for about 2.7 months — roughly <b>$884 a month per point</b>, and the tracker does the rest. Two things fall out. First, <b>costing a plan does not always reorder it — and the honest move is to say so</b>. Here the ICE order 378, 320, 245, 224 maps onto paybacks of 8, 10, 12 and 13 months in that exact sequence, and onto year-one returns of $1.75, $1.23, $1.02 and $0.98 in that sequence too. Do not fish for a disagreement that is not there — the agreement <i>is</i> the finding, and the tracker will say so on screen. What the money adds is the line ICE cannot draw: the fourth bet returns <b>$0.98 for every $1 in year one</b> and pays back in month 13, so it never washes its face inside the year. A ranking gives you an order; only the cost tells you whether the last one should be built at all. And the agreement is a fact about this plan, not a law — halve the Android camera build to six weeks in the tracker and its payback drops from 12 months to 7, moving it from third to first on an ICE score that never changed. Worth doing live if the room is quick. Second, and harder: <b>a lift stacks, it does not land</b>. Month one of the whole plan is worth $6.5k, not the $17.7k plateau. Anyone who quotes the plateau as a launch-month number is overstating that month by 2.7x — and, interestingly, overstating <i>year one</i> by only about 8%, because ten of the twelve months really are at plateau. Both numbers are true; know which one you are saying.<br><br><b>The denominator is the lesson; the arithmetic is just bookkeeping.</b> That $884 quietly assumes the fix reaches all 32,000 sign-ups. Most of the room will have diagnosed something narrower in Exercise 3 — an Android problem, a driving-licence problem, a Moldova problem — and a fix scoped to a segment earns a point <i>of that segment</i>. The workbook now refuses to price anything until they name the scope and its size: type "Android sign-ups" and 17,500 and the same +1pp is worth <b>$483</b> a month, not $884 — and if they proved the narrower thing, driving licences on Android, that is 5,400 sign-ups and <b>$149</b>. Fifty-five percent of the sign-ups is fifty-five percent of the money; seventeen percent is seventeen percent. The share and the money move together exactly, which is the whole trick — and a <b>5.9×</b> spread hides behind three identical-looking "+1pp"s. Say the uncomfortable half out loud too: <i>the better your evidence, the smaller your number</i>. A pair that proves something narrow and prices it honestly will quote less money than a pair that proved nothing and priced everybody, and the first pair is the one you fund. Say the sentence out loud once — <i>"a rate has no value until you say whose"</i> — and then let two guards do the teaching for you: a scope larger than the whole funnel is refused rather than priced, and a value-per-point that does not square with the population they typed gets called out on screen with the number it should have been. This is the most common way a good diagnosis becomes an indefensible business case: the analysis is scoped to a segment and the money is quietly scoped to everybody. It is also the most common way a plan gets <i>under</i>-sold — a pair who scoped honestly to 17,500 and then pitches $483 should be asked whether the rebuild really is Android-only, because if the capture screen is shared the scope was too tight and the money was left on the table. Wrong in either direction is the same error.<br><br><b>The question nobody asks: build or buy?</b> Initiative (1) — auto-capture, glare and edge detection, retry with a reason, client-side compression — is a feature-by-feature description of what <b>Onfido, Veriff, Sumsub and Persona</b> sell as a drop-in SDK. Fourteen person-weeks of your own engineers is a legitimate answer; it is only legitimate <i>after</i> someone has said the words. Ask any group whose plan rebuilds a commodity: "what does the vendor charge per verification, and how many weeks does integrating cost?" In regulated fintech the honest answer is usually buy the capture, build the recovery flow around it — the second is your product, the first is not.`},

{section:4,html:`<div class="pad">
  <div class="kicker">Move 4 · Before you commit</div>
  <h2>Pressure-test the plan before you pitch</h2>
  <div class="two">
    <ul>
      <li><b>ICE is a conversation, not a measurement.</b> Three gut-feel scores multiplied <i>looks</i> precise — use it to rank and argue, never to forecast.</li>
      <li><b>"Expected +10pp" is a hypothesis, not a result.</b> Plan the experiment that proves it — an A/B test or holdout. Done = the number moved <i>and</i> you can attribute it.</li>
      <li><b>Vanity precision is a trap.</b> Two decimals on a guess is still a guess.</li>
    </ul>
    <div class="card" style="align-self:center">
      <h3>Ask of every initiative</h3>
      <ul style="margin-top:2px">
        <li style="font-size:16px">What would prove this <b>wrong</b>?</li>
        <li style="font-size:16px">How exactly will we <b>measure</b> the lift?</li>
        <li style="font-size:16px">What's the <b>smallest test</b> that de-risks it?</li>
      </ul>
      <div class="note" style="margin-top:6px">Confidence in your ICE score should come from the Exercise-3 evidence — not optimism.</div>
    </div>
  </div>
</div>${foot('Pressure-test · rigor')}`,
 notes:`This defends against the most seductive failure mode: a plan that <b>looks</b> rigorous because it has numbers, but the numbers are invented. Push each pair — "how would you actually know this worked?" If they can't name a measurement, the initiative isn't ready to pitch. Introduce holdouts / A-B testing briefly.`},

/* ---- Move 5 ---- */
{section:4,html:`<div class="pad">
  <div class="kicker">Move 5 · Concept · learn on Bloom</div>
  <h2>The client story that wins the work</h2>
  <div class="two">
    <ul>
      <li><b>Situation</b> — the goal and North Star in one line.</li>
      <li><b>Evidence</b> — the funnel + the feedback. Show, don't tell.</li>
      <li><b>Diagnosis</b> — the one bottleneck and its cause.</li>
      <li><b>Plan</b> — the objective and ranked initiatives.</li>
      <li><b>Impact</b> — what the numbers become if it works.</li>
      <li><b>The ask</b> — exactly what you want them to approve.</li>
    </ul>
    <div class="card">
      <div class="tag" style="background:#eafaf1;color:var(--good)">📗 Bloom's story in one breath</div>
      <p style="margin-top:10px"><b>Situation:</b> grow repeat revenue. <b>Evidence:</b> only 30% of carts check out; reviews beg for guest checkout &amp; Apple Pay. <b>Diagnosis:</b> a forced account + card-only gate. <b>Plan:</b> guest checkout + wallets first (ICE-ranked).</p>
      <p style="margin-top:10px;color:var(--indigo);font-weight:700">Impact: guest checkout alone, +10pp on the checkout step — 22,000 carts × 10pp = <b>+2,200 orders/mo</b>, at a $45 average order ≈ <b>+$99k/mo</b> once it is fully rolled out. Ask: one sprint to ship guest checkout + Apple/Google Pay, first A/B in 2 weeks.</p>
      <p style="margin-top:8px;font-size:.86em;opacity:.75">One bet, sized on its own, with its assumption on the slide. The wallets are headroom, not an addition — and "once it is fully rolled out" is doing real work: month one is worth a fraction of it.</p>
    </div>
  </div>
</div>${foot('Move 5 · Client story')}`,
 notes:`Credibility wins engagements: evidence-first, numbers-first, no hype. Read the Bloom story aloud — notice it's one breath, every claim sourced, ends on a single ask with a number. That's the shape. Then they draft Nimbus's story; the model answer (Nimbus client deck) comes right after.`},

{cls:'ex',section:4,mins:30,html:`<div class="pad">
  <div class="exbadge">✍️ Exercise 5 · apply to Nimbus · 30 min</div>
  <div class="exhow"><span>🧍 Solo draft <b>10m</b></span><span class="ar">→</span><span>👥 Pair <b>12m</b></span><span class="ar">→</span><span>🗣 Share-out <b>8m</b></span></div>
  <h1>Draft the client story</h1>
  <div class="two" style="grid-template-columns:1fr 1.28fr">
    <ul>
      <li><b>Solo (10 min):</b> outline a <b>6–8 slide</b> client deck on the arc: Situation → Evidence → Diagnosis → Plan → Impact → Ask. One sentence per slide.</li>
      <li>Strongest <b>evidence</b> (funnel + one feedback chart), <b>impact</b> in users <i>and</i> money, and a crisp <b>ask</b>.</li>
      <li><b>Pair (12 min):</b> pitch in 90 seconds. Your partner plays the client and asks <b>all five</b> — no softening. Swap, then merge.</li>
    </ul>
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div>
        <span class="pill">📄 Workbook → Exercise 5</span>
        <div class="note" style="margin-top:10px"><b>The client asks all five:</b><br>① "Your Android number could be broken tracking. Convince me it's real."<br>② "How much of that 60% is compliance saying no on purpose?"<br>③ "Your lifts land exactly on the gap. Which <i>one</i> bet gets the money?"<br>④ "What does it cost, and when's payback?"<br>⑤ "+6,400 — all users, or your diagnosed group?"<br><b>"We'd have to check" is week one of the work. On ② no dashboard knows — give a method and a date.</b></div>
      </div>
      ${qrMini('wb','Scan → workbook','#ex5')}
    </div>
  </div>
  <div class="note" style="margin-top:8px">⚡ <b>Pro tip:</b> <b>Export</b> your outline into <b>Cowork</b> → "build a client deck from this". AI drafts it; <b>you own every claim</b>.</div>
</div>${foot('Exercise 5 · Nimbus')}`,
 notes:`Time-boxed and lighter. The goal is a tight narrative, not polished slides. <b>The pair phase is the real exercise here</b> — rehearsing to a live sceptic is the closest thing in the room to the actual client meeting, and it's why both people draft first: you need two stories to stress-test, not one. Enforce the 90-second limit and the role swap.<br><br>The five questions are not decoration and they are not generic — they are the genuinely weak joints in the Nimbus case, and a pair that can answer them can defend this in a real room. ① is the instrumentation confound, and the strong answer settles it in the funnel before it mentions a review: a verification event that under-fired on Android would inflate every later rate, yet the later steps track iOS within about two points; and splitting verification in two puts 97% of the gap <i>after</i> the photo is submitted, which a dropped event cannot do. The reviews and tickets then corroborate from a genuinely separate source — a broken event does not make people write about glare — but they are the second witness, not the first. ② is the ceiling, and it is the one question here that <b>the dashboard cannot answer at all</b> — which is exactly why it belongs in the set. The drop is a single bucket, <b>"photo rejected / app crash on upload", 11,712 of the 19,200 who leave</b>, and that bucket merges a compliance decline with a glare rejection and a failed upload. Any share read off this screen is invented, so listen for three moves instead of a number. First, saying plainly that the split is not instrumented. Second, bounding the winnable part with the one comparison the data <i>does</i> support: <b>compliance rules do not know which handset you are holding</b>, so the platform gap cannot be policy — Android gets 7,900 of 15,800 photos accepted (50%) against iOS 9,508 of 13,320 (71%), and closing only that gap is about <b>3,400 more accepted photos a month</b>, roughly <b>2,200 more verified users</b> at Android's own liveness pass-through, none of which any regulator is refusing. That is a floor on the prize, derived rather than guessed. Third, naming what turns the ceiling into a number and when: a reason code on the rejection event — policy / image quality / technical, terminal or retried — which is days of work, and one conversation with risk &amp; legal, which is an afternoon. A pair that says "we'd have to check" and then gives the method and the date has answered it like a senior PM; a pair that quotes a confident share has just made one up in front of the client. Worth saying out loud afterwards: <b>the plan does not hinge on the answer</b> — auto-capture, the crash fix and retry only ever touch the recoverable share, so a bigger compliance floor shrinks the prize without invalidating a single bet. ③ is the additivity trap from the ICE slide: the strong answer picks <b>one</b> bet, sizes that bet alone, and offers the rest as headroom. ④ is the one most rooms have no answer to at all, which is why it is here: a strong answer is a number and a date — "37 person-weeks, about $148k, paying back roughly 10 months after it ships" — and a weak one is any sentence about value that never mentions a cost. If a pair cannot cost their plan, that is not a presentation problem, it is an unfinished plan, and it is far cheaper to discover it in this room than in the client's. ⑤ is the scope question the whole day has been building to: "+6,400 verified" is a claim about all <b>32,000</b> sign-ups, and a pair whose Exercise-3 evidence was Android-only has to either widen the fix and say why it reaches everyone — bet ① is a rebuild for all users, so it does — or shrink the number to the 17,500 it actually covers. Diagnosing 17,500 and billing for 32,000 is the slide a client's finance lead unpicks in week three. Insist the sceptic actually asks all five — the instinct in a friendly room is to go easy, and going easy is what makes the exercise worthless. Point out the AI tip: export the workbook JSON, hand it to Cowork to generate the first slide draft, then edit and own it — that is the real-world workflow. In share-out, have 2–3 pairs read their <b>Situation</b> and <b>Ask</b> aloud — those two lines reveal whether the story lands. Then reveal the model answer.`},

/* ===================== SECTION 5 · WRAP-UP ===================== */
{cls:'dark',section:5,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">Part 5</div>
  <h1>Reveal &amp; debrief</h1>
  <p class="big" style="max-width:760px">Compare your Nimbus plan with a finished, client-ready model — then consolidate what transfers to your real work.</p>
</div>${foot('Part 5 · Reveal & debrief')}`,
 notes:`Short breath before the payoff. Set up the reveal as "a strong answer, not the only answer" — you want them comparing structure and rigor, not scoring themselves.`},

{cls:'dark',section:5,html:`<div class="pad" style="justify-content:center">
  <div class="kicker">The reveal</div>
  <h1>Now compare with the model answer</h1>
  <div class="two" style="align-items:center">
    <div>
      <p class="big" style="max-width:520px">Open the <b>Nimbus client deck</b> — a finished, client-ready version of exactly what you just outlined. Not "the right answer", but <i>a</i> strong one to steal structure and phrasing from.</p>
      <ul style="margin-top:6px">
        <li>Every claim shows its evidence</li>
        <li>The objective → initiatives → impact chain</li>
        <li>The single, specific ask at the end</li>
      </ul>
      <p style="margin-top:12px"><a href="https://wolfpackdigitalapps.github.io/data-analysis-workshop/nimbus-client-deck.html" target="_blank" style="color:#a5a1ff;font-weight:700;border-bottom:2px solid var(--pink);padding-bottom:2px">▶ Open the model client deck</a></p>
    </div>
    <div style="flex:0 0 210px">${qrMini('cd','Scan → client deck')}</div>
  </div>
</div>${foot('Reveal · model answer')}`,
 notes:`Walk the model client deck for ~8 minutes — open it from the link or scan the QR. Explicitly compare to what the pairs produced — praise where theirs was sharper, note anything missed (usually: quantifying impact in money, or a fuzzy ask). Reassure: the model is a reference, their reasoning is what matters.<br><br><b>If someone counts the slides, say it first.</b> You briefed 6–8; the model runs nine plus a cover. The ninth is "Where the 20 points come from", and it is there because the deck claims 40% → 60% <i>and</i> concedes that Android at full iOS parity still leaves 52% blended — two true numbers that would sit unjoined without it. That is the only good reason to spend a slide: an argument the audience would otherwise have to finish on your behalf. Grade their arc, not their count.`},

{section:5,html:`<div class="pad">
  <div class="kicker">🔒 Facilitator answer key · 1 of 4</div>
  <h2>Model answers — reading the data</h2>
  <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
    ${sol('1','Journey','Discover → Sign up → <b>Verify ID (gate)</b> → Link bank (gate) → First transaction → Return, in their own words. Lowest emotion sits on the verification gate — so the hypothesis is that users drop at KYC. <b>Six stages, ending at coming back</b>, is the answer to grade hardest: Exercise 2 builds its funnel from this list, so a journey that stops at the first payment produces a funnel that stops there too, and the pair never sees the 50% repeat rate.')}
    ${sol('2','Funnel','50k → 32k (64%) → <b>12.8k = 40% at KYC — the worst step</b> → 9.6k (75%) → 6.72k (70%) → 3.36k repeat within 30d (50%). Overall install→first-transaction is 13.4%; carry it one stage further and only 6.7% come back. KYC is also the biggest single loss (~19,200) — on Nimbus the steepest rate drop and the biggest absolute loss are the same step, which is <i>not</i> generally true (see Bloom, where they are not). The 50% repeat rate is the one step that says the product works for the people who reach it, which is what makes fixing the gate worth doing — but it is only on the sheet if they drew the stage in Exercise 1.')}
  </div>
  <div class="note" style="margin-top:16px"><b>How to use these four slides.</b> Don't project them before the pairs have attempted each exercise. There is no single right answer — reward the <i>reasoning</i>: a claim with a number attached, a number with an <b>n</b> attached, and a conclusion that survived someone trying to break it. This slide is the read; <b>2 of 4</b> is the diagnosis (Ex 3, the longest debrief of the day); <b>3 of 4</b> is the one cut most rooms never make; <b>4 of 4</b> is the response (Ex 4–5).</div>
</div>${foot('Facilitator answer key · 1 of 4')}`,
 notes:`Your cheat-sheet for the debriefs — <b>don't project it before the pairs attempt each exercise</b>. There isn't one "right" answer, but a strong pair lands close to these. These two are the <i>read</i>: what the journey looks like and what the funnel actually says.<br><br><b>Common miss.</b> Ex 2: flagging install&rarr;signup (64%) instead of KYC — worth pausing on, because it is the most instructive wrong answer of the day. That step loses 18,000 people and KYC loses 19,200, so KYC wins on absolute loss too, but only just; what actually settles it is that 36% of a step dropping is normal and 60% is not.<br><br>The diagnosis is on the next slide, the cut almost nobody makes after that, and the plan and client story last.`},

{section:5,html:`<div class="pad">
  <div class="kicker">🔒 Facilitator answer key · 2 of 4</div>
  <h2>Model answers — the diagnosis</h2>
  <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
    ${sol('3','Bottleneck','KYC — specifically the <b>ID-photo-capture screen</b> (61% of the drop; confirm it in Flows), worst on <b>Android (30.1% vs iOS 52.0%)</b>. Strong pairs go one level deeper, by one of two routes.<br><b style="color:var(--navy)">Route A — split the step.</b> Android reaches the ID-photo screen almost as often as iOS and then fails approval, so ~97% of the platform gap opens <i>after</i> the photo is submitted: a capture-quality problem, not a drop-off problem.<br><b style="color:var(--navy)">Route B — hold something still.</b> Funnels → Platform × ID type: standardising Android to the iOS document mix moves it only 30.1% → 30.7%, so document mix explains 0.7 of the 21.9 points and the gap really is the platform. That same table hides the real interaction — <b>driving licences on Android convert at 17.0% against the 21.0% the two margins predict, while on iOS they beat prediction (42.1% vs 36.4%)</b>.<br><b style="color:var(--navy)">The country trap — hunt for it.</b> Romania 41.8% against Moldova 33.5% reads as a market problem until they <i>build</i> it: <b>+ Add comparison</b> → Platform = Android, then <b>＋ and…</b> → Country = Moldova, against the same chip carrying Romania. Held at Android the two land at <b>29.2% and 30.2%</b> — 8.3 points collapse to about one, inside the margin at those sample sizes. Moldova is not worse; Moldova is more Android. A pair reporting the aggregate gap as a finding did the arithmetic right and the analysis wrong.<br><b style="color:var(--navy)">Do not credit</b> \'Android + paid social (22%)\': that cell is 21.0% under a no-interaction model — two weak margins multiplying, not a finding. Two <i>independent</i> witnesses only: the event stream (funnel + segments + Flows is <i>one</i> source read three ways) and the users (34% of reviews, 41% of tickets).<br><b style="color:var(--navy)">Two things every pair owes you.</b> An <b>n before a verdict</b> — at n≈180 the 95% margin is ±6.7 points, so a five-point gap is a coin flip in a suit, and the workbook prints that margin live as they type. And <b>a hypothesis they killed</b> — Exercise 3 will not mark complete without one, because a diagnosis with no casualties usually means nothing was tested. Extra credit for the pair who first asked whether the Android event was even firing, and answered it from the funnel rather than the reviews.')}
  </div>
</div>${foot('Facilitator answer key · 2 of 4')}`,
 notes:`The richest debrief of the day, and the one to give the most time to. Exercise 3 is where the room stops reading charts and starts doing analysis, so the answer key is long on purpose — you will not use all of it, and you should not try to.<br><br><b>The one thing to land, if you land nothing else:</b> a one-dimension gap is a <b>candidate, not a cause</b>. Every route above is the same move — hold something still and watch whether the gap <b>survives</b>, <b>dissolves</b> or <b>reverses</b>. The platform gap survives (standardising the document mix moves it 0.7 of 21.9 points). The country gap dissolves (8.3 points down to about one once both sides are held at Android). Both are correct outcomes; only one of them is a finding, and the room needs to feel the difference rather than be told it.<br><br><b>Common misses.</b> Stopping at the red bar without triangulating. Counting funnel + segments + Flows as three independent witnesses when they are one event stream read three ways. Quoting a gap without its n — push back every single time, because it is the habit the day is really trying to build. And the subtle one: a pair who builds the comparison, watches the gap dissolve, and then reports the original gap anyway because it was the more exciting slide.<br><br><b>If the room is fast</b>, ask what would have to be true for the country gap to be real, then have them check it — the answer is that Moldova would still have to be behind <i>within</i> each platform, and it is not. That is a two-minute detour that teaches confounding better than any slide.<br><br><b>Before you move on, look at the next slide even if you never project it.</b> There is one more cut in this dataset — device model, then app version — and it does not just sharpen the diagnosis, it changes what gets shipped on Monday. Most rooms will not have found it. You should know it is there while you are circulating.`},

{section:5,html:`<div class="pad">
  <div class="kicker">🔒 Facilitator answer key · 3 of 4</div>
  <h2>Model answers — the cut almost nobody makes</h2>
  <div style="font-size:15px;color:var(--slate);line-height:1.5;margin-top:2px">Exercise 3 ends at “Android”. One more cut asks <b style="color:var(--navy)">which Android</b>; the next asks <b style="color:var(--navy)">since when</b>. Both dimensions are sitting on the dashboard.</div>
  <table class="rhythm">
    <tr><th>KYC rate by app version</th><th>Budget Android<br>A-series · Redmi</th><th>Flagship Android<br>S · Pixel · other</th><th>iPhone</th></tr>
    <tr><td>4.2.9</td><td>35.8%</td><td>35.9%</td><td>52.0%</td></tr>
    <tr><td>4.3.0</td><td style="color:var(--bad);font-weight:800">14.1%</td><td>36.0%</td><td>52.0%</td></tr>
    <tr><td>4.3.1 <span style="color:var(--muted);font-weight:400">· current</span></td><td style="color:var(--bad);font-weight:800">13.9%</td><td>36.1%</td><td>52.0%</td></tr>
  </table>
  <div style="font-size:14.5px;color:var(--slate);line-height:1.5;margin-top:12px"><b style="color:var(--navy)">4.3.0 broke ID capture on low-end Android hardware, and 4.3.1 did not fix it.</b> Nothing else moved. That is <b>4,671</b> sign-ups converting at <b>14.0%</b> where they used to convert at 35.8% — <b>1,015 verified users</b>, <b>3.2 of the 20 points</b>, and Android <b>30.1% → 35.9%</b> the week it is reverted. Not a quarter of engineering. A revert.</div>
  <div class="note"><b>The release, or the calendar?</b> Sign-up week shows the same collapse — Jun 30 <b>43.1%</b>, Jul 7 <b>37.6%</b> — because the rollout and the calendar are the same rows read twice. What separates them is the column that did <i>not</i> move: flagship Android runs 35.9 · 35.8 · 36.0 · 35.9 · 36.6 straight through those weeks, which rules out everything that would hit every handset alike — a traffic-mix shift, a campaign, a season — and leaves the one explanation that only touches the devices running the new code path. <b>Hold the week still and the version still matters; hold the device still and the week stops mattering.</b></div>
</div>${foot('Facilitator answer key · 3 of 4')}`,
 notes:`Hold this one back. It is the only reveal in the deck most rooms will not have reached on their own, and projecting it early turns Exercise 3 from an investigation into a quiz.<br><br><b>Ask the question first: “is Android one thing?”</b> Then give them thirty seconds. Device model and App version are both on the dashboard, and a pair that has already proved the platform gap can get here in two comparisons.<br><br><b>Why this matters more than the rest of the key.</b> Everything else here produces a better <i>diagnosis</i>. This produces a different <i>decision</i>. The top of the ICE list is a twelve-week rebuild; this is days. It is the cleanest example in the kit of ranking and sequencing being two different calls — the revert ships first no matter where it scores — and of the overlap rule, because a rebuilt capture flow would eventually have rescued most of these same users, so the 3.2 points and bet ①’s 10 do <b>not</b> add up.<br><br><b>Do not let it kill the rebuild.</b> On 4.2.9, before any regression, budget Android still ran 35.8% against iPhone’s 52.0%. The structural capture weakness is real and predates every release in this dataset. The revert takes back what a release lost; the rebuild is what closes the rest.<br><br><b>If nobody found it</b>, that is the debrief: what would you have had to do to find this, and why didn’t you? The honest answer is almost always that they stopped at the first dimension that showed a gap — the habit the whole day exists to break, arriving one last time with money attached.`},

{section:5,html:`<div class="pad">
  <div class="kicker">🔒 Facilitator answer key · 4 of 4</div>
  <h2>Model answers — the response</h2>
  <div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
    ${sol('4','Plan','Objective <b>KYC 40% → 60%</b>. ICE-ranked: ① Rebuild ID-capture UX (378) · ② Expectations + soft-fail (320) · ③ Fix Android camera (245) · ④ Recover abandoners (224) — nominally covering +20pp, which is a ceiling, not a forecast. <b>The parity trap:</b> lifting Android all the way to iOS’s 52% still only reaches <b>52% blended</b> (9,100 + 7,540 of 32,000). 60% needs about +20pp on <i>both</i> platforms — which is exactly why ① is a rebuild for everyone, not an Android patch. Guardrail: on-time advance repayment stays at or above 92% — it is 94% today (4,295 of 4,570), it is on the dashboard under Cohorts, and it is the number that moves if you loosen the gate to hit the target. <b>Scope the money to the population the fix reaches.</b> ① is a rebuild for everyone, so a point is worth the all-users <b>$884</b>/mo at plateau — but a plan scoped to Android is pricing a point of <b>17,500</b> sign-ups, which is <b>$483</b>, and one scoped to driving licences on Android is pricing 5,400, which is <b>$149</b>. Credit the pair whose scope and whose money are the same population; mark down the pair that diagnoses Android and then bills for 32,000.')}
    ${sol('5','Client story','Situation → Evidence → Diagnosis → Plan → <b>Impact: +6,400 verified → +3,360 activations/mo ≈ +$6.5k in month one, ≈ +$18k/mo once the cohorts stack</b> (revenue per activated user is <b>$1.92 a month</b>; the familiar $5.26 is $35,340 &divide; 6,720, which is a <i>lifetime</i> value because 6,720 is a monthly flow and the activated base is 18,400) → a single Ask (one-quarter sprint, 2 mobile eng + 1 designer; first win in <b>week one</b> — the 4.3.0 revert, which costs days and sits outside the 37 person-weeks — and the first <i>build</i> win in week two). A strong answer <b>names the month</b> — and <b>names the population</b>: "+6,400 verified" is a claim about all 32,000 sign-ups, so a pair who diagnosed an Android-only cause has to either widen the fix or shrink the number. The finished version is the model client deck.')}
  </div>
</div>${foot('Facilitator answer key · 4 of 4')}`,
 notes:`The <i>response</i> half — what to do about the diagnosis, and how to get it funded. This is where plans stop being lists and start being arguments.<br><br><b>Common misses.</b> Ex 4: initiatives that don't add up to the target, or that add up <i>exactly</i> to it (a plan that lands on the number to the decimal has been reverse-engineered from the number), or that have no guardrail at all. Ex 5: burying the ask, omitting the money, or sizing it with ARPU instead of revenue per activated user — the $5.26 trap, which is a lifetime figure wearing a monthly costume.<br><br><b>The new one to watch for, and it is now the most common.</b> A pair diagnoses something narrow in Exercise 3 — Android, driving licences, one country — and then sizes the win on all 32,000 sign-ups because that is the number on the dashboard. The analysis is scoped and the business case is not. Ask one question: <i>"a point of what, measured on whom?"</i> On Nimbus a point of the 17,500 Android sign-ups is worth about <b>$483</b> a month at plateau against <b>$884</b> for a point of everybody, and a point of the 5,400 driving-licence-on-Android sign-ups is <b>$149</b> — <b>5.9&times;</b> across the ladder, behind three identical-looking "+1pp"s. The workbook will not price anything until they type the scope and its size, and it flags a value-per-point that does not square with the population they named. The error runs both ways: a pair who scoped honestly to Android and then pitches $483 for a rebuild that fixes the shared capture screen has undersold their own plan.<br><br>The one-page rubric (facilitator-rubric.html) has the fuller "what good looks like / common misses" for all five, and it is the thing to have open while you circulate.`},

{section:5,html:`<div class="pad">
  <div class="kicker">What you learned</div>
  <h2>The whole method, on one page</h2>
  <div class="two">
    <ul>
      <li><b>Journey → Funnel.</b> Map the path to value, then measure it. Step vs overall conversion; find the cliff and size the prize.</li>
      <li><b>Bottleneck by triangulation.</b> Funnel (where) + segment (who) + Voice of customer (why) converging = a diagnosis. Fix the cause, not the symptom.</li>
      <li><b>Read a real analytics tool.</b> Ten reports, one question each — three boards (Overview, Acquisition, Monetization), four reports (Insights, Funnels, Retention, Flows), Cohorts &amp; Users, and Voice of customer. Pick the report from the question, never the other way round.</li>
    </ul>
    <ul>
      <li><b>Objective → Initiatives → Actions.</b> Done = the number moved. Several bets per objective, each with a hypothesis and expected pp.</li>
      <li><b>Prioritise with ICE</b>, then <b>pressure-test</b>: name the experiment, the measurement, and a guardrail.</li>
      <li><b>The client story:</b> Situation → Evidence → Diagnosis → Plan → Impact → Ask — every claim sourced, ends on one number and one ask.</li>
    </ul>
  </div>
  <div class="note">You ran this on two products — a plant shop and a money app. Same five moves. That's the point: it's a loop you own now, not Nimbus trivia.</div>
</div>${foot('What you learned')}`,
 notes:`The consolidation slide — spend a couple of minutes here. Go left-to-right and have the room fill in the blanks from memory ("what were the three legs of a diagnosis?"). This retrieval practice is what makes it stick. Tie each item back to the exercise where they did it.`},

{section:5,html:`<div class="pad">
  <div class="kicker">Principles &amp; pitfalls</div>
  <h2>What to carry into real work</h2>
  <div class="two">
    <div><h3 style="color:var(--good)">Principles</h3><ul>
      <li><b>Done = the number moved.</b></li>
      <li><b>Triangulate</b> with sources that can fail <b>independently</b> — what users do, and what users say.</li>
      <li><b>Fix causes, not symptoms.</b></li>
      <li><b>Every claim traces to a source.</b></li>
      <li><b>Rule out the boring explanation first</b> — a broken event, a changed definition, a bad date range.</li>
      <li><b>Size the bet on its own</b>, then offer the rest as headroom.</li>
    </ul></div>
    <div><h3 style="color:var(--bad)">Pitfalls</h3><ul>
      <li>Trusting a <b>blended average</b> — always segment.</li>
      <li><b>Volume dazzle</b> — most users ≠ best users.</li>
      <li><b>Solutioning first</b> — a fix before a diagnosis.</li>
      <li><b>Vanity metrics</b> — numbers with no decision attached.</li>
      <li><b>Three charts off one event stream.</b> They agree because they're the same data, not because they corroborate.</li>
      <li><b>Lifts that add to exactly the gap</b> — a number worked backwards from the target.</li>
      <li><b>Assuming the rest of the product holds still</b> while you fix one segment.</li>
    </ul></div>
  </div>
</div>${foot('Principles & pitfalls')}`,
 notes:`Recap crisply and keep it moving — the commitment slide next is where the room does the talking. Land the meta-point here: this loop works on <i>any</i> product they own, and the Nimbus and Bloom specifics were only ever vehicles.`},

{section:5,mins:5,html:`<div class="pad">
  <div class="kicker">Wrap-up · make it survive Monday</div>
  <h2>One commitment each, out loud, before you leave</h2>
  <div class="two" style="margin-top:6px">
    <ul>
      <li><b>The failure mode of a good workshop</b> is that everyone agrees it was useful and nobody opens an analytics tool again. The loop sticks only if it gets used once, on something real, within a week.</li>
      <li><b>Write it, then say it.</b> Three minutes alone, then one sentence each around the room. Saying it out loud, to people you actually work with, is the mechanism.</li>
      <li><b>Make it small enough that "no time" isn't available.</b> One funnel. One weak step. One segment split. Twenty minutes — not a project, and not something you need permission for.</li>
      <li><b>Then book it before you stand up.</b> Put the twenty minutes in your calendar and have your partner do the same. An intention with no slot in the week is a wish.</li>
    </ul>
    <div class="card" style="align-self:center">
      <h3>The sentence</h3>
      <p style="font-size:18px;color:var(--navy);font-weight:600;line-height:1.4">"By <span style="color:var(--pink)">[date]</span>, I'll pull the <span style="color:var(--pink)">[funnel]</span> for <span style="color:var(--pink)">[product]</span>, segment its worst step, and bring <span style="color:var(--pink)">[a named person]</span> one diagnosis with a number in it."</p>
      <div class="note" style="margin-top:10px">No new tools, no budget, no deck. If you can't name a product yet, use Nimbus — it stays live forever, and a practice rep still counts.</div>
    </div>
  </div>
</div>${foot('Your commitment')}`,
 notes:`Five minutes, and do not cut it — this is the only slide that changes what happens after today. Run it as <b>write, then say</b>: three minutes of silence with the sentence on screen, then a fast lap of the room, one sentence each, no discussion and no commentary from you beyond "good".<br><br>Two things to enforce. <b>Scope</b> — if someone says "I'll audit our onboarding funnel", push back, because that is a project and projects need permission and a free week. What survives contact with Monday is one funnel, one step, twenty minutes. <b>A named person</b> — "I'll look into it" has no deadline attached; "I'll show Ana on Thursday" does. Have partners swap their two sentences and put the calendar hold in before they leave the room; you will get more follow-through out of that thirty seconds than from anything else you say today.<br><br>Write the commitments down as they are said. A single message a week later — "you said you'd pull the signup funnel, how did it go?" — is what turns a good afternoon into a change in how someone works. It costs you ten minutes and it is the highest-leverage thing you will do with this deck.`},

/* engine */
let i=0;
const stage=document.getElementById('stage');
SLIDES.forEach((sl,idx)=>{const d=document.createElement('div');d.className='slide '+(sl.cls||'');d.innerHTML=sl.html;d.dataset.i=idx;stage.appendChild(d);});
const slideEls=[...document.querySelectorAll('.slide')];
/* section bar */
function paintSecbar(){
  const bar=document.getElementById('secbar');
  bar.innerHTML=SECTIONS.map((sc,si)=>{
    const first=SLIDES.findIndex(x=>x.section===si);
    const cur=SLIDES[i].section===si;
    return `<div class="sec ${cur?'on':''} ${si<SLIDES[i].section?'done':''}" onclick="show(${first})"><span class="sn">${si+1}</span>${sc[0]} <span class="sm">· ${sc[1]}m</span></div>`;
  }).join('')+`<div class="sp"></div><div id="timer" onclick="timerToggle()" ondblclick="timerReset()" title="Section timer — click: start/pause · double-click or R: reset to this section's budget"><span class="tl">⏱</span><span class="tv">--:--</span></div>`;
}
/* section timer */
/* PER-SLIDE BUDGETS.
   SLIDES carry `mins` only where the run-sheet names a fixed block — the five
   exercises, mostly. Every other slide fell back to its whole SECTION's budget,
   so a two-minute slide inside "The 5 moves" offered the facilitator a 160:00
   clock. A timer that is wrong by two orders of magnitude is not a timer; it is
   an ornament, and it gets ignored from minute one along with the pacing it was
   supposed to protect.
   So: hand each section's fixed blocks their stated minutes, then split what is
   left evenly across that section's unlabelled slides. The remainder goes to the
   earliest slides, because the front of a section is where a room asks its
   questions. */
const BUDGET=(()=>{
  const out=new Array(SLIDES.length).fill(0);
  SECTIONS.forEach((sec,s)=>{
    const idxs=SLIDES.map((sl,k)=>sl.section===s?k:-1).filter(k=>k>=0);
    if(!idxs.length)return;
    const fixed=idxs.filter(k=>SLIDES[k].mins>0), free=idxs.filter(k=>!(SLIDES[k].mins>0));
    fixed.forEach(k=>{out[k]=SLIDES[k].mins;});
    if(!free.length)return;
    let rem=sec[1]-fixed.reduce((a,k)=>a+SLIDES[k].mins,0);
    /* an over-booked section would otherwise hand out zero- or negative-minute
       slides; one minute each is wrong but visibly wrong, which is the better
       failure. The deck's own test asserts this branch never fires. */
    if(rem<free.length)rem=free.length;
    const base=Math.floor(rem/free.length);
    let extra=rem-base*free.length;
    free.forEach(k=>{out[k]=base+(extra-->0?1:0);});
  });
  return out;
})();
let tLeft=BUDGET[0]*60, tRun=false, tInt=null, lastBud=BUDGET[0];
function fmtT(x){const m=Math.floor(Math.abs(x)/60),ss=Math.abs(x)%60;return (x<0?'−':'')+m+':'+String(ss).padStart(2,'0');}
function paintTimer(){const el=document.getElementById('timer');if(!el)return;el.querySelector('.tv').textContent=fmtT(tLeft);el.classList.toggle('run',tRun);el.classList.toggle('over',tLeft<0);}
function timerToggle(){tRun=!tRun;if(tRun&&!tInt){tInt=setInterval(()=>{if(tRun){tLeft--;paintTimer();}},1000);}paintTimer();}
function slideBudget(){return BUDGET[i]||SLIDES[i].mins||SECTIONS[SLIDES[i].section][1];}
function timerReset(){tLeft=slideBudget()*60;tRun=false;paintTimer();}
function show(n){
  const prevSec=SLIDES[i]?SLIDES[i].section:0;
  i=Math.max(0,Math.min(SLIDES.length-1,n));
  slideEls.forEach((el,idx)=>el.classList.toggle('on',idx===i));
  document.getElementById('cnt').textContent=(i+1)+' / '+SLIDES.length;
  document.getElementById('prog').style.width=((i+1)/SLIDES.length*100)+'%';
  document.getElementById('notes').innerHTML='<div class="nh">Facilitator notes · slide '+(i+1)+'</div>'+(SLIDES[i].notes||'—');
  paintSecbar();
  /* Re-arm on every move while stopped. The old guard only re-armed when the
     budget CHANGED, so walking from one 5-minute slide to the next left the
     clock showing whatever was left of the previous one — the facilitator read
     2:10 on a slide that had not started yet. A running clock is never touched:
     mid-exercise navigation must not reset the exercise. */
  const bud=slideBudget();
  if(!tRun){tLeft=bud*60;lastBud=bud;}
  paintTimer();
}
function next(){show(i+1)} function prev(){show(i-1)}
function toggleNotes(){document.getElementById('notes').classList.toggle('on')}
function toggleGrid(){const g=document.getElementById('grid');g.classList.toggle('on');}
// build grid
const g=document.getElementById('grid');
SLIDES.forEach((sl,idx)=>{const t=document.createElement('div');t.className='thumb';
  const title=(sl.html.match(/<h1[^>]*>(.*?)<\/h1>/)||sl.html.match(/<h2[^>]*>(.*?)<\/h2>/)||[,'Slide'])[1].replace(/<[^>]+>/g,'');
  t.innerHTML='<div class="tn">'+(idx+1)+' · '+SECTIONS[sl.section][0]+'</div><div class="tt">'+title+'</div>';
  t.onclick=()=>{show(idx);toggleGrid();};g.appendChild(t);});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key.toLowerCase()==='n'){toggleNotes();}
  else if(e.key.toLowerCase()==='o'){toggleGrid();}
  else if(e.key.toLowerCase()==='t'){timerToggle();}
  else if(e.key.toLowerCase()==='r'){timerReset();}
  else if(e.key==='Home'){show(0);} else if(e.key==='End'){show(SLIDES.length-1);}
});
/* Scale the fixed 1120x700 design box to the window — see SCALE TO FIT in the
   stylesheet. Capped at 1, so a big screen shows the deck at exactly the size
   it has always shown it. The 38 is .stage's top padding (the chrome bar); the
   20 leaves the same breathing room the old height:min(680px,92vh) left at
   1280x720, so nothing moves on the sizes that already worked. The 0.2 floor
   stops a collapsed or hidden window (height 0 during some window-manager
   transitions) from scaling the deck to nothing and never coming back. */
function fitSlides(){
  const k=Math.min(1,(innerWidth*0.94)/1120,(innerHeight-58)/700);
  document.documentElement.style.setProperty('--k',String(Math.max(0.2,k)));
}
addEventListener('resize',fitSlides);
fitSlides();
show(0);
QRKEYS.forEach(renderQR);

</script>
